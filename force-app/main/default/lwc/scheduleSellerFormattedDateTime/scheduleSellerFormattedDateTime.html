<template>
    <template lwc:if={hasStart}>
        <span style="white-space:nowrap;">
            <strong>Date:</strong>&nbsp;
            <lightning-formatted-date-time
                value={startDateTime}
                weekday="short"
                month="short"
                day="2-digit"
                hour="numeric"
                minute="2-digit"
                time-zone={timeZoneSidKey}
                >
            </lightning-formatted-date-time>
            <template lwc:if={hasEnd}>
                &nbsp;-&nbsp;
                <lightning-formatted-date-time
                    value={endDateTime}
                    hour="numeric"
                    minute="2-digit"
                    time-zone={timeZoneSidKey}
                    time-zone-name="short"
                    >
                </lightning-formatted-date-time>
            </template>
        </span>
    </template>
</template>
