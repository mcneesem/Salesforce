<template>
    <template if:true={isPEORelated}>
        <c-n-s-p_-project-task-category-selection-page record-type-id={selectedRecTypeId} show-pop-up="true" is-from-creation-page="true" project-id = {projectId} onhanldeselectedcatsubcat={handleRecordCreation}> </c-n-s-p_-project-task-category-selection-page>
    </template>

    <template if:false={isPEORelated}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{headerName}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-edit-form
                        onsuccess={handleSuccess}
                        onsubmit={handleSubmit}
                        onerror={handleError}
                        object-api-name="pse__Project_Task__c"
                        record-type-id={selectedRecTypeId}
                        density="compact"
                    >
                        <lightning-spinner if:true={isLoading}></lightning-spinner>
                        <lightning-layout-item size="12">
                            <div style="display: none;">
                                <lightning-input-field field-name="NSP_Category__c" value={selectedCategory} class="slds-hidden"></lightning-input-field>
                                <lightning-input-field field-name="NSP_Sub_Category__c" value={selectedSubCategory} class="slds-hidden"></lightning-input-field>
                                <lightning-input-field field-name="NSP_Detail__c" value={selectedDetail} class="slds-hidden"></lightning-input-field>
                                <lightning-input-field field-name="NSP_Version__c" value={selectedVersion} class="slds-hidden"></lightning-input-field>
                                <lightning-input-field field-name="pse__Milestone__c" class="slds-hidden"></lightning-input-field>
                            </div>
                        </lightning-layout-item>

                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box section-header-title slds-p-horizontal_small slds-truncate">{peoTaskInfoLabel}</div>
                        </lightning-layout-item>

                        <div class="slds-p-around_xx-small">
                                <lightning-layout>
                                    <lightning-layout-item size="6" class="slds-p-around_small">
                                        <lightning-input-field field-name="pse__Project__c" value = {projectId} required onchange={handleChange}> </lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" class="slds-p-around_small">
                                        <!-- Milestone Addition is moved to custom model -->
                                        <c-nsp_case-custom-look-up
                                        s-object-api-name="pse__Milestone__c"
                                        label="Milestone"
                                        icon-name = "standard:custom"
                                        parent-id = {projectId}
                                        onlookupupdate={handlelookupRecord}
                                        placeholder="Search Milestones...">
                                        </c-nsp_case-custom-look-up>
                                    </lightning-layout-item>
                                </lightning-layout>
                            <lightning-layout multiple-rows="true">
                                <template for:each={peoTaskInfoFields} for:item="field">
                                    <lightning-layout-item key={field.apiName} size={elementSize} class="slds-p-around_x-small">
                                        <div if:true={field.value}>
                                            <lightning-input-field field-name={field.apiName} required={field.required} value={field.value}> </lightning-input-field>
                                        </div>
                                        <div if:false={field.value}>
                                            <lightning-input-field field-name={field.apiName} required={field.required}> </lightning-input-field>
                                        </div>
                                    </lightning-layout-item>
                                </template>
                            </lightning-layout>
                        </div>

                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">Account</div>
                        </lightning-layout-item>

                        <div class="slds-p-around_xx-small">
                            <lightning-layout>
                                <lightning-layout-item size="6" class="slds-p-around_small">
                                    <lightning-input-field field-name="NSP_Account_Id__c" value = {projectAccountId}> </lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" class="slds-p-around_small">
                                    <lightning-input-field field-name="NSP_Visible_to_Client__c"> </lightning-input-field>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>

                            <!--Added as part of defect DF-03232-->
                            <template if:true={isRETProjectRecordType}>
                                <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                                    <div class="custom-box">Time Entry</div>
                                </lightning-layout-item>
                                <div class="slds-p-around_xx-small">
                                    <lightning-layout-item size="6" class="slds-p-around_small">
                                        <lightning-input-field field-name="Responsible_Party__c"> </lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" class="slds-p-around_small">
                                        <lightning-input-field field-name="Time_Entry__c"> </lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" class="slds-p-around_small">
                                        <lightning-input-field field-name="Time_Category__c"> </lightning-input-field>
                                    </lightning-layout-item>
                                </div>
                            </template>

                        <template if:true={isShowFieldServiceSection}>
                            <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                                <div class="custom-box section-header-title slds-p-horizontal_small slds-truncate">{fieldServiceInfoLabel}</div>
                            </lightning-layout-item>
                            <div class="slds-p-around_xx-small">
                                <lightning-layout multiple-rows="true">
                                    <template for:each={fieldServiceInfoFields} for:item="field">
                                        <lightning-layout-item key={field.apiName} size={elementSize} class="slds-p-around_x-small">
                                            <div if:true={field.value}>
                                                <lightning-input-field field-name={field.apiName} required={field.required} value={field.value}> </lightning-input-field>
                                            </div>
                                            <div if:false={field.value}>
                                                <lightning-input-field field-name={field.apiName} required={field.required}> </lightning-input-field>
                                            </div>
                                        </lightning-layout-item>
                                    </template>
                                </lightning-layout>
                            </div>
                        </template>

                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">Task Hierarchy</div>
                        </lightning-layout-item>

                        <div class="slds-p-around_xx-small">
                            <lightning-layout>
                                <lightning-layout-item size="6" class="slds-p-around_small">
                                    <lightning-input-field field-name="pse__Parent_Task__c" value = {projectTaskId}> </lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" class="slds-p-around_small">
                                    <lightning-input-field field-name="pse__Order__c"> </lightning-input-field>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>

                        <div if:true={showError} class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                            <span class="slds-icon_container slds-icon-text-error slds-m-right_x-small" title="Description of icon when needed">
                                <lightning-icon icon-name="utility:error" alternative-text="Error" title="Error" variant="inverse"></lightning-icon>
                            </span>
                            <h2>{errorMessageToDisplay}</h2>
                        </div>

                        <footer class="slds-modal__footer">
                            <lightning-button class="slds-m-top_small slds-m-right_x-small" onclick={handleCancel} disabled={disableButton} label="Cancel"> </lightning-button>
                            <lightning-button class="slds-m-top_small slds-m-right_x-small" disabled={disableButton} onclick={handleButtonClick} type="submit" variant="brand" label="Save"> </lightning-button>
                        </footer>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
