<!-- 
@Name: nsp_newProjectTaskCreationForm
@createddate: 02/28/2023
@Story : STY-04038
@Description: This describes about the custom creation of project task.
-->
<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{headerName}</h2>
            </header>
            
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-record-edit-form onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError} object-api-name="pse__Project_Task__c" record-type-id={selectedRecTypeId} density="compact">
                        <lightning-spinner if:true={isLoading}></lightning-spinner>
                        <lightning-layout-item size="12">
                          <div style="display: none;">
                              <lightning-input-field field-name="pse__Milestone__c" class="slds-hidden"></lightning-input-field>
                          </div>
                      </lightning-layout-item>
                    <lightning-layout>
                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">{bpsInfoLabel}</div>
                        </lightning-layout-item>
                    </lightning-layout>
                    <div class="slds-m-top_medium slds-p-around_medium">
                        <lightning-layout multiple-rows="true">
                            <lightning-layout-item size="6" class="slds-p-around_small">
                                <lightning-input-field field-name="pse__Project__c" value = {projectId} required onchange={handleChange}> </lightning-input-field>
                            </lightning-layout-item>
                            <template for:each={bpsInfoFields} for:item="field">
                                <lightning-layout-item key={field.apiName} size={elementSize} class="slds-p-around_x-small">
                                    <div if:true={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required} value={field.value}> </lightning-input-field>
                                    </div>
                                    <div if:false={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required}> </lightning-input-field>
                                    </div>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </div>
  
                    <lightning-layout>
                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">Date/Time Fields</div>
                        </lightning-layout-item>
                    </lightning-layout>
  
                    <div class="slds-m-top_medium slds-p-around_medium">
                        <lightning-layout>
                            <lightning-layout-item size="6" class="slds-p-around_small">
                                <lightning-input-field field-name="pse__Estimated_Time_To_Completion__c"> </lightning-input-field>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" class="slds-p-around_small">
                                <lightning-input-field field-name="pse__Work_Remaining__c"> </lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
  
                    <lightning-layout>
                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">{bpsTaskHierarchyLabel}</div>
                        </lightning-layout-item>
                    </lightning-layout>
                    <div class="slds-m-top_medium slds-p-around_medium">
                        <lightning-layout>
                            <lightning-layout-item size="6" class="slds-p-around_small">
                                <lightning-input-field field-name="pse__Parent_Task__c"> </lightning-input-field>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" class="slds-p-around_small">
                                  <!-- Milestone Addition is moved to custom model -->
                                  <c-nsp_case-custom-look-up 
                                  s-object-api-name="pse__Milestone__c"
                                  label="Milestone"
                                  icon-name = "standard:custom"
                                  parent-id = {projectId}
                                  onlookupupdate={handlelookupRecord}
                                  placeholder="Search Milestones...">
                                  </c-nsp_case-custom-look-up>                                 
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout multiple-rows="true">
                            <template for:each={bpsTaskHierarchyFields} for:item="field">
                                <lightning-layout-item key={field.apiName} size={elementSize} class="slds-p-around_x-small">
                                    <div if:true={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required} value={field.value}> </lightning-input-field>
                                    </div>
                                    <div if:false={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required}> </lightning-input-field>
                                    </div>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </div>
  
                    <lightning-layout>
                        <lightning-layout-item flexibility="auto" padding="horizontal-medium">
                            <div class="custom-box">{bpsTaskSystemInfoLabel}</div>
                        </lightning-layout-item>
                    </lightning-layout>
                    <div class="slds-m-top_medium">
                        <lightning-layout multiple-rows="true">
                            <template for:each={bpsTaskSystemInfoFields} for:item="field">
                                <lightning-layout-item key={field.apiName} size={elementSize} class="slds-p-around_x-small">
                                    <div if:true={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required} value={field.value}> </lightning-input-field>
                                    </div>
                                    <div if:false={field.value}>
                                        <lightning-input-field field-name={field.apiName} required={field.required}> </lightning-input-field>
                                    </div>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </div>
  
                     <div if:true={showError} class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                         <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Description of icon when needed">
                             <lightning-icon icon-name="utility:error" alternative-text="Error" title="Error" variant="inverse"></lightning-icon>
                         </span>
                         <h2>{errorMessageToDisplay}</h2>
                     </div>
  
                    <footer class="slds-modal__footer">
                        <lightning-button class="slds-m-top_small slds-m-right_x-small" onclick={handleCancel} disabled={disableButton} label="Cancel"> </lightning-button>
                        <lightning-button class="slds-m-top_small slds-m-right_x-small" disabled={disableButton} onclick={handleButtonClick} type="submit" variant="brand" label="Save"> </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
