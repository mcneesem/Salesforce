<template>
    <template lwc:if={fields}>
        <template lwc:if={record}>
            <ul>
                <li class="slds-p-around_small">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeLeft}
                            >
                            Insperity 1st Pay Period&nbsp;
                            <c-helptext content={fields.First_Pay_Period_Start__c.inlineHelpText}></c-helptext>
                        </lightning-layout-item>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeRight}
                            >
                            <template lwc:if={hasFirstPayPeriod}>
                                <lightning-formatted-date-time
                                    value={firstPayPeriodStart}
                                    month="long"
                                    day="2-digit"
                                    time-zone="UTC"
                                    >
                                </lightning-formatted-date-time>&nbsp;-&nbsp;
                                <lightning-formatted-date-time
                                    value={firstPayPeriodEnd}
                                    day="2-digit"
                                    time-zone="UTC"
                                    >
                                </lightning-formatted-date-time>,&nbsp;
                                <lightning-formatted-date-time
                                    value={firstPayPeriodEnd}
                                    year="numeric"
                                    time-zone="UTC"
                                    >
                                </lightning-formatted-date-time>
                            </template>
                            <template lwc:else>
                                &nbsp;
                            </template>
                        </lightning-layout-item>
                    </lightning-layout>
                </li>
                <li class="slds-p-around_small">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeLeft}
                            >
                            Insperity 1st Pay Date&nbsp;
                            <c-helptext content={fields.First_Pay_Date__c.inlineHelpText}></c-helptext>
                        </lightning-layout-item>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeRight}
                            >
                            <lightning-formatted-date-time
                                value={firstPayDate}
                                month="long"
                                day="2-digit"
                                year="numeric"
                                time-zone="UTC"
                                >
                            </lightning-formatted-date-time>
                        </lightning-layout-item>
                    </lightning-layout>
                </li>
                <li class="slds-p-around_small">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeLeft}
                            >
                            Insperity Pay Frequency
                        </lightning-layout-item>
                        <lightning-layout-item
                            size={columnSizeFull}
                            small-device-size={columnSizeFull}
                            medium-device-size={columnSizeFull}
                            large-device-size={columnSizeRight}
                            >
                            {payFrequency}
                        </lightning-layout-item>
                    </lightning-layout>
                </li>
            </ul>
        </template>
    </template>
</template>
