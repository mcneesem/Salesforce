<template>
  <div class="slds-grid slds-gutters">
    <div if:true={filterTypes} class="slds-col slds-size_1-of-4">
      <lightning-formatted-text class="slds-form-element__label" value={filterLabel}>
      </lightning-formatted-text>
      <lightning-combobox
        if:true={filterTypes}
        label={filterLabel}
        value={filterBy}
        options={filterTypes}
        variant="label-hidden"
        onchange={handleFilterTypeChange}></lightning-combobox>
    </div>

    <c-nsp_lookup-box
      options={options}
      label={label}
      required={required}
      placeholder={placeholder}
      class={lookupBoxClass}></c-nsp_lookup-box>
  </div>
  <lightning-pill-container
    if:true={optionPills}
    items={optionPills}
    onitemremove={handlePillRemoval}
    class="slds-show slds-var-m-top_small"></lightning-pill-container>
</template>
