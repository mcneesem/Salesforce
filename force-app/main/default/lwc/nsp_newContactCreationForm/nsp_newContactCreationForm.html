<template>
    <template if:true={showServiceLayout}>
        <!-- modal start -->    
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={hideClose}>
                    <lightning-icon icon-name="utility:close"
                    alternative-text="close"
                    variant="inverse"
                    size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Contact</h2>
            </header>
        
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-record-edit-form object-api-name="Contact" onsuccess={handleSuccess}>
                    <lightning-messages>
                    </lightning-messages>
                    <div class="slds-grid">
                        <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name='Name'></lightning-input-field>                        
                        <lightning-input-field field-name='NSP_Preferred_First_Name__c'></lightning-input-field>                        
                        <lightning-input-field field-name='Phone'></lightning-input-field>
                        <lightning-input-field field-name='Email'></lightning-input-field>
                        <lightning-input-field field-name='NSP_SSN__c'></lightning-input-field>
                        <lightning-input-field field-name='NSP_Employee_Identified_Gender__c'></lightning-input-field>

                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name='AccountId'></lightning-input-field>
                            <lightning-input-field field-name='MobilePhone'></lightning-input-field>
                            <lightning-input-field field-name='NSP_Work_Phone__c'></lightning-input-field>                           
                            <lightning-input-field field-name='NSP_Work_email__c'></lightning-input-field>                            
                            <lightning-input-field field-name='NSP_Date_of_Birth__c'></lightning-input-field>                           
                            <lightning-input-field field-name='NSP_Contact_Pin__c'></lightning-input-field>
                        </div>
                    </div>
                    <br>
                    <footer class="slds-modal__footer">   
                        <div style="float: left;">                 
                            <lightning-button class="slds-m-top_small"
                                            type="Cancel"
                                            label="Cancel"
                                            onclick={hideClose}>
                            </lightning-button>
                        </div>    
                        <lightning-button class="slds-m-top_small"
                                variant="brand"
                                  type="submit"
                                  label="Submit">
                        </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>
            </div>
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>            
    </template>
</template>
