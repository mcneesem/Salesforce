<template>
    <template lwc:if={isVisible}>
        <c-portal-related-files linked-entity-id={parentRecordId} onloaded={handleLoaded} modstamp={modstamp}></c-portal-related-files>
        <lightning-layout multiple-rows="true">
            <!-- MEDIUM -->
            <lightning-layout-item size="12" padding="around-small" class="slds-show_medium">
                <lightning-layout onclick={handleClickAccordion} onkeydown={handleKeyDown} multiple-rows={isMultipleRows}>
                    <lightning-layout-item
                        size={titleSize}
                        small-device-size={titleSize}
                        medium-device-size={titleSize}
                        large-device-size={titleSize}
                        onclick={handleClickTitle}
                        onkeydown={handleKeyDown}
                        class={titleClass}
                        >
                        <template lwc:if={isParent}>
                            <template lwc:if={hasBody}>
                                <template lwc:if={showBody}>
                                    <lightning-icon icon-name="utility:chevrondown" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                                </template>
                                <template lwc:else>
                                    <lightning-icon icon-name="utility:chevronright" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                                </template>
                            </template>
                            <template lwc:else>
                                <lightning-icon icon-name="utility:chevronright" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                            </template>
                        </template>
                        {name}
                        <template lwc:if={hasGuidance}>
                            <c-portal-guidance variant="helptext" record-id={guidanceId}></c-portal-guidance>
                        </template>
                    </lightning-layout-item>
                    <template lwc:if={showDueDate}>
                        <lightning-layout-item
                            size={dueDateSize}
                            small-device-size={dueDateSize}
                            medium-device-size={dueDateSize}
                            large-device-size={dueDateSize}
                            >
                            <lightning-formatted-date-time
                                value={dueDate}
                                month="2-digit"
                                day="2-digit"
                                year="numeric"
                                time-zone="UTC"
                                >
                            </lightning-formatted-date-time>
                        </lightning-layout-item>
                    </template>
                    <lightning-layout-item
                        size={actionSize}
                        small-device-size={actionSize}
                        medium-device-size={actionSize}
                        large-device-size={actionSize}
                        >
                        <c-portal-task-action
                            record={record}
                            disabled={isInputDisabled}
                            onmodified={handleModified}
                            ontoasted={handleToasted}
                            >
                        </c-portal-task-action>
                    </lightning-layout-item>
                    <template lwc:if={showRelatedFiles}>
                        <lightning-layout-item
                            size={fileCountSize}
                            small-device-size={fileCountSize}
                            medium-device-size={fileCountSize}
                            large-device-size={fileCountSize}
                            onclick={handleClickFiles}
                            onkeydown={handleKeyDown}
                            >
                            <template lwc:if={isLoading}>
                                <div class="slds-is-relative slds-size_1-of-2 slds-m-top_x-small">
                                    <lightning-spinner alternative-text="Loading" size="xx-small"></lightning-spinner>
                                </div>
                            </template>
                            <template lwc:else>
                                <span style="white-space: nowrap;">
                                    <lightning-icon icon-name="utility:form" size={iconSize} alternative-text="Uploaded Files"></lightning-icon>&nbsp;({totalRelatedFiles})
                                </span>
                            </template>
                        </lightning-layout-item>
                    </template>
                    <template lwc:else>
                        <lightning-layout-item
                            size={fileCountSize}
                            small-device-size={fileCountSize}
                            medium-device-size={fileCountSize}
                            large-device-size={fileCountSize}
                            >
                            &nbsp;
                        </lightning-layout-item>
                    </template>
                    <lightning-layout-item
                        size={statusSize}
                        small-device-size={statusSize}
                        medium-device-size={statusSize}
                        large-device-size={statusSize}
                        >
                        <lightning-icon
                            icon-name={statusIconName}
                            variant={statusIconVariant}
                            size={iconSize}
                            title={statusIconTitle}
                            alternative-text={statusIconTitle}
                            >
                        </lightning-icon>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <!-- SMALL -->
            <lightning-layout-item size="12" padding="around-small" class="slds-hide_medium">
                <lightning-layout onclick={handleClickAccordion} onkeydown={handleKeyDown} multiple-rows="true">
                    <lightning-layout-item
                        size="12"
                        small-device-size="6"
                        medium-device-size="6"
                        large-device-size="6"
                        onclick={handleClickTitle}
                        onkeydown={handleKeyDown}
                        class={titleClass}
                        >
                        <lightning-layout multiple-rows="true">
                            <lightning-layout-item size="12">
                                <template lwc:if={isParent}>
                                    <template lwc:if={hasBody}>
                                        <template lwc:if={showBody}>
                                            <lightning-icon icon-name="utility:chevrondown" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                                        </template>
                                        <template lwc:else>
                                            <lightning-icon icon-name="utility:chevronright" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                                        </template>
                                    </template>
                                    <template lwc:else>
                                        <lightning-icon icon-name="utility:chevronright" size={chevronSize} alternative-text="Indicates Guidance"></lightning-icon>&nbsp;
                                    </template>
                                </template>
                                <lightning-icon
                                    icon-name={statusIconName}
                                    variant={statusIconVariant}
                                    size={iconSize}
                                    title={statusIconTitle}
                                    alternative-text={statusIconTitle}
                                    >
                                </lightning-icon>&nbsp;
                                {name}
                                <template lwc:if={hasGuidance}>
                                    <c-portal-guidance variant="helptext" record-id={guidanceId}></c-portal-guidance>
                                </template>
                            </lightning-layout-item>
                            <template lwc:if={showDueDate}>
                                <lightning-layout-item size="12">
                                    <lightning-formatted-date-time
                                        value={dueDate}
                                        month="2-digit"
                                        day="2-digit"
                                        year="numeric"
                                        time-zone="UTC"
                                        >
                                    </lightning-formatted-date-time>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </lightning-layout-item>
                    <lightning-layout-item
                        size="12"
                        small-device-size="6"
                        medium-device-size="6"
                        large-device-size="6"
                        >
                        <lightning-layout>
                            <lightning-layout-item flexibility="auto, no-grow">
                                <c-portal-task-action
                                    record={record}
                                    disabled={isInputDisabled}
                                    onmodified={handleModified}
                                    ontoasted={handleToasted}
                                    >
                                </c-portal-task-action>
                            </lightning-layout-item>
                            <template lwc:if={showRelatedFiles}>
                                <lightning-layout-item
                                    flexibility="auto, no-grow"
                                    onclick={handleClickFiles}
                                    onkeydown={handleKeyDown}
                                    >
                                    <template lwc:if={isLoading}>
                                        <div class="slds-is-relative slds-size_1-of-2 slds-m-top_x-small">
                                            <lightning-spinner alternative-text="Loading" size="xx-small"></lightning-spinner>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <span class="slds-m-left_xx-small" style="white-space: nowrap;">
                                            <lightning-icon icon-name="utility:form" size={iconSize} alternative-text="Uploaded Files"></lightning-icon>&nbsp;({totalRelatedFiles})
                                        </span>
                                    </template>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <!-- BODY -->
            <template lwc:if={hasBody}>
                <template lwc:if={showBody}>
                    <lightning-layout-item size="12" padding="around-medium">
                        <template lwc:if={hasGuidance}>
                            <c-portal-guidance variant="richtext" record-id={guidanceId}></c-portal-guidance>
                        </template>
                        <template lwc:if={isParent}>
                            <c-portal-task-list variant="child" parent-record-id={recordId}></c-portal-task-list>
                        </template>
                    </lightning-layout-item>
                </template>
            </template>
        </lightning-layout>
    </template>
</template>
