<template>
    <c-navigate-page-reference page-reference={pageReference} onnavigate={handleClose}></c-navigate-page-reference>
    <lightning-modal-header label={modalLabel}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-text-align_center">
            <div class="player">
                <div class="document slds-p-vertical_xxx-small">
                    <div class="preview">
                        <div class="scroller-wrapper">
                            <div class="scroller slds-size_1-of-1">
                                <template lwc:if={hasMessage}>
                                    <div class="slds-text-heading_medium slds-m-bottom_large slds-m-top_large slds-text-color_inverse">{message}</div>
                                </template>
                                <div class="page">
                                    <template lwc:if={hasPreviewUrl}>
                                        <img
                                            src={previewUrl}
                                            alt="File Preview"
                                            onload={handleImageLoad}
                                            onerror={handleImageError}
                                            class={imageClass}
                                            />
                                        <lightning-button
                                            variant="brand"
                                            icon-name="utility:download"
                                            label="Download"
                                            title="Download"
                                            onclick={handleDownloadClick}
                                            class={buttonClass}
                                            >
                                        </lightning-button>
                                    </template>
                                    <template lwc:if={isPreviewLoading}>
                                        <div class="slds-is-relative slds-m-bottom_xx-large slds-m-top_large">
                                            <lightning-spinner alternative-text="Loading" size="medium" variant="inverse"></lightning-spinner>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
