<template>
    <lightning-layout multiple-rows>
        <lightning-layout-item size="12" class="slds-p-around_xx-small background-color-brand-insperity-blue">
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-grid_vertical-align-center">
                    <img src={logoInsperity} class="height-4" alt="Insperity Logo"/>
                </lightning-layout-item>
                <lightning-layout-item size="6" class="slds-grid_vertical-align-center">
                    <template lwc:if={userName}>
                        <div class="slds-text-align_right slds-p-around_medium">
                            <span class="slds-m-right_x-small color-white text-transform-uppercase">{userName}</span>
                            <template lwc:if={iconAvatar}>
                                <img src={iconAvatar} class="height-2" alt="Avatar Icon"/>
                            </template>
                            <lightning-button-menu
                                alternative-text="User Menu"
                                menu-alignment="right"
                                onselect={handleUserMenuSelect}
                                variant="bare-inverse"
                                >
                                <lightning-menu-item
                                    label="Logout"
                                    value="logout"
                                    >
                                </lightning-menu-item>
                            </lightning-button-menu>
                        </div>
                    </template>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item size="12" padding="around-medium" class="background-color-white">
            <lightning-layout>
                <lightning-layout-item>
                    <template lwc:if={records}>
                        <div class="combobox-text-medium">
                            <lightning-combobox
                                name="selector"
                                label="Portal Clients"
                                variant="label-hidden"
                                placeholder="Select Portal Client"
                                value={recordId}
                                options={records}
                                onchange={handleChange}
                                class="client-selector-combobox"
                                >
                            </lightning-combobox>
                        </div>
                    </template>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item size="12">
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-m-top_x-large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
            <template lwc:else>
                <lightning-layout>
                    <template lwc:if={showVerticalNavigation}>
                        <lightning-layout-item flexibility="no-grow, no-shrink" class="background-color-white vertical-navigation-links slds-show_large">
                            <lightning-vertical-navigation selected-item={selectedItem}>
                                <template lwc:if={navigationItems}>
                                    <template for:each={navigationItems} for:item="navigationItem">
                                        <lightning-vertical-navigation-item-icon
                                            key={navigationItem.name}
                                            label={navigationItem.label}
                                            name={navigationItem.name}
                                            icon-name={navigationItem.iconName}
                                            class="list-style-type-none"
                                            >
                                        </lightning-vertical-navigation-item-icon>
                                    </template>
                                </template>
                            </lightning-vertical-navigation>
                        </lightning-layout-item>
                    </template>
                    <lightning-layout-item class="background-color-secondary">
                        <template lwc:if={recordId}>
                            <div class="slds-p-vertical_small">
                                <lightning-layout>
                                    <lightning-layout-item>
                                        <c-portal-client record-id={recordId}></c-portal-client>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
        </lightning-layout-item>
    </lightning-layout>
</template>
