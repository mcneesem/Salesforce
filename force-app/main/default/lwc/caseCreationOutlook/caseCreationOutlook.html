<template>
    <template lwc:if={hasPermission}>
        <template lwc:if={isFlowVisible}>
            <div class="slds-m-bottom_x-small">
                <lightning-button-icon
                    icon-name="utility:back"
                    variant="bare"
                    alternative-text="Back"
                    title="Back to Create Case"
                    onclick={handleCancelFlow}>
                </lightning-button-icon>
            </div>
            <lightning-flow
                flow-api-name="Case_Creation_Screen_Flow"
                flow-input-variables={flowInputVariables}
                onstatuschange={handleStatusChange}>
            </lightning-flow>
        </template>
        <template lwc:else>
            <lightning-layout class="slds-m-around_small">
                <lightning-layout-item size="12">
                    <lightning-button
                        label="New Case"
                        variant="brand"
                        onclick={handleClickNew}
                        >
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </template>
    </template>
</template>
