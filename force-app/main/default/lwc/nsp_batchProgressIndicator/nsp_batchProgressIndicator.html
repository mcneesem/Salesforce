<template>
    <template if:true={enableBatchUI}>
        <lightning-card title="Real Time Invoice Batch Execution Status">
            <lightning-layout multiple-rows="true">
                <lightning-layout-item size="12" padding="around-small">
                    <lightning-layout>
                        <lightning-layout-item size="6" padding="around-small">
                            <lightning-combobox name="batchName" label="Batch Class" value={value}
                                placeholder="Select Batch Class" options={batchOptions} onchange={handleBatchChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="3" padding="around-small">
                            <lightning-input label="Enter Batch Size" variant="label-stacked" type="number"
                                onchange={handleBatchSizeChange} disabled={disableBatchSize}
                                value={batchSize}></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="3" padding="around-small"
                            class="slds-grid slds-grid_vertical-align-center">
                            <lightning-button label="Execute Batch" variant="brand" onclick={handleExecuteBatch}
                                class="slds-p-around_medium" disabled={disableExecuteBatch}></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
            </lightning-layout>
            <p slot="footer">Batch Run Status</p>
        </lightning-card>
    </template>
</template>
