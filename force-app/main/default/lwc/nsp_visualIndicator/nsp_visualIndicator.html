<template >
    <lightning-card title="Account Indicators">
        <div class="slds-grid slds-gutters slds-wrap slds-p-vertical_medium slds-align_absolute-center">
            <!--account health-->
            <template if:true={showFav_AH}>
                <div class="slds-col slds-size_6-of-12" > 
                    <div class="slds-text-title slds-align_absolute-center">Account Health</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={fav} title="fav" height="100%"></div>
                </div>
            </template>
            <template if:true={showNeutral_AH}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Account Health</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={neutral} title="Neutral" height="100%"></div>
                </div>
            </template>
            <template if:true={showSomewhat_fav_AH}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center add-top-padding-on-img">Account Health</div>
                    <div class="slds-align_absolute-center"><img src={somewhat_fav} title="somewhat_fav" height="100%"></div>
                </div>
            </template>
            <template if:true={showSomewhat_unfav_AH}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center add-top-padding-on-img">Account Health</div>
                    <div class="slds-align_absolute-center"><img src={somewhat_unfav} title="somewhat_unfav" height="100%"></div>
                </div>
            </template>
            <template if:true={showUnfav_AH}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center add-top-padding-on-img">Account Health</div>
                    <div class="slds-align_absolute-center"><img src={unfav} title="unfav" height="100%"></div>
                </div>
            </template>
            <!--renewal probability-->
            <template if:true={showFav}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Renewal Probability</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={fav} title="fav" height="100%"></div>
                </div>
            </template>
            <template if:true={showNeutral}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Renewal Probability</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={neutral} title="Neutral" height="100%"></div>
                </div>
            </template>
            <template if:true={showSomewhat_fav}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Renewal Probability</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={somewhat_fav} title="somewhat_fav" height="100%"></div>
                </div>
            </template>
            <template if:true={showSomewhat_unfav}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Renewal Probability</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={somewhat_unfav} title="somewhat_unfav" height="100%"></div>
                </div>
            </template>
            <template if:true={showUnfav}>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-text-title slds-align_absolute-center">Renewal Probability</div>
                    <div class="slds-align_absolute-center add-top-padding-on-img"><img src={unfav} title="unfav" height="100%"></div>
                </div>
            </template>
        </div><!--first row-->
        <div class="slds-grid slds-gutters slds-wrap">
            <template if:true={showContractExempt}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">Service Exception</div>
                    <div class="slds-align_absolute-center"><img src={contract_exempt} height="100%"></div>
                </div>
            </template>
            <template if:false={showPaperless}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">Not Paperless</div>
                    <div class="slds-align_absolute-center"><img src={paperless} height="100%"></div>
                </div>
            </template>
            <template if:true={showNationalAccount}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">National Account</div>
                    <div class="slds-align_absolute-center"><img src={nationalAccount} height="100%"></div>
                </div>
            </template>
            <template if:true={showEmailToCase}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">Email-To-Case</div>
                    <div class="slds-align_absolute-center"><img src={emailToCase} height="100%"></div>
                </div>
            </template>
            <template if:true={showPendingTermination}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">Pending Termination</div>
                    <div class="slds-align_absolute-center"><img src={pending_termination} height="100%"></div>
                </div>
            </template>
            <template if:true={vocSurveyIndicator}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">VOC w/in 6 mo.</div>
                    <div class="slds-align_absolute-center"><img src={voc6mo} height="100%"></div>
                </div>
            </template>
            <template if:true={showWorkSyncClientTrue}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">HR360 SE</div>
                    <div class="slds-align_absolute-center"><img src={wf_sync} height="100%"></div>
                </div>
            </template>
            <template lwc:if={showHRScale}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">HRScale</div>
                    <div class="slds-align_absolute-center"><img src={hrScale} alt="" height="100%"></div>
                </div>
            </template>
            <template if:true={whoClient100True}><!--CHANGE-->
                <div class="slds-col slds-size_1-of-3"><!--Need logo for bothcrwc-->
                    <div class="slds-text-title slds-align_absolute-center">CRWC: 100% Client</div>
                    <div class="slds-align_absolute-center"><img src={crwc} height="100%"></div>
                </div>
            </template>
            <template if:true={showClientAndInsperity}>
                <div class="slds-col slds-size_1-of-3"><!--Need logo for bothcrwc-->
                    <div class="slds-text-title slds-align_absolute-center">CRWC: Client &#38; Insperity</div>
                    <div class="slds-align_absolute-center"><img src={crwc} height="100%"></div>
                </div>
            </template>
            <template if:true={showSPPIcon}>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-align_absolute-center">Strategic Partner</div>
                    <div class="slds-align_absolute-center"><img src={spp_icon} height="100%"></div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
