<template>
    <template lwc:if={recordId}>
        <div class="slds-box slds-theme_default">
            <lightning-card title="Resources">
                <div class="slds-p-horizontal_small">
                    <template lwc:if={records}>
                        <lightning-layout multiple-rows>
                            <template for:each={records} for:item="record">
                                <lightning-layout-item key={record.fields.Id.value} size="12">
                                    <c-portal-resource record={record}></c-portal-resource>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>
                    </template>
                </div>
            </lightning-card>
        </div>
    </template>
</template>
