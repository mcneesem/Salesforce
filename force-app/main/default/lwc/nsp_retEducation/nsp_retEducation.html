<!-- sldsValidatorIgnore -->
<template>

    <div class="c-container">       
    <lightning-layout>
        <lightning-layout-item size="12" padding="around-small" class="graycolor">
     <h4 class="slds-text-heading_small slds-hyphenate">
            <b> Overview
                </b></h4>    
        </lightning-layout-item>
</lightning-layout>

        <lightning-record-edit-form record-id={FormValues.Id} object-api-name={objectApiName}
            onsubmit={handleFormSubmit} density="compact" mode="view">
            <div class="slds-grid slds-wrap slds-p-around_medium">
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_Name__c" required></lightning-input-field>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_Lead_Parent__c"  required></lightning-input-field>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_Subplan__c" required></lightning-input-field>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field value={recordId} data-asset="asset" field-name="NSP_Education_Client__c"
                        disabled></lightning-input-field>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_AIMs__c" disabled></lightning-input-field>                    
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_Status__c" required></lightning-input-field>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">
                    <lightning-input-field field-name="NSP_Language_Needs__c"></lightning-input-field>  <!-- As part of DF-03826, removed Required -->
                </div>
                <div class="slds-col slds-size_6-of-12 slds-p-horizontal_medium">                  
                </div>

                <div class="slds-var-m-top_medium slds-align_absolute-center">
                    <lightning-button variant="brand" label="Reset" onclick={handleReset}
                        class="slds-m-left_x-small slds-float_right"></lightning-button>
                    <lightning-button class="slds-m-left_x-small slds-float_right" variant="brand" type="submit"
                        label="Save"></lightning-button>
                </div>
            </div>

        </lightning-record-edit-form>
    </div>   

</template>
