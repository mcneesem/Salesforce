<template>
    <template lwc:if={error}>
        <c-error-panel error={error} parent="c-portal-pay-period-preview"></c-error-panel>
    </template>
    <template lwc:if={record}>
        <c-portal-pay-period record={record}></c-portal-pay-period>
    </template>
    <template lwc:else>
        <template lwc:if={recordId}>
            recordId: {recordId}<br/>
        </template>
    </template>
</template>
