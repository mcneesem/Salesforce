<template>
    <div class="slds-box">
        <lightning-spinner data-id="spinner" variant="brand" class="slds-hide"></lightning-spinner>
        <lightning-record-edit-form
            object-api-name="NSP_ReportRequest__c"
            record-id={reReqId}
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            onload={handleOnload}
            >
            <lightning-messages></lightning-messages>
            <lightning-layout>
                <lightning-layout-item size="7">
                    <div class="slds-m-around_medium">
                        <template if:false={IsMultipleEmployee}>
                            <template if:true={isOnloadCalled}>
                                <c-nsp_case-custom-look-up
                                    s-object-api-name="Contact"
                                    label="WSEE"
                                    icon-name = "standard:contact"
                                    parent-id ={clientName}
                                    default-record-id = {WSEE}
                                    onlookupupdate={handlelookupRecord}
                                    is-required = true
                                    search-key ={contactName}
                                    placeholder="Search Contacts..."
                                    >
                                </c-nsp_case-custom-look-up>
                            </template>
                            <div style="display:none">
                                <lightning-input-field
                                    class="slds-p-vertical_medium"
                                    data-fname="WSEEName"
                                    field-name='NSP_WSEE__c'
                                    required
                                    value={WSEE}
                                    >
                                </lightning-input-field>
                            </div>
                            <div class="slds-p-vertical_medium slds-form-element_horizontal">
                                <lightning-combobox
                                    name="NSP_Sub_Client__c"
                                    label="Sub Client where EE works/worked"
                                    value={NSP_Sub_Client__c}
                                    options={subClientOptions}
                                    onchange={handleChange}
                                    >
                                </lightning-combobox>
                                <lightning-input-field
                                    style="display:none"
                                    field-name="NSP_Sub_Client__c"
                                    value={NSP_Sub_Client__c}
                                    required
                                    class="slds-hidden">
                                </lightning-input-field>
                            </div>
                            <lightning-input-field  field-name="Sub_Client_Number__c"  value={Sub_Client_Number__c} style="display:none"></lightning-input-field>
                            <lightning-input-field class="slds-p-vertical_medium NSP_DOB__c" field-name="NSP_DOB__c"   value={dateOfBirth} disabled ></lightning-input-field>
                            <lightning-input-field class="slds-p-vertical_medium" field-name="Work_State__c"   value={Work_State__c} disabled ></lightning-input-field>
                            <lightning-input-field class="slds-p-vertical_medium" label="Employee Status"  field-name="Employee_Status__c"  value={employeeStatus} disabled></lightning-input-field>
                            <lightning-input-field class="slds-p-vertical_medium NSP_Termination_Date__c" field-name="NSP_Termination_Date__c" disabled={readOnlyTerminationDate} value={terminationDate} required ></lightning-input-field>
                            <div class="slds-p-around_small">
                                <div class="slds-form-element slds-form-element_stacked  slds-form-element_horizontal">
                                    <span class="slds-form-element__label">Age range is</span>
                                    <div class="slds-form-element__control">
                                        <div class="slds-form-element__static">{findAge}</div>
                                    </div>
                                </div>
                            </div>
                            <div style="display:none">
                                <lightning-input-field  field-name="NSP_Age_Range_Is__c" value={findAge} ></lightning-input-field>
                            </div>
                            <div class='AgeOverForty' style="display: none;">
                                <div class="slds-p-vertical_medium ">
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <lightning-radio-group
                                            name="NSP_WSEE_SameUnit_as_Others_Last_90_days__c"
                                            label="Is this WSEE from the same decisional unit as others being laid off in the last 90 days?"
                                            options={pickValueYesNo}
                                            value={NSP_WSEE_SameUnit_as_Others_Last_90_days__c}
                                            onchange={handleChange}
                                            required={NSP_WSEE_SameUnit_as_Others_Last_90_days}
                                            type="radio"
                                            >
                                        </lightning-radio-group>
                                    </div>
                                    <lightning-input-field
                                        class="slds-hidden NSP_WSEE_SameUnit_as_Others_Last_90_days__c"
                                        style='display:none'
                                        required={NSP_WSEE_SameUnit_as_Others_Last_90_days}
                                        field-name="NSP_WSEE_SameUnit_as_Others_Last_90_days__c"
                                        value={NSP_WSEE_SameUnit_as_Others_Last_90_days__c}
                                        >
                                    </lightning-input-field>
                                </div>
                                <div class="slds-form-element__label  slds-p-vertical_medium NSP_WSEE_SameUnit_as_Others_Last_90_days__c" style="display:none">
                                    Exhibits A/B must be prepared listing job titles, decisional unit, eligibility factors, and age of the employees affected and not affected by the layoff.
                                </div>
                            </div>
                            <template if:true={ReasonforSeparationValues.data}>
                                <div class="slds-form-element slds-form-element_horizontal">
                                    <lightning-radio-group
                                        name="NSP_Reason_for_Separation__c"
                                        label="Reason for Separation"
                                        options={ReasonforSeparationValues.data.values}
                                        value={NSP_Reason_for_Separation__c}
                                        required
                                        onchange={handleChange}
                                        type="radio"
                                        >
                                    </lightning-radio-group>
                                </div>
                                <lightning-input-field style='display:none' field-name="NSP_Reason_for_Separation__c" id="internalClient" value={NSP_Reason_for_Separation__c} required class="slds-hidden"></lightning-input-field>
                            </template>
                            <div class="slds-form-element slds-form-element_horizontal">
                                <lightning-radio-group
                                    name="NSP_Was_Separation_Involuntary__c"
                                    label="Was Separation Involuntary?"
                                    options={pickValueYesNo}
                                    value={NSP_Was_Separation_Involuntary__c}
                                    required
                                    onchange={handleChange}
                                    type="radio"
                                    >
                                </lightning-radio-group>
                                <lightning-input-field style='display:none' field-name="NSP_Was_Separation_Involuntary__c" value={NSP_Was_Separation_Involuntary__c} required class="slds-hidden"></lightning-input-field>
                            </div>
                            <div class="slds-var-p-vertical_medium   slds-form-element_horizontal">
                                <label class="slds-form-element__label " for="ConsiderationAmountmin" >
                                    <span class="slds-required" >*</span>
                                    Consideration Amount (Must be at least two weeks salary
                                </label>
                                <lightning-input-field variant="label-hidden" id="ConsiderationAmountmin" field-name="NSP_Consideration_Amount_min_2wks_Salary__c" value={userID}  required ></lightning-input-field>
                            </div>
                            <br/>
                            <br/>
                            <div class="slds-p-vertical_medium slds-form-element_horizontal">
                                <lightning-radio-group
                                    name="NSP_CSC_matter_for_any_WSEE__c"
                                    class="NSP_CSC_matter_for_any_WSEE__c"
                                    data-fname="NSP_CSC_matter_for_any_WSEE__c"
                                    label="Is there a CSC Mgmt. Matter entered for this WSEE?"
                                    options={pickValueYesNo}
                                    value={NSP_CSC_matter_for_any_WSEE__c}
                                    onchange={handleChange}
                                    required
                                    disabled={isDisable}
                                    type="radio"
                                    >
                                </lightning-radio-group>
                                <lightning-input-field style='display:none' field-name="NSP_CSC_matter_for_any_WSEE__c" value={NSP_CSC_matter_for_any_WSEE__c} required class="slds-hidden"></lightning-input-field>
                            </div>
                            <div class="slds-p-vertical_medium">
                                <div class="slds-form-element slds-form-element_horizontal">
                                    <lightning-radio-group
                                        name="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c"
                                        class="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c"
                                        label="Is this WSEE on any type of LOA other than TLO"
                                        options={pickValueYesNo}
                                        value={NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c}
                                        onchange={handleChange}
                                        required
                                        disabled={isDisable}
                                        type="radio"
                                        >
                                    </lightning-radio-group>
                                </div>
                                <lightning-input-field style='display:none' field-name="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c" value={NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c}  required variant="label-hidden" ></lightning-input-field>
                            </div>
                            <!--  conditional rendering -->
                            <div class="slds-p-vertical_medium slds-form-element_horizontal NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c" style='display:none' >
                                <label class="slds-form-element__label " for="NSP_HR_COEAdvisortermWSEELOA" >
                                    <span class="slds-required" >*</span>
                                    Which HR COE Advisor did you work with regarding the termination of the WSEE on LOA ?
                                </label>
                                <lightning-input-field variant="label-hidden"  id='NSP_HR_COEAdvisortermWSEELOA' class='NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c' field-name="NSP_HR_COEAdvisortermWSEELOA__c"  required={NSP_HR_COEAdvisortermWSEELOA} value={NSP_HR_COEAdvisortermWSEELOA__c} ></lightning-input-field>
                            </div>
                        </template>
                        <!-- Mulitiple Employee -->
                        <template if:true={IsMultipleEmployee}>
                            <div class="slds-p-vertical_medium">
                                <div class="slds-form-element slds-form-element_horizontal">
                                    <lightning-input-field class="slds-p-vertical_medium NSP_Sub_Client__c" field-name="NSP_Sub_Client__c"   required ></lightning-input-field>
                                    <br/>
                                    NOTE: Only ONE sub client can be included per spreadsheet. You must complete a Separation Agreement Request Wizard for each sub client.
                                </div>
                            </div>
                            <div class="slds-p-vertical_medium">
                                <div class="slds-form-element slds-form-element_horizontal">
                                    <lightning-radio-group
                                        name="NSP_CSC_matter_for_any_WSEE__c"
                                        class="NSP_CSC_matter_for_any_WSEE__c"
                                        data-fname="NSP_CSC_matter_for_any_WSEE__c"
                                        label="Is there a CSC matter for any WSEE listed on the spreadsheet?"
                                        options={pickValueYesNo}
                                        value={NSP_CSC_matter_for_any_WSEE__c}
                                        onchange={handleChange}
                                        disabled={isDisable}
                                        required
                                        type="radio"
                                        >
                                    </lightning-radio-group>
                                </div>
                                <lightning-input-field style='display:none' field-name="NSP_CSC_matter_for_any_WSEE__c" value={NSP_CSC_matter_for_any_WSEE__c} required class="slds-hidden"></lightning-input-field>
                            </div>
                            <div class="slds-p-vertical_medium">
                                <div class="slds-form-element slds-form-element_horizontal">
                                    <lightning-radio-group
                                        name="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c"
                                        class="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c"
                                        label="Is this WSEE on any type of LOA other than TLO"
                                        options={pickValueYesNo}
                                        value={NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c}
                                        onchange={handleChange}
                                        required
                                        type="radio"
                                        >
                                    </lightning-radio-group>
                                </div>
                                <lightning-input-field style='display:none' id="NSP_IsThisWSEEon_any_LOA_Type_beside"  field-name="NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c" value={NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c}  required class="slds-hidden" ></lightning-input-field>
                            </div>
                            <!--  conditional rendering -->
                            <div class="slds-p-vertical_medium slds-form-element_horizontal NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c" style='display:none' >
                                <label class="slds-form-element__label " for="NSP_HR_COEAdvisorterm" >
                                    <span class="slds-required" >*</span>
                                    Which HR COE Advisor did you work with regarding the termination of the WSEE on LOA ?
                                </label>
                                <lightning-input-field variant="label-hidden"  id='NSP_HR_COEAdvisorterm' class='NSP_IsThisWSEEon_any_LOA_Type_beside_TLO__c' field-name="NSP_HR_COEAdvisortermWSEELOA__c"  required={NSP_HR_COEAdvisortermWSEELOA} value={NSP_HR_COEAdvisortermWSEELOA__c} ></lightning-input-field>
                            </div>
                        </template>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item>
                    <!--   file upload start here -->
                    <div class="slds-align_absolute-center slds-p-around_medium">
                        <c-wizard-file-upload re-req-id={reReqId} onfileaction={findFileSize}></c-wizard-file-upload>
                    </div>
                    <!-- File Upload End here -->
                    <div style="display:none">
                        <lightning-input-field class="slds-hidden" data-fname="LastSavedPageNumber"  field-name="NSP_LastSavedPageNumber__c" variant="label-hidden" value={pageNumber}></lightning-input-field>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
            <div class="slds-m-top_medium slds-align_absolute-center slds-p-around_medium">
                <lightning-button
                    variant="brand"
                    label="Previous"
                    class="slds-m-top_small slds-m-left_small"
                    onclick={handlePrev}
                    >
                </lightning-button>
                <lightning-button
                    class="slds-m-top_small slds-m-left_small"
                    label="Save and Exit"
                    onclick={handleSave}
                    >
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Next"
                    class="slds-m-top_small slds-m-left_small"
                    type="submit"
                    >
                </lightning-button>
            </div>
        </lightning-record-edit-form>
    </div>
</template>
