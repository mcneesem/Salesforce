<template>
    <template lwc:if={record}>
        <lightning-layout>
            <lightning-layout-item size="12" padding="around-small">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12">
                        <lightning-formatted-date-time
                            value={record.fields.StartDateTime__c.value}
                            month="2-digit"
                            day="2-digit"
                            year="numeric"
                            time-zone="UTC"
                            >
                        </lightning-formatted-date-time>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-layout>
                            <lightning-layout-item size="7">
                                {record.fields.Name.value}
                            </lightning-layout-item>
                            <lightning-layout-item size="5">
                                <div class="slds-text-align_right">
                                    <lightning-formatted-date-time
                                        value={record.fields.StartDateTime__c.value}
                                        hour="2-digit"
                                        minute="2-digit"
                                        time-zone={record.fields.TimeZoneSidKey__c.value}
                                        >
                                    </lightning-formatted-date-time>&nbsp;-&nbsp;
                                    <lightning-formatted-date-time
                                        value={record.fields.EndDateTime__c.value}
                                        hour="2-digit"
                                        minute="2-digit"
                                        time-zone={record.fields.TimeZoneSidKey__c.value}
                                        time-zone-name="short"
                                        >
                                    </lightning-formatted-date-time>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </lightning-layout>
    </template>
</template>
