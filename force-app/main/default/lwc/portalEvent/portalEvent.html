<template>
    <template lwc:if={record}>
        <lightning-layout>
            <lightning-layout-item size="12" padding="around-small">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12">
                        <lightning-formatted-date-time
                            value={startDateTime}
                            month="2-digit"
                            day="2-digit"
                            year="numeric"
                            time-zone="UTC"
                            >
                        </lightning-formatted-date-time>
                    </lightning-layout-item>
                    <lightning-layout-item size="12">
                        <lightning-layout>
                            <lightning-layout-item size="7">
                                {name}
                            </lightning-layout-item>
                            <lightning-layout-item size="5">
                                <div class="slds-text-align_right">
                                    <template lwc:if={startDateTime}>
                                        <lightning-formatted-date-time
                                            value={startDateTime}
                                            hour="2-digit"
                                            minute="2-digit"
                                            time-zone={timeZoneSidKey}
                                            >
                                        </lightning-formatted-date-time>
                                        <template lwc:if={endDateTime}>
                                            &nbsp;-&nbsp;
                                            <lightning-formatted-date-time
                                                value={endDateTime}
                                                hour="2-digit"
                                                minute="2-digit"
                                                time-zone={timeZoneSidKey}
                                                time-zone-name="short"
                                                >
                                            </lightning-formatted-date-time>
                                        </template>
                                    </template>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </lightning-layout>
    </template>
</template>
