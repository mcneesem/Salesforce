<template>
    <c-nsp_alert-message
      if:true={error}
      message={error}
      mode="error">
    </c-nsp_alert-message>
    <lightning-vertical-navigation selected-item={selectedTab}>
        <lightning-vertical-navigation-section>
            <div class="slds-col slds-size_3-of-4">
                <template for:each={ipAutomationTable} for:item="section" for:index="index">
                    <div class="section slds-p-top_small empty-block"  key={section.sectionName}> 
                    <h2 class="slds-text-heading_medium">{section.sectionName}</h2>  
                </div>    
                            <lightning-datatable key={section.sectionName}
                                                 data-item={section.sectionName}
                                                 data-itemindex={index}
                                                 data={section.automationTableList}
                                                 key-field="automationName"
                                                 columns={column}
                                                 onrowaction={handleRowAction}
                                                 hide-checkbox-column="true"
                                                 show-row-number-column="true">
                            </lightning-datatable>  


                </template>
            </div>
        </lightning-vertical-navigation-section>
    </lightning-vertical-navigation>
</template>
