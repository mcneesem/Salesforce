<template>
    <template if:true={listOfOptions}>
        <div class="slds-var-p-around_xx-small">
            <lightning-formatted-text class="slds-form-element__label" value={fieldLabel}>
            </lightning-formatted-text>
            <lightning-checkbox-group name={fieldLabel} required={required} variant="label-hidden" label={fieldLabel}
                options={listOfOptions} value={selectedValue} onchange={handleChange} style = {adjustColumns}>
            </lightning-checkbox-group>
        </div>
    </template>
</template>
