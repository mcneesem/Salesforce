<template>
    <div class="slds-is-relative">
        <template lwc:if={records}>
            <template lwc:if={hasRecords}>
                <lightning-layout multiple-rows class={layoutClass}>
                    <lightning-layout-item size={columnSizeFull} padding="around-small" class="slds-show_medium">
                        <lightning-layout>
                            <lightning-layout-item size={columnSizeTitle}>
                                &nbsp;
                            </lightning-layout-item>
                            <template lwc:if={isParent}>
                                <lightning-layout-item size={columnSizeDueDate}>
                                    Due Date
                                </lightning-layout-item>
                            </template>
                            <lightning-layout-item size={columnSizeAction}>
                                Action
                            </lightning-layout-item>
                            <lightning-layout-item size={columnSizeUploads}>
                                Uploads
                            </lightning-layout-item>
                            <lightning-layout-item size={columnSizeStatus}>
                                Status
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-layout-item>
                    <lightning-layout-item size={columnSizeFull}>
                        <ul>
                            <template for:each={records} for:item="record">
                                <li key={record.fields.Id.value}>
                                    <c-portal-task record={record} variant={variant}></c-portal-task>
                                </li>
                            </template>
                        </ul>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
        </template>
        <template lwc:else>
            <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
        </template>
    </div>
</template>
