<template>
    <lightning-layout class="slds-no-wrap" vertical-align="start">
        <lightning-layout-item size="x-small" class="slds-m-right_small slds-m-top_x-small">
            <lightning-icon if:true={isPass} icon-name="utility:success" alternative-text="Pass" title="Pass" variant="success" size="x-small"></lightning-icon>
            <lightning-icon if:true={isFail} icon-name="utility:error" alternative-text="Fail" title="Fail" variant="error" size="x-small"></lightning-icon>
            <lightning-icon if:true={isWarn} icon-name="utility:warning" alternative-text="Warn" title="Warn" variant="warning" size="x-small"></lightning-icon>
        </lightning-layout-item>
        <lightning-layout-item class="slds-has-flexi-truncate">
            <div class="slds-truncate" title={label}>
                <span class="slds-text-title">{label}</span>
                <div class="slds-text-body_small slds-m-top_xx-small slds-truncate">
                    <span class="slds-m-right_medium slds-text-color_weak">Actual:</span>
                    <span class="slds-m-left_xxx-small slds-text-color_default">{actual}</span>
                </div>
                <div class="slds-text-body_small slds-truncate">
                    <span class="slds-text-color_weak">Expected:</span>
                    <span class="slds-m-left_xx-small slds-text-color_default">{expected}</span>
                </div>
                <template if:false={isPass}>
                    <div class="slds-text-body_small slds-m-top_xx-small slds-truncate" title={message}>{message}</div>
                </template>
            </div>
        </lightning-layout-item>
    </lightning-layout>
</template>
