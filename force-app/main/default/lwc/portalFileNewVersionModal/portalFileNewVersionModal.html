<template>
    <lightning-modal-header label={modalLabel}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-text-align_center">
            <lightning-input
                label="lightning-input"
                type="file"
                onchange="{handleFileChange}"
                variant="label-hidden"
                >
            </lightning-input>
            <template lwc:if={versionData}>
                {versionData.recordId}<br/>
                {versionData.filename}<br/>
                {versionData.base64}<br/>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
