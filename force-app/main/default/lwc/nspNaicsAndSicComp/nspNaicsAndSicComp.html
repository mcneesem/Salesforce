<template>


    <div class="slds-modal__header">
        <h2 class="slds-text-heading_medium">
            NAICS/SIC Look-up
        </h2>
    </div>

    
        <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
            <div class="nsp-radio-inline">
                <lightning-radio-group name="radioGroup" id="naicsOrSic" options={codeOptions} value={naicsOrSic}
                    onchange={handleNaicsSicChange} type="button" variant="label-stacked">
                </lightning-radio-group>
            </div>
        </div>
        <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-p-around_medium">
            <!-- child component with input field and searchable picklist-->
            <c-nsp-reusable-custom-dropdown-with-search-lwc options={select_list} value={selected_list}
                field-label={searchFieldLabel} onchange={handlePicklistChange} placeholder={naicsOrSic}>
            </c-nsp-reusable-custom-dropdown-with-search-lwc>
        </div>

        <div class="slds-col slds-size_1-of-2 slds-p-around_medium">
            <lightning-input type="text" label="Name" value={Account.Name} disabled="true">
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-p-around_medium">
            
        </div>


        <div class="slds-col slds-size_1-of-2 slds-p-around_medium">
            <lightning-input type="text" label={codeFieldLabel} name="industry_code" id="NAICS_NUM"
                onchange={handleFieldValueChange} value={industry_code} disabled="true"></lightning-input><br />
        </div>
        <div class="slds-col slds-size_1-of-2 slds-p-around_medium">
            <lightning-input id="NAICS_NUM_DESC" label={descFieldLabel} name="industry_description" value={industry_description}
                onchange={handleFieldValueChange} disabled="true"></lightning-input>
        </div>

    </div>
    <div class="slds-modal__footer">
        <lightning-button variant="neutral" label="Cancel" onclick={closeQuickAction}></lightning-button>
        &emsp;<lightning-button variant="Brand" label={buttonLabel} onclick={handleSave}>
        </lightning-button>
    </div>

</template>
