<template>
    <template lwc:if={error}>
        <div class="slds-theme_error slds-p-around_medium">
            <p class="slds-text-color_error">Error: {error.body.message}</p>
        </div>
    </template> 
    <template lwc:if={recordTypes.length}>
        <lightning-layout>
            <lightning-layout-item padding="around-large">
                <h1 class="slds-text-heading_medium slds-m-bottom_medium">Select a Record Type</h1>
                <lightning-radio-group
                    options={recordTypes}
                    name="recordTypeOptions"
                    value={selectedRecordTypeId}
                    onchange={handleRecordTypeChange}
                    class="slds-m-left_large"
                ></lightning-radio-group>
            </lightning-layout-item>
        </lightning-layout>
    </template>
</template>
