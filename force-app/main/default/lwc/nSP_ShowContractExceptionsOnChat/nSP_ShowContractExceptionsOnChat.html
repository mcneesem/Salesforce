<template>
    <template if:true={showContractButton}>
        <lightning-card title="Contract Exceptions"> 
           <div class="slds-m-around_medium">
                <lightning-datatable data={exceptions} columns={mainPagecolumns} key-field="Id"  hide-checkbox-column ></lightning-datatable> 
                <div class="slds-align_absolute-center">
                    <lightning-button variant="destructive-text" label="View Exceptions" title="View Exceptions" onclick={handleShowModal} ></lightning-button>
                </div>
            </div>
        </lightning-card>
    </template>
    <template if:true={showContractModal}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Contract Exceptions</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-datatable data={exceptions} columns={columns} key-field="Id"  hide-checkbox-column ></lightning-datatable>        
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="Brand" label="Ok" title="Ok" onclick={closeModal} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>    
</template>
