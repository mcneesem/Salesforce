<template>
  <lightning-record-edit-form
    onerror={handleError}
    record-id={recordId}
    onload={handleLoad}
    object-api-name={objectApiName}
    density="comfy"
  >
    <lightning-formatted-text class="slds-page-header__title" value={title}>
    </lightning-formatted-text>

    <lightning-layout class="slds-m-top_small" multiple-rows>
      <lightning-layout-item size="6">
        <lightning-input-field
          disabled={disabledFields.NSP_Project__c}
          field-name={fields.project}
          onchange={handleProjectChange}
          class={styles.NSP_Project__c}
        >
        </lightning-input-field>
        <lightning-input-field
          disabled={disabledFields.NSP_Asset__c}
          field-name={fields.asset}
          onchange={handleValueChange}
          class={styles.NSP_Asset__c}
        ></lightning-input-field>
        <lightning-input-field
          disabled={disabledFields.Account__c}
          field-name={fields.account}
          onchange={handleAccountChange}
          class={styles.Account__c}
        >
        </lightning-input-field>
      </lightning-layout-item>
      <lightning-layout-item size="6">
        <lightning-input-field
          disabled={disabledFields.NSP_AIMS_Client_Name__c}
          field-name={fields.clientName}
          class={styles.NSP_AIMS_Client_Name__c}
        ></lightning-input-field>
        <div style='display:none'>
          <lightning-input-field
          field-name={fields.bpaId}
          value={bpaIds}
          class="slds-hidden"
          ></lightning-input-field>
          </div>
        <lightning-input-field
          disabled={disabledFields.NSP_AIMS_ClientNo__c}
          field-name={fields.clientNumber}
          class={styles.NSP_AIMS_ClientNo__c}
        ></lightning-input-field>
      </lightning-layout-item>
    </lightning-layout>
  </lightning-record-edit-form>
</template>
