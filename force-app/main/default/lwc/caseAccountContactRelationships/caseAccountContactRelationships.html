<template>
    <div  class="custom-card">
    <lightning-card title={title} icon-name ="standard:record"   class="custom-card"> 

        <lightning-button-icon
            icon-name="utility:refresh"
            variant="neutral"
            alternative-text="Refresh"
            title="Refresh"
            slot="actions"
            onclick={handleRefresh}
            
            >
        </lightning-button-icon>
        <template if:true={hasData}>
            <lightning-datatable
                key-field="Id"
                data={displayDataList}
                columns={coulums}
                class= "wrap-text-table wrap-header"
                hide-checkbox-column="true"
                >
            </lightning-datatable>
        
            <div slot="footer" >
                <lightning-button label="View All" 
                    onclick={handleViewAll}
                    variant="base"
                    title="View All"
                    class="slds-text-link"
                >
                </lightning-button>
            </div>
        </template>
    </lightning-card>
    </div>
</template>
