<template>
    <div class={containerClass}>
    <lightning-card class={cardClass}>
        <div slot="title" class={titleSlotClass}>
            <lightning-icon icon-name="standard:record" size="small"></lightning-icon>
            <h2 class={titleClass}>{title}</h2>
        </div>
        <template lwc:if={hasData}>
            <lightning-button-icon
                icon-name="utility:refresh"
                variant="border-filled"
                title="Refresh"
                slot="actions"
                class="slds-m-right_medium"
                onclick={handleRefresh}
                >
            </lightning-button-icon>

            <div class={summaryClass}>{summary}</div>

            <div class={datatableClass}>
                <lightning-datatable
                    key-field="Id"
                    data={displayDataList}
                    columns={coulums}
                    hide-checkbox-column="true"
                    show-row-number-column="true"
                    >
                </lightning-datatable>
            </div>
        
            <div slot="footer" class={footerSlotClass}>
                <lightning-button label="View All"
                    onclick={handleViewAll}
                    variant="base"
                    title="View All"
                >
                </lightning-button>
            </div>
        </template>
    </lightning-card>
    </div>
</template>
