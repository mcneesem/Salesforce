<template>
    <template lwc:if={showPinModal}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Validate Contact PIN</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template lwc:if={hideDismissNote}>
                        <p>
                            <lightning-input type="text" label="PIN" pattern="[0-9]+" max-length="4" message-when-pattern-mismatch="Numbers Only" onchange={handleChange}></lightning-input>
                        </p>
                    </template>
                   <template lwc:if={showErr}>
                        <p>Pin Mismatch!</p>
                    </template>
                    <template lwc:if={showDismissNote}>
                        <lightning-textarea
                            lwc:ref="reason"
                            name="reason"
                            label="Reason for dismissing"
                            >
                        </lightning-textarea>
                        <template lwc:if={showErrNote}>
                            <p>Please enter reason for dismissing</p>
                        </template>
                    </template>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <template lwc:if={showCancel}>
                        <lightning-button variant="destructive" label="Dismiss Without Validation" title="Cancel" onclick={handleDismiss} class="slds-m-left_x-small"></lightning-button>
                    </template>
                    <template lwc:if={hideDismissNote}>
                        <lightning-button variant="brand" label="Validate Pin" title="Validate PIN" onclick={submitDetails} class="slds-m-left_x-small"></lightning-button>
                    </template>
                    <template lwc:if={showDismissNote}>
                        <lightning-button variant="brand" label="Save" title="Save" onclick={SubmitNotes} class="slds-m-left_x-small"></lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template lwc:if={showContractExceptions}>
        <c-show-contract-exceptions contact-id={contactId}></c-show-contract-exceptions>
    </template>
</template>
