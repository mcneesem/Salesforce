<template>
    <lightning-card title="Project Schedule (Next 7 Business Days)">
        <div class="slds-p-around_medium">
            <!-- Loading indicator -->
            <template if:false={columns}>
                <div class="slds-text-align_center">
                    <lightning-spinner alternative-text="Loading schedule data..." size="small"></lightning-spinner>
                    <p>Loading schedule data...</p>
                </div>
            </template>

            <template if:true={columns}>
                <lightning-layout class="slds-border_bottom slds-theme_shade slds-text-title_caps">
                    <lightning-layout-item size="2" padding="around-small">
                        <strong>Time blocks</strong>
                    </lightning-layout-item>
                    <template for:each={columns} for:item="col">
                        <lightning-layout-item key={col.dateValue} flexibility="auto" padding="around-small" class="slds-text-align_center">
                            <strong>{col.label}</strong><br/>
                            <span class="slds-text-body_small">{col.dateValue}</span>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>

                <template for:each={processedTableData} for:item="row" for:index="rowIndex">
                    <lightning-layout key={row.id} class="slds-border_bottom slds-hint-parent">
                        <lightning-layout-item size="2" padding="around-small">
                            {row.name}
                        </lightning-layout-item>
                        <template for:each={columns} for:item="col" for:index="colIndex">
                            <lightning-layout-item
                                key={col.dateValue}
                                flexibility="auto"
                                padding="around-small"
                                class="slds-text-align_center">
                                <!-- Display matrix data instead of placeholder numbers -->
                                    {row.counts[colIndex]}
                            </lightning-layout-item>
                        </template>
                    </lightning-layout>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
