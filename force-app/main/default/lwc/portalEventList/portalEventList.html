<template>
    <div class="slds-box slds-theme_default">
        <lightning-card title="Meetings List">
            <div class="slds-is-relative slds-p-horizontal_small">
                <template lwc:if={records}>
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <template lwc:if={hasRecords}>
                                <ul>
                                    <template for:each={records} for:item="record">
                                        <li key={record.fields.Id.value} class="slds-m-top_small">
                                            <c-portal-event record={record}></c-portal-event>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <div class="slds-p-top_small">No meetings found.</div>
                            </template>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
                <template lwc:else>
                    <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
                </template>
            </div>
        </lightning-card>
    </div>
</template>
