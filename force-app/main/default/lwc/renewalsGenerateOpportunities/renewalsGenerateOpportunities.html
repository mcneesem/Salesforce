<template>
    <lightning-card title="Generate Renewal Opportunities">
        <div slot="actions">
            <lightning-button
                label="Initiate Renewals"
                onclick={handleClick} >
            </lightning-button>
        </div>
    </lightning-card>
    <template if:true={showFlow}>
            <div class="slds-p-around_x-small">
                <lightning-flow
                    flow-api-name="Generate_Renewal_Opportunities"
                    onstatuschange={handleFlowStatusChange}>
                </lightning-flow>
            </div>
        </template>
</template>
