<template>
    <template lwc:if={record}>
        <c-portal-related-files linked-entity-id={parentRecordId} onloaded={handleLoaded}></c-portal-related-files>
        <template lwc:if={hasResource}>
            <lightning-layout>
                <lightning-layout-item size="12">
                    <div class="slds-m-top_small" title={title}>
                        <a
                            href="javascript:void(0);"
                            data-id={parentRecordId}
                            data-contentdocumentid={contentDocumentId}
                            data-linkurl={linkUrl}
                            onclick={handleClick}
                            target="_blank"
                            >
                            {title}
                        </a>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </template>
    </template>
</template>
