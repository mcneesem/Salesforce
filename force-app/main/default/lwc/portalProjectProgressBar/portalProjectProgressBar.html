<template>
    <template lwc:if={recordId}>
        <template lwc:if={record}>
            <lightning-card>
                <h3 slot="title" class="line-height-title">{title}</h3>
                <template lwc:if={hasTasks}>
                    <div class="slds-text-align_right slds-text-body_small">
                        <lightning-progress-bar value={progress} size="large" variant="circular"></lightning-progress-bar>
                        {message}
                    </div>
                </template>
            </lightning-card>
        </template>
    </template>
</template>
