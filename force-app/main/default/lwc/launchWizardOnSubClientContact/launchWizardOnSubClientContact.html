<template>
    <div class="container">
        <div class="slds-grid slds-page-header slds-p-around_small">
            <header class="slds-align_absolute-center">
                <h2 class="slds-card__header-title">
                    <lightning-formatted-text class="slds-text-heading_small" value='Launch Wizard'>
                    </lightning-formatted-text>
                </h2>
            </header>
        </div>
        <div class="slds-box  slds-theme_default">
            <div class='slds-p-vertical_x-large'>
                <lightning-layout>
                    <lightning-layout-item size="6" class="slds-align_absolute-center">
                        <lightning-button label='Separation Agreement Request' onclick={openWizard}
                            class="slds-m-left_x-small" value={recordTypeId}></lightning-button>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>
        <div class="slds-var-m-around_medium">
        <c-modal header={header} hide-close-btn>
            <div onsaveexit={handleCloseModal}>
                     <c-nsp_seperation-wizard rep-req-obj={recordObj} current-step="1">
                     </c-nsp_seperation-wizard>
            </div>
        </c-modal>
        </div>
    </div>
</template>
