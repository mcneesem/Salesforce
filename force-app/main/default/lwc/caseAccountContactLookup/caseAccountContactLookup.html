<template>
    <div class="slds-grid slds-wrap slds-grid_pull-padded-small">
        <!-- Account Lookup Section -->
        <div class="slds-col slds-p-horizontal_small">
            <label class="slds-p-left_x-small slds-p-bottom_small" style="color: #444444;" for="account-lookup">Account</label>
            <c-nsp_case-custom-look-up
                s-object-api-name="Account"
                icon-name="standard:account"
                default-record-id={selectedAccountId}
                case-acc-rec-id={accountFilterId}
                parent-id={selectedContactId}
                onlookupupdate={handleAccountLookup}
                placeholder="Search Accounts..."
                is-required="true"
                id="account-lookup"
                >
            </c-nsp_case-custom-look-up>
        </div>
        <!-- Contact Lookup Section -->
        <div class="slds-col slds-p-horizontal_small">
            <label class="slds-p-left_x-small slds-p-bottom_small" style="color: #444444;" for="contact-lookup">Contact</label>
            <c-nsp_case-custom-look-up
                s-object-api-name="Contact"
                icon-name="standard:contact"
                default-record-id={selectedContactId}
                parent-id={contactFilterId}
                case-acc-rec-id={selectedAccountId}
                onlookupupdate={handleContactLookup}
                placeholder="Search Contacts..."
                id="contact-lookup"
                >
            </c-nsp_case-custom-look-up>
        </div>
        <!-- warning message for multiple accounts -->
        <template lwc:if={showAccountWarning}>
            <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-text-color_error slds-text-body_small slds-m-top_x-small">
                <strong>{multipleAccountsLabel}</strong>
            </div>
        </template>
    </div>
</template>
