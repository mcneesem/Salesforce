<template>
    <div class="slds-grid slds-grid_pull-padded-small">
        <!-- Account Lookup Section -->
        <div class="slds-size_1-of-2">
            <label class="slds-p-left_small" for="account-lookup">Account</label>
            <c-nsp_case-custom-look-up
                s-object-api-name="Account"
                icon-name="standard:account"
                default-record-id={selectedAccountId}
                case-acc-rec-id={accountFilterId}
                parent-id={selectedContactId}
                onlookupupdate={handleAccountLookup}
                placeholder="Search Accounts..."
                is-required="true"
                id="account-lookup"
                >
            </c-nsp_case-custom-look-up>
            <!-- warning message for multiple accounts -->
            <div lwc:if={showAccountWarning} class="slds-text-color_error slds-text-body_small slds-m-top_x-small">
                <strong style="color: red;">{multipleAccountsLabel}</strong>
            </div>
        </div>
        <!-- Contact Lookup Section -->
        <div class="slds-size_1-of-2">
            <label class="slds-p-left_small" for="contact-lookup">Contact</label>
            <c-nsp_case-custom-look-up
                s-object-api-name="Contact"
                icon-name="standard:contact"
                default-record-id={selectedContactId}
                parent-id={contactFilterId}
                case-acc-rec-id={selectedAccountId}
                onlookupupdate={handleContactLookup}
                placeholder="Search Contacts..."
                id="contact-lookup"
                >
            </c-nsp_case-custom-look-up>
        </div>
    </div>
</template>
