<template>
  <lightning-record-edit-form
    record-id={recordId}
    object-api-name={objectApiName}
    onerror={handleError}
    onload={handleLoad}
    density="comfy">
    <lightning-formatted-text
      class="slds-page-header__title slds-var-p-bottom_xx-small"
      value={label.additionalPayOuts}></lightning-formatted-text>

    <c-nsp_selection-box
      disabled={disabledFields.NSP_Do_you_pay__c}
      label={_objectInfo.NSP_Do_you_pay__c.label}
      class={styles.NSP_Do_you_pay__c}
      multiple
      field-api-name="Implementation_Profile__c.NSP_Do_you_pay__c"
      record-type-id={recordTypeId}
      value={field.NSP_Do_you_pay__c}
      data-name="NSP_Do_you_pay__c"
      onchange={handleValueChange}>
    </c-nsp_selection-box>

    <c-nsp_selection-box
      disabled={disabledFields.NSP_Non_Discretionary_Bonus__c}
      if:true={visibility.NSP_Non_Discretionary_Bonus__c}
      label={label.nonDiscretionaryBonus}
      class={styles.NSP_Non_Discretionary_Bonus__c}

      field-api-name="Implementation_Profile__c.NSP_Non_Discretionary_Bonus__c"

      data-name="NSP_Non_Discretionary_Bonus__c"

    <lightning-input-field value={field.Non_Discretionary_Bonus_Input_frequency__c} disabled={disabledFields.Non_Discretionary_Bonus_Input_frequency__c}

      field-name="Non_Discretionary_Bonus_Input_frequency__c"

      class={styles.Non_Discretionary_Bonus_Input_frequency__c}
      onchange={handleValueChange}>
    </lightning-input-field>

    <c-nsp_selection-box
      disabled={disabledFields.NSP_Discretionary_Bonus__c}
      if:true={visibility.NSP_Discretionary_Bonus__c}

    <c-nsp_selection-box
      disabled={disabledFields.NSP_Commission_Frequency__c}

      data-name="NSP_Commission_Provide_Details__c"
      class={styles.NSP_Commission_Provide_Details__c}
      onchange={handleValueChange}>
    </lightning-input-field>

      label={_objectInfo.NSP_Commission_Type__c.label}

        <lightning-formatted-text

    <lightning-input-field value={field.NSP_DoYouPay_Other_Provide_details__c} disabled={disabledFields.NSP_DoYouPay_Other_Provide_details__c}

        onchange={handleValueChange}
        class={styles.NSP_DoYouPay_Other_Provide_details__c}>
    </lightning-input-field>

    <c-nsp_selection-box
      disabled={disabledFields.Do_you_pay_non_exempt_employees__c}

      data-name="Do_you_pay_non_exempt_employees__c"
      onchange={handleValueChange}>

    <c-nsp_selection-box

      record-type-id={recordTypeId}
      value={field.NSP_NonDiscretionaryDiscretionaryPayCode__c}

      class={styles.NSP_Any_special_pay_code_Provide_Details__c}
      onchange={handleValueChange}>

    <c-nsp_selection-box

      class={styles.Does_the_client_offer_a_Stock_Purchase__c}
      field-api-name="Implementation_Profile__c.Does_the_client_offer_a_Stock_Purchase__c"
      record-type-id={recordTypeId}
      value={field.Does_the_client_offer_a_Stock_Purchase__c}
      data-name="Does_the_client_offer_a_Stock_Purchase__c"

    <c-nsp_selection-box
      disabled={disabledFields.NSP_Does_the_client_offer_Stock_Options__c}
      label={_objectInfo.NSP_Does_the_client_offer_Stock_Options__c.label}
      class={styles.NSP_Does_the_client_offer_Stock_Options__c}
      field-api-name="Implementation_Profile__c.NSP_Does_the_client_offer_Stock_Options__c"
      record-type-id={recordTypeId}
      value={field.NSP_Does_the_client_offer_Stock_Options__c}
      data-name="NSP_Does_the_client_offer_Stock_Options__c"
      onchange={handleValueChange}>
    </c-nsp_selection-box>
  </lightning-record-edit-form>
</template>
