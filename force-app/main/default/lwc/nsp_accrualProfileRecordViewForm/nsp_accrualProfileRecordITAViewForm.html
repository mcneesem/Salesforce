<template>
  <lightning-card
    title="ITA Accrual Profile"
    class="slds-show slds-p-bottom">
      <c-nsp_alert-message
        if:true={state.errorMessage}
        message={state.errorMessage}
        mode="error">
    </c-nsp_alert-message>
    <lightning-record-edit-form
      record-id={recordId}
      object-api-name={accrualProfileObject}
      onerror={handleError}
      onload={handleLoad}
      density="comfy">
        <lightning-spinner
        if:true={state.isLoading}
        alternative-text="Loading">
      </lightning-spinner>
        <lightning-accordion
            if:true={isRecordTypeSelected}
            active-section-name={activeSections}
            allow-multiple-sections-open>

        <!-- Client Information -->
        <lightning-accordion-section
          name="ClientInformation"
          label="Client Information">
          <div class="slds-grid slds-gutters slds-p-top_x-small">
            <div class="slds-col slds-size_1-of-2">
                <div class="slds-p-left_x-small">
                <lightning-formatted-text
                    value="Accounts :">
                </lightning-formatted-text>
                <ul>
                    <template for:each={selectedAccounts} for:item="account">
                        <li key={account.value}>
                            <a href="#" data-value={account.value} onclick={handleSubClientClick}>{account.label}</a>
                    </li>
                    </template>
                </ul>
            </div>
            <div class="slds-p-top_small slds-p-bottom_small">
                <div class="slds-p-left_x-small">
                <lightning-formatted-text
                    value="Sub Clients : ">
                </lightning-formatted-text>
                <ul>
                    <template for:each={selectedSubClients} for:item="subClient">
                        <li key={subClient.value}>
                            <a href="#" data-value={subClient.value} onclick={handleSubClientClick}>{subClient.label}</a>
                    </li>
                    </template>
                </ul>
            </div>
        </div>
            <lightning-input-field disabled 
                field-name="NSP_Account_HRS__c"
                data-name="NSP_Account_HRS__c"
                value={fieldValue.NSP_Account_HRS__c}
                class="slds-form-element__legend">
              </lightning-input-field>

            <lightning-input-field disabled
                field-name="NSP_Submitted_by__c"
                data-name="NSP_Submitted_by__c"
                value={fieldValue.NSP_Submitted_by__c}
                class="slds-form-element__legend">
              </lightning-input-field>

            <lightning-input-field disabled
                field-name="CustomOwnerId__c"
                data-name="CustomOwnerId__c"
                value={fieldValue.CustomOwnerId__c}
                class="slds-form-element__legend">
            </lightning-input-field> 

            <lightning-input-field disabled
              field-name="Template__c"
              data-name="Template__c"
              value={fieldValue.Template__c}
              class="slds-form-element__legend">
            </lightning-input-field>  

            <lightning-input-field disabled
                lwc:if={showClonedFromTemplate}
                field-name="Cloned_from_AP_Template__c"
                data-name="Cloned_from_AP_Template__c"
                value={fieldValue.Cloned_from_AP_Template__c}
                class="slds-form-element__legend">
            </lightning-input-field>

            </div>
            <div class="slds-col slds-size_1-of-2">
            <lightning-input-field disabled
                field-name="NSP_Contact__c"
                data-name="NSP_Contact__c"
                value={fieldValue.NSP_Contact__c}
                class="slds-form-element__legend">
              </lightning-input-field>

            <lightning-input-field disabled
                field-name="NSP_Contact_email__c"
                data-name="NSP_Contact_email__c"
                value={fieldValue.NSP_Contact_email__c}
                class="slds-form-element__legend">
              </lightning-input-field>

              <lightning-input-field disabled
                field-name="Is_Client_MM_or_MM_Enterprise__c"
                label="Is Client Middle Market or Middle Market Enterprise?"
                data-name="Is_Client_MM_or_MM_Enterprise__c"
                value={fieldValue.Is_Client_MM_or_MM_Enterprise__c}
                class="slds-form-element__legend">
              </lightning-input-field>

              <lightning-input-field disabled
                value={fieldValue.NSP_NewExisting_Client_or_Change_order__c}
                field-name="NSP_NewExisting_Client_or_Change_order__c"
                data-name="NSP_NewExisting_Client_or_Change_order__c"
                class="slds-form-element__legend">
              </lightning-input-field>

              <lightning-input-field disabled 
              lwc:if={visibility.Enter_Case_number__c}
              field-name="Enter_Case_number__c"
              data-name="Enter_Case_number__c"
              value={fieldValue.Enter_Case_number__c}
              onchange={handleLookUpChange}>
              </lightning-input-field>
            </div>
          </div>
        </lightning-accordion-section>

        <!-- Policy Information -->
        <lightning-accordion-section
          name="PolicyInformation"
          label="Policy Information"
          >
          <div class="slds-grid slds-gutters slds-p-top_x-small">
            <div class="slds-col slds-size_1-of-2">
              <lightning-input-field
                disabled
                field-name="NSP_Type_of_Policy__c"
                data-name="NSP_Type_of_Policy__c"
                class="slds-form-element__legend"
                >
              </lightning-input-field>

              <lightning-input-field
                disabled
                if:true={visibility.NSP_Policy_Type_Provide_Details__c}
                field-name="NSP_Policy_Type_Provide_Details__c"
                data-name="NSP_Policy_Type_Provide_Details__c"
                value={fieldValue.NSP_Policy_Type_Provide_Details__c}
                class="slds-form-element__legend"
                >
              </lightning-input-field>

              <lightning-formatted-text
                if:true={visibility.NSP_Type_of_Policy_info_msg}
                value="This will not show on the paystub."
                class="slds-show slds-text-heading_small slds-var-m-around_medium"
                >
              </lightning-formatted-text>

              <lightning-input-field
                disabled
                field-name="NSP_Accrual_Profile_Plan_Name__c"
                data-name="NSP_Accrual_Profile_Plan_Name__c"
                value={fieldValue.NSP_Accrual_Profile_Plan_Name__c}
                class="slds-form-element__legend"
                >
              </lightning-input-field>

              <lightning-combobox
                read-only
                label="Status"
                value={fieldValue.NSP_Status__c}
                options={statusOptions}
                data-name="NSP_Status__c"
                class="slds-var-m-horizontal_x-small slds-form-element__legend slds-form-element__label"
                >
              </lightning-combobox>

              <c-nsp_selection-box
                disabled
                label="New/Revised"
                field-api-name="NSP_Accrual_Profile__c.NSP_New_Revised__c"
                record-type-id={fieldValue.recordTypeId}
                value={fieldValue.NSP_New_Revised__c}
                data-name="NSP_New_Revised__c"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </c-nsp_selection-box>

              <lightning-input-field
                disabled
                field-name="NSP_Effective_date__c"
                data-name="NSP_Effective_date__c"
                value={fieldValue.NSP_Effective_date__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-input-field>

            </div>
            <div class="slds-col slds-size_1-of-2">
              <lightning-formatted-text
                value="Does this plan replace another (or other) plans?"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-formatted-text>

              <lightning-input-field
                disabled 
                field-name="NSP_Does_this_plan_replace_other_plans__c"
                data-name="NSP_Does_this_plan_replace_other_plans__c"
                variant="label-hidden"
                value={fieldValue.NSP_Does_this_plan_replace_other_plans__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-input-field>

              <lightning-combobox
                read-only
                lwc:if={visibility.NSP_Accrual_Profile__c}
                label="Name of the plan being replaced"
                value={nameOfThePlanBeingReplaced}
                options={planOptions}
                data-name="NSP_Accrual_Profile__c"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-combobox>

              <lightning-input-field
                disabled
                if:true={visibility.NSP_Other_Plan__c}
                field-name="NSP_Other_Plan__c"
                data-name="NSP_Other_Plan__c"
                value={fieldValue.NSP_Other_Plan__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-input-field>

              <c-nsp_selection-box
                disabled
                label="Employee Status (check all that apply)"
                field-api-name="NSP_Accrual_Profile__c.NSP_Employee_Status_check_all_that_apply__c"
                record-type-id={fieldValue.recordTypeId}
                value={fieldValue.NSP_Employee_Status_check_all_that_apply__c}
                data-name="NSP_Employee_Status_check_all_that_apply__c"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                multiple
                >
              </c-nsp_selection-box>

              <lightning-input-field
                disabled
                lwc:if={visibility.Other_Status__c}
                field-name="Other_Status__c"
                data-name="Other_Status__c"
                value={fieldValue.Other_Status__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                onchange={handleValueChange}
                >
              </lightning-input-field>

              <lightning-input-field
                disabled
                value={fieldValue.NSP_Submitted_to_satisfy_compliance_need__c}
                field-name="NSP_Submitted_to_satisfy_compliance_need__c"
                data-name="NSP_Submitted_to_satisfy_compliance_need__c"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-input-field>

              <lightning-formatted-rich-text
                lwc:if={visibility.NSP_Compliance_Location__c}
                value="Compliance Locations (Click &lt;a href=&quot;https://serviceops.spapps.insperity.com/sites/hr/Shared%20Documents/Mandatory%20Leave%20Ordinances.docx&quot;&gt;here&lt;/a&gt; to see list of mandated sick/leave locations)."
                class="slds-show slds-var-m-around_xx-small slds-text-body_small slds-form-element__legend slds-form-element_vertical"
                >
              </lightning-formatted-rich-text>

              <lightning-input-field
                disabled
                if:true={visibility.NSP_Compliance_Location__c}
                variant="label-hidden"
                field-name="NSP_Compliance_Location__c"
                value={fieldValue.NSP_Compliance_Location__c}
                data-name="NSP_Compliance_Location__c"
                class="slds-show slds-var-p-horizontal_xx-small"
                >
              </lightning-input-field>

            </div>
          </div>
        </lightning-accordion-section>

        <!-- Policy Details -->
        <lightning-accordion-section
        name="PolicyDetails"
        label="Policy Details">
        <div class="slds-grid slds-gutters slds-p-top_x-small">
            <div class="slds-col slds-size_1-of-2">
            <lightning-formatted-text
                value="How many accrual levels (0-11 months, 12-35 months, etc.) will you have in your policy?"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
            </lightning-formatted-text>

            <lightning-input-field disabled 
                variant="label-hidden"
                field-name="NSP_Accrual_Levels__c"
                data-name="NSP_Accrual_Levels__c"
                value={fieldValue.NSP_Accrual_Levels__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
            </lightning-input-field>

            <lightning-formatted-text
                value="What is the plan year or 12-month period in which time is earned?"
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
            </lightning-formatted-text>

            <lightning-input-field disabled 
                field-name="NSP_What_is_the_plan_year__c"
                data-name="NSP_What_is_the_plan_year__c"
                variant="label-hidden"
                value={fieldValue.NSP_What_is_the_plan_year__c}
                class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical"
                >
            </lightning-input-field>

              <div if:true={visibility.isCalendarYear}>
                <lightning-input-field disabled
                  field-name="NSP_Accrue_under_plan_cal_year__c"
                  data-name="NSP_Accrue_under_plan_cal_year__c"
                  value={fieldValue.NSP_Accrue_under_plan_cal_year__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <lightning-formatted-text
                  if:true={visibility.NSP_If_hired_midway_through_pay_period__c_ITA_CALENDAR}
                  value="If hired midway through the pay period, is a prorated accrual earned?"
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-formatted-text>

                <lightning-input-field disabled
                  if:true={visibility.NSP_If_hired_midway_through_pay_period__c_ITA_CALENDAR}
                  variant="label-hidden"
                  value={fieldValue.NSP_If_hired_midway_through_pay_period__c}
                  field-name="NSP_If_hired_midway_through_pay_period__c"
                  data-name="NSP_If_hired_midway_through_pay_period__c"
                  data-visibility-name="NSP_If_hired_midway_through_pay_period__c_ITA_CALENDAR"
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <template
                  if:true={visibility.NSP_Is_there_a_frontloaded_proration__c_ITA_CALENDAR}>
                  <lightning-input-field disabled
                    field-name="NSP_Is_there_a_frontloaded_proration__c"
                    data-name="NSP_Is_there_a_frontloaded_proration__c"
                    value={fieldValue.NSP_Is_there_a_frontloaded_proration__c}
                    data-visibility-name="NSP_Is_there_a_frontloaded_proration__c_ITA_CALENDAR"
                    class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                  </lightning-input-field>

                  <lightning-formatted-rich-text
                    if:true={visibility.frontLoadITACalendar}
                    value="Complete the &lt;a href=&quot;https://serviceops.spapps.insperity.com/sites/hr/Shared%20Documents/front%20load%20proration%20tool.xlsx&quot;&gt;Frontloaded Proration&lt;/a&gt; file and attach to the Accrual Profile once approved."
                    class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                  </lightning-formatted-rich-text>
                </template>

                <lightning-input-field disabled
                  if:true={visibility.NSP_Select_Pay_Frequency__c_ITA_CALENDAR}
                  field-name="NSP_Select_Pay_Frequency__c"
                  data-name="NSP_Select_Pay_Frequency__c"
                  value={fieldValue.NSP_Select_Pay_Frequency__c}
                  data-visibility-name="NSP_Select_Pay_Frequency__c_ITA_CALENDAR"
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>
                
                <template lwc:if={visibility.NSP_Hours_paid_for_earning_accruals__c_ITA_CALENDER}>
                <div class="slds-show slds-var-m-around_xx-small slds-text-body_small slds-form-element__legend">
                  <label > Accrual rates are based on every 
                    <span if:true={visibility.Accrual_rates_are_based_Input_Number__c_ITA_CALENDER}>
                      <strong style="font-size: 15px; color: blue;">&nbsp;{fieldValue.Accrual_rates_are_based_Input_Number__c}&nbsp;</strong>
                    </span>
                    hours worked. Check each earning category that is considered hours worked/hours paid for the purpose of earning accruals</label>
                  <c-nsp_selection-box disabled
                    field-api-name="NSP_Accrual_Profile__c.NSP_Hours_paid_for_earning_accruals__c"
                    record-type-id={fieldValue.recordTypeId}
                    value={fieldValue.NSP_Hours_paid_for_earning_accruals__c}
                    data-name="NSP_Hours_paid_for_earning_accruals__c"
                    data-visibility-name="NSP_Hours_paid_for_earning_accruals__c_ITA_CALENDER"
                    class="slds-show slds-var-m-bottom_medium"
                    multiple>
                  </c-nsp_selection-box>
                </div>

                <lightning-input-field disabled
                  if:true={visibility.NSP_List_pay_codes__c_ITA_CALENDER}
                  data-visibility-name="NSP_List_pay_codes__c_ITA_CALENDER"
                  field-name="NSP_List_pay_codes__c"
                  data-name="NSP_List_pay_codes__c"
                  value={fieldValue.NSP_List_pay_codes__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>
              </template>
                <lightning-input-field disabled
                  if:true={visibility.NSP_Accrual_Period_Limit__c_ITA_CALENDAR}
                  field-name="NSP_Accrual_Period_Limit__c"
                  data-visibility-name="NSP_Accrual_Period_Limit__c_ITA_CALENDAR"
                  data-name="NSP_Accrual_Period_Limit__c"
                  value={fieldValue.NSP_Accrual_Period_Limit__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <lightning-combobox
                  read-only
                  lwc:if={visibility.NSP_When_do_accrual_level_changes_happen__c_ITA_CALENDAR}
                  label="When do accrual level changes happen?"
                  value={fieldValue.NSP_When_do_accrual_level_changes_happen__c}
                  options={accrualLevelChangesOptionsCalenderYear}
                  data-name="NSP_When_do_accrual_level_changes_happen__c"
                  data-visibility-name="NSP_When_do_accrual_level_changes_happen__c_ITA_CALENDAR"
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-combobox>
              </div>

              <div if:true={visibility.isAnniversaryYear}>
                <lightning-input-field disabled
                  lwc:if={visibility.NSP_time_accrue_under_plan_anniv_year__c}
                  field-name="NSP_time_accrue_under_plan_anniv_year__c"
                  data-name="NSP_time_accrue_under_plan_anniv_year__c"
                  value={fieldValue.NSP_time_accrue_under_plan_anniv_year__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <lightning-formatted-text
                  if:true={visibility.NSP_If_hired_midway_through_pay_period__c_ITA_ANNIVERSARY}
                  value="If hired midway through the pay period, is a prorated accrual earned?"
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-formatted-text>

                <lightning-input-field disabled
                  if:true={visibility.NSP_If_hired_midway_through_pay_period__c_ITA_ANNIVERSARY}
                  variant="label-hidden"
                  field-name="NSP_If_hired_midway_through_pay_period__c"
                  data-name="NSP_If_hired_midway_through_pay_period__c"
                  data-visibility-name="NSP_If_hired_midway_through_pay_period__c_ITA_ANNIVERSARY"
                  value={fieldValue.NSP_If_hired_midway_through_pay_period__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <lightning-input-field disabled
                  if:true={visibility.NSP_Select_Pay_Frequency__c_ITA_ANNIVERSARY}
                  field-name="NSP_Select_Pay_Frequency__c"
                  data-name="NSP_Select_Pay_Frequency__c"
                  data-visibility-name="NSP_Select_Pay_Frequency__c_ITA_ANNIVERSARY"
                  value={fieldValue.NSP_Select_Pay_Frequency__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>

                <template lwc:if={visibility.NSP_Hours_paid_for_earning_accruals__c_ITA_ANNIVERSARY}>
                  <div class="slds-show slds-var-m-around_xx-small slds-text-body_small slds-form-element__legend">
                  <label> Accrual rates are based on every 
                    <span if:true={visibility.Accrual_rates_are_based_Input_Number__c_ITA_ANNIVERSARY}>
                    <strong style="font-size: 15px; color: blue;">&nbsp;{fieldValue.Accrual_rates_are_based_Input_Number__c}&nbsp;</strong>
                    </span>
                    hours worked. Check each earning category that is considered hours worked/hours paid for the purpose of earning accruals</label>
                    <c-nsp_selection-box disabled
                      if:true={visibility.NSP_Hours_paid_for_earning_accruals__c_ITA_ANNIVERSARY}
                      field-api-name="NSP_Accrual_Profile__c.NSP_Hours_paid_for_earning_accruals__c"
                      record-type-id={fieldValue.recordTypeId}
                      value={fieldValue.NSP_Hours_paid_for_earning_accruals__c}
                      data-name="NSP_Hours_paid_for_earning_accruals__c"
                      data-visibility-name="NSP_Hours_paid_for_earning_accruals__c_ITA_ANNIVERSARY"
                      multiple>
                    </c-nsp_selection-box>
                </div>

                <lightning-input-field disabled
                  if:true={visibility.NSP_List_pay_codes__c_ITA_ANNIVERSARY}
                  data-visibility-name="NSP_List_pay_codes__c_ITA_ANNIVERSARY"
                  field-name="NSP_List_pay_codes__c"
                  data-name="NSP_List_pay_codes__c"
                  value={fieldValue.NSP_List_pay_codes__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>
              </template>
        
                <lightning-input-field disabled
                  if:true={visibility.NSP_Accrual_Period_Limit__c_ITA_ANNIVERSARY}
                  field-name="NSP_Accrual_Period_Limit__c"
                  data-visibility-name="NSP_Accrual_Period_Limit__c_ITA_ANNIVERSARY"
                  data-name="NSP_Accrual_Period_Limit__c"
                  value={fieldValue.NSP_Accrual_Period_Limit__c}
                  class="slds-show slds-var-m-bottom_medium slds-form-element__control slds-form-element__legend slds-form-element_vertical">
                </lightning-input-field>
