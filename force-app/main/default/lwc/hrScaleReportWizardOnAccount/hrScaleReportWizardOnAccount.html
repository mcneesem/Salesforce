<template>
    <template lwc:if={checkRequiredFields}>
        <div onsaveexit={handleCloseModal} class="slds-var-m-around_medium">
            <div class="customHeader customHeaderWithClose">
                <label for="wizardHeader" class="slds-text-heading_medium slds-hyphenate header-string">
                    {label.wizardHeader}
                </label>
                <lightning-button-icon
                    icon-name="utility:close"
                    variant="bare"
                    alternative-text="Close"
                    class="slds-button slds-button_icon slds-modal__close"
                    onclick={handleCloseModal}>
                </lightning-button-icon>
            </div>
            <c-development-report-wizard id="wizardHeader" rep-req-obj={recordObj} current-step="1">
            </c-development-report-wizard>
        </div>
    </template>
</template>
