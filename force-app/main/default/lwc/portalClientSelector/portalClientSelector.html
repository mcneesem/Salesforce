<template>
    <lightning-card title="New Client Portal">
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12" padding="around-small">
                <template lwc:if={records}>
                    <lightning-combobox
                        name="selector"
                        label="Portal Clients"
                        variant="label-hidden"
                        placeholder="Select Portal Client"
                        value={recordId}
                        options={records}
                        onchange={handleChange}
                        >
                    </lightning-combobox>
                </template>
            </lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small">
                <template lwc:if={recordId}>
                    <c-portal-client record-id={recordId}></c-portal-client>
                </template>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
