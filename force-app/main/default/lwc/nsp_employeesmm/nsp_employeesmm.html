<template>
  <lightning-record-edit-form
    onerror={handleError}
    record-id={recordId}
    onload={handleLoad}
    object-api-name={objectApiName}
    density="comfy">
    <lightning-formatted-text class="slds-page-header__title" value={title}>
    </lightning-formatted-text>
    <div class="section slds-p-top_small" data-id="employees">
      <c-nsp_selection-box
        disabled={disabledFields.Does_the_client_have_any_union_EEs__c}
        label={objFields.Does_the_client_have_any_union_EEs__c.label}
        field-api-name="Implementation_Profile__c.Does_the_client_have_any_union_EEs__c"
        record-type-id={recordTypeId}
        data-name="Does_the_client_have_any_union_EEs__c"
        value={field.Does_the_client_have_any_union_EEs__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Client_union_EE_Check_all_that_Apply__c}
        if:true={visibility.Client_union_EE_Check_all_that_Apply__c}
        class={styles.Client_union_EE_Check_all_that_Apply__c}
        label={label.checkAllThatApply}
        field-api-name="Implementation_Profile__c.Client_union_EE_Check_all_that_Apply__c"
        record-type-id={recordTypeId}
        data-name="Client_union_EE_Check_all_that_Apply__c"
        value={field.Client_union_EE_Check_all_that_Apply__c}
        onchange={handleValueChange}
        multiple>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Any_exempt_part_time_employees__c}
        label={label.ExemptPTEmp}
        field-api-name="Implementation_Profile__c.Any_exempt_part_time_employees__c"
        record-type-id={recordTypeId}
        data-name="Any_exempt_part_time_employees__c"
        value={field.Any_exempt_part_time_employees__c}
        onchange={handleValueChange}
        multiple>
      </c-nsp_selection-box>

      <c-nsp_selection-box
        disabled={disabledFields.NSP_Any_employee_with_temporary_status__c}
        label={label.employTempStatus}
        field-api-name="Implementation_Profile__c.NSP_Any_employee_with_temporary_status__c"
        record-type-id={recordTypeId}
        data-name="NSP_Any_employee_with_temporary_status__c"
        value={field.NSP_Any_employee_with_temporary_status__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>

      <lightning-formatted-text
        if:true={visibility.empWithTempStatus}
        class={styles.empWithTempStatus}
        field-name="empWithTempStatus"
        value={helpText.empWithTempStatus}></lightning-formatted-text>
      <c-nsp_selection-box
        disabled={disabledFields.Does_client_have_any_Minor_EEs__c}
        label={objFields.Does_client_have_any_Minor_EEs__c.label}
        field-api-name="Implementation_Profile__c.Does_client_have_any_Minor_EEs__c"
        record-type-id={recordTypeId}
        data-name="Does_client_have_any_Minor_EEs__c"
        value={field.Does_client_have_any_Minor_EEs__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Client_have_will_have_any_Seasonal_EEs__c}
        label={label.ClntSsnlEE}
        field-api-name="Implementation_Profile__c.Client_have_will_have_any_Seasonal_EEs__c"
        record-type-id={recordTypeId}
        data-name="Client_have_will_have_any_Seasonal_EEs__c"
        value={field.Client_have_will_have_any_Seasonal_EEs__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Does_client_employ_ministers_or_teachers__c}
        label={label.doesClientEmployMinistersOrTeachers}
        field-api-name="Implementation_Profile__c.Does_client_employ_ministers_or_teachers__c"
        record-type-id={recordTypeId}
        data-name="Does_client_employ_ministers_or_teachers__c"
        value={field.Does_client_employ_ministers_or_teachers__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Check_all_tht_apply_ministers_teachers__c}
        if:true={visibility.Check_all_tht_apply_ministers_teachers__c}
        class={styles.Check_all_tht_apply_ministers_teachers__c}
        label="Check all that apply"
        field-api-name="Implementation_Profile__c.Check_all_tht_apply_ministers_teachers__c"
        record-type-id={recordTypeId}
        data-name="Check_all_tht_apply_ministers_teachers__c"
        value={field.Check_all_tht_apply_ministers_teachers__c}
        onchange={handleValueChange}
        multiple>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.NSP_non_Insperity_paid_emps_contractors__c}
        label={label.clientNonInsperityEmployeeQuestion}
        field-api-name="Implementation_Profile__c.NSP_non_Insperity_paid_emps_contractors__c"
        record-type-id={recordTypeId}
        data-name="NSP_non_Insperity_paid_emps_contractors__c"
        value={field.NSP_non_Insperity_paid_emps_contractors__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <lightning-input-field
        value={field.Provide_non_insperity_worker_details__c}
        disabled={disabledFields.Provide_non_insperity_worker_details__c}
        if:true={visibility.Provide_non_insperity_worker_details__c}
        data-name="Provide_non_insperity_worker_details__c"
        class={styles.Provide_non_insperity_worker_details__c}
        field-name="Provide_non_insperity_worker_details__c"
        onchange={handleValueChange}></lightning-input-field>

      <c-nsp_selection-box
        disabled={disabledFields.Any_EEs_travel_internationally_for_work__c}
        label={label.doEETravelInternationally}
        field-api-name="Implementation_Profile__c.Any_EEs_travel_internationally_for_work__c"
        record-type-id={recordTypeId}
        data-name="Any_EEs_travel_internationally_for_work__c"
        value={field.Any_EEs_travel_internationally_for_work__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>

      <template if:true={visibility.Provide_EE_travel_details__c}>
        <div class="slds-form-element__label">
          <lightning-formatted-text
            class={styles.internationalTravelNotify}
            value={label.internationalTravelNotify}>
          </lightning-formatted-text>
        </div>
        <lightning-input-field
          value={field.Provide_EE_travel_details__c}
          disabled={disabledFields.Provide_EE_travel_details__c}
          field-name="Provide_EE_travel_details__c"
          data-name="Provide_EE_travel_details__c"
          onchange={handleValueChange}
          class={styles.Provide_EE_travel_details__c}></lightning-input-field>
      </template>
      <c-nsp_selection-box
        disabled={disabledFields.Are_there_any_EEs_on_Leave_of_Absence__c}
        label={objFields.Are_there_any_EEs_on_Leave_of_Absence__c.label}
        field-api-name="Implementation_Profile__c.Are_there_any_EEs_on_Leave_of_Absence__c"
        record-type-id={recordTypeId}
        data-name="Are_there_any_EEs_on_Leave_of_Absence__c"
        value={field.Are_there_any_EEs_on_Leave_of_Absence__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <div
        if:true={visibility.Do_you_have_the_LOA_information__c}
        class={styles.Do_you_have_the_LOA_information__c}>
        <lightning-input-field
          value={field.What_is_the_status_of_the_LOA_info__c}
          disabled={disabledFields.What_is_the_status_of_the_LOA_info__c}
          if:true={visibility.What_is_the_status_of_the_LOA_info__c}
          class={styles.What_is_the_status_of_the_LOA_info__c}
          field-name="What_is_the_status_of_the_LOA_info__c"
          data-name="What_is_the_status_of_the_LOA_info__c"
          onchange={handleValueChange}>
        </lightning-input-field>
      </div>
      <c-nsp_selection-box
        disabled={disabledFields.Select_the_applicable_LOA_types__c}
        if:true={visibility.Select_the_applicable_LOA_types__c}
        class={styles.Select_the_applicable_LOA_types__c}
        label={objFields.Select_the_applicable_LOA_types__c.label}
        field-api-name="Implementation_Profile__c.Select_the_applicable_LOA_types__c"
        record-type-id={recordTypeId}
        data-name="Select_the_applicable_LOA_types__c"
        value={field.Select_the_applicable_LOA_types__c}
        onchange={handleValueChange}
        multiple>
      </c-nsp_selection-box>
      <c-nsp_selection-box
        disabled={disabledFields.Told_EE_ineligble_for_active_at_work_ben__c}
        if:true={visibility.Told_EE_ineligble_for_active_at_work_ben__c}
        class={styles.Told_EE_ineligble_for_active_at_work_ben__c}
        label={label.didYouInformThatEEwillnotbeEligible}
        field-api-name="Implementation_Profile__c.Told_EE_ineligble_for_active_at_work_ben__c"
        record-type-id={recordTypeId}
        data-name="Told_EE_ineligble_for_active_at_work_ben__c"
        value={field.Told_EE_ineligble_for_active_at_work_ben__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <lightning-input-field
        value={field.How_will_EE_complete_their_enrollment__c}
        disabled={disabledFields.How_will_EE_complete_their_enrollment__c}
        if:true={visibility.How_will_EE_complete_their_enrollment__c}
        data-name="How_will_EE_complete_their_enrollment__c"
        field-name="How_will_EE_complete_their_enrollment__c"
        class={styles.How_will_EE_complete_their_enrollment__c}
        onchange={handleValueChange}></lightning-input-field>

      <c-nsp_selection-box
        disabled={disabledFields.NSP_Any_active_severance_agreement__c}
        label={label.activeseveranceAgreementsNotpaidPriorInspEffDate}
        field-api-name="Implementation_Profile__c.NSP_Any_active_severance_agreement__c"
        record-type-id={recordTypeId}
        data-name="NSP_Any_active_severance_agreement__c"
        value={field.NSP_Any_active_severance_agreement__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <template if:true={visibility.NSP_how_future_payment_will_be_done__c}>
        <div class="slds-form-element__label">
          <lightning-formatted-text
            value={label.futurepayment}
            data-field="NSP_how_future_payment_will_be_done__c"
            class={styles.NSP_how_future_payment_will_be_done__c}>
          </lightning-formatted-text>
        </div>
        <lightning-input-field
          value={field.NSP_how_future_payment_will_be_done__c}
          disabled={disabledFields.NSP_how_future_payment_will_be_done__c}
          field-name="NSP_how_future_payment_will_be_done__c"
          data-name="NSP_how_future_payment_will_be_done__c"
          variant="label-hidden"
          onchange={handleValueChange}
          class={styles.NSP_how_future_payment_will_be_done__c}>
        </lightning-input-field>
      </template>

      <c-nsp_selection-box
        disabled={disabledFields.remove_employee_directory_from_premier__c}
        label={label.clientLikeEmpDirectoryRemovePremier}
        field-api-name="Implementation_Profile__c.remove_employee_directory_from_premier__c"
        record-type-id={recordTypeId}
        data-name="remove_employee_directory_from_premier__c"
        value={field.remove_employee_directory_from_premier__c}
        onchange={handleValueChange}>
      </c-nsp_selection-box>
      <lightning-input-field
        value={field.NSP_Employee_Notes__c}
        disabled={disabledFields.NSP_Employee_Notes__c}
        field-name="NSP_Employee_Notes__c"
        data-name="NSP_Employee_Notes__c"
        onchange={handleValueChange}></lightning-input-field>
    </div>
  </lightning-record-edit-form>
</template>
