<template>
    <lightning-card>
        <div class="slds-p-around_medium">
            <template lwc:if={isLoading}>
                <div class="slds-text-align_center">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    <p>Loading schedule data...</p>
                </div>
            </template>
            <template lwc:if={isReady}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-border_bottom slds-theme_shade slds-text-title_caps">
                                <th class="slds-text-align_right" scope="col">
                                    <strong>Time blocks</strong>
                                </th>
                                <template for:each={columns} for:item="col">
                                    <th
                                        key={col.dateValue}
                                        scope="col"
                                        class="slds-text-align_center"
                                    >
                                        <strong>{col.label}</strong><br />
                                        <span class="slds-text-body_small">{col.dateValue}</span>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={processedTableData} for:item="row" for:index="rowIndex">
                                <tr key={row.id} class="slds-border_bottom slds-hint-parent">
                                    <td class="slds-text-align_right" style="white-space:nowrap;">
                                        <lightning-formatted-date-time
                                            value={row.startTime}
                                            hour="numeric"
                                            minute="2-digit"
                                            time-zone={timeZone}
                                        ></lightning-formatted-date-time>
                                        &nbsp;-&nbsp;
                                        <lightning-formatted-date-time
                                            value={row.endTime}
                                            hour="numeric"
                                            minute="2-digit"
                                            time-zone={timeZone}
                                            time-zone-name="short"
                                        ></lightning-formatted-date-time>
                                    </td>
                                    <template for:each={row.cells} for:item="cell">
                                        <td
                                            key={cell.key}
                                            class="slds-text-align_center"
                                        >
                                            <lightning-button
                                                variant="base"
                                                label={cell.value}
                                                onclick={handleCellClick}
                                                data-start={cell.start}
                                                data-end={cell.end}
                                                data-ids={cell.idsJson}
                                                class="slds-text-link"
                                                disabled={cell.disabled}
                                            >
                                            </lightning-button>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
