<template>
    <template lwc:if={recordId}>
        <template lwc:if={record}>
            <template lwc:if={isHelpText}>
                &nbsp;<c-helptext content={helpText}></c-helptext>
            </template>
            <template lwc:if={isRichText}>
                <lightning-formatted-rich-text value={richText}></lightning-formatted-rich-text>
            </template>
        </template>
    </template>
</template>
