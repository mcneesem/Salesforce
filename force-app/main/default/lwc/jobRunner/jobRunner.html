<template>
    <lightning-card>
        <h1 slot="title">Job Runner</h1>
        <div class="slds-p-around_medium container">
            <lightning-combobox
                name="batchClass"
                label="Select Batch Class"
                value={selectedBatchClass}
                options={batchClassOptions}
                onchange={handleBatchClassChange}
                placeholder="Choose a batch class"
                required
            ></lightning-combobox>
            <div class="slds-m-top_medium button-section">
                <lightning-button
                    label="Execute"
                    variant="brand"
                    onclick={handleExecute}
                    class="slds-m-right_small"
                    disabled={isDisabled}
                ></lightning-button>                
                <lightning-button
                    label="Status"
                    variant="brand"
                    onclick={handleStatus}
                    disabled={isDisabled}
                    class="slds-m-right_small"
                ></lightning-button>
                <lightning-button-icon
                    lwc:if={showStatus}
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh Status"
                    onclick={handleStatus}
                    disabled={isDisabled}
                ></lightning-button-icon>
            </div>
            <div lwc:if={showStatus}>
                <lightning-datatable
                    key-field="Id"
                    data={paginatedData}
                    columns={columns}
                    hide-checkbox-column
                    class="slds-m-top_large table-section"
                ></lightning-datatable>
                <div class="slds-m-top_medium pagination-section">
                    <lightning-button
                        label="Previous"
                        variant="neutral"
                        onclick={handlePrevious}
                        disabled={isFirstPage}
                    ></lightning-button>
                    <span class="slds-m-horizontal_small">
                        Page {currentPage} of {totalPages}
                    </span>
                    <lightning-button
                        label="Next"
                        variant="neutral"
                        onclick={handleNext}
                        disabled={isLastPage}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
