<template>
    <div class="slds-box">
        <lightning-record-edit-form
            object-api-name="NSP_ReportRequest__c"
            record-id={reReqId}
            record-type-id={recordTypeId}
            onsuccess={handleSuccess}
            onerror={handleError}
            onload={handleOnLoad}
            >
            <lightning-messages></lightning-messages>
            <lightning-layout>
                <lightning-layout-item size="8">
                    <div style="display:none">
                        <lightning-input-field
                            class="slds-hidden"
                            data-fname="LastSavedPageNumber"
                            field-name="NSP_LastSavedPageNumber__c"
                            value={pageNumber}
                            >
                        </lightning-input-field>
                        <lightning-input-field
                            class="slds-hidden"
                            field-name="Name"
                            value={reportName}
                            >
                        </lightning-input-field>
                    </div>
                    <lightning-layout>
                        <lightning-layout-item size="6">
                            <div class="slds-m-top_medium slds-p-around_medium">
                                <div class="slds-var-m-around_medium slds-align_absolute-center ">
                                    <lightning-input-field
                                        data-fname="clientName"
                                        field-name='NSP_ClientName__c'
                                        required
                                        value={clientId}
                                        onchange={handleAccChange}
                                        >
                                    </lightning-input-field>
                                </div>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                    <template if:true={enableContact}>
                        <div class="slds-form-element__label">
                            <p>Who at client will have access to the online results report dashboard?</p>
                        </div>
                        <lightning-layout>
                            <lightning-layout-item size="4">
                                <div class="slds-var-m-around_medium">
                                    <div class="slds-form-element ">
                                        <label for="NSP_Contact__c" class="slds-form-element__label">
                                            <abbr title="required" class="slds-required">*</abbr>
                                            Select Contact
                                        </label>
                                        <template if:true={isOnloadCalled}>
                                            <c-nsp_case-custom-look-up
                                                s-object-api-name="Contact"
                                                icon-name="standard:contact"
                                                parent-id={clientAccId}
                                                default-record-id={NSP_Contact__c}
                                                onlookupupdate={handlelookupRecord}
                                                search-key={cname}
                                                placeholder="Search Contacts..."
                                                >
                                            </c-nsp_case-custom-look-up>
                                        </template>
                                        <div style="display:none">
                                            <lightning-input-field
                                                data-fname="NSP_Contact__c"
                                                id="NSP_Contact__c"
                                                lwc:ref="NSP_Contact__c"
                                                field-name="NSP_Contact__c"
                                                value={NSP_Contact__c}
                                                disabled={disableContact}
                                                dirty
                                                >
                                            </lightning-input-field>
                                        </div>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4">
                                <div class="slds-var-m-around_medium ">
                                    <lightning-input
                                        name="cemail"
                                        required 
                                        data-fname="emailAddress" 
                                        lwc:ref="emailAddress" 
                                        class='emailAddress' 
                                        type="email" 
                                        label="Email address" 
                                        value={cemail} 
                                        pattern="[A-Za-z0-9._\-]+@[a-z0-9.\-]+\.[a-zA-Z]{2,6}" 
                                        message-when-pattern-mismatch="Please enter a valid email" 
                                        disabled={disableEmail}
                                        >
                                    </lightning-input>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4">
                                <div class="slds-m-top_medium slds-align_absolute-center slds-p-around_medium">
                                    <lightning-button
                                        variant="brand"
                                        label="Add"
                                        disabled={showButton}
                                        onclick={handleAddContact}
                                        >
                                    </lightning-button>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <lightning-datatable
                                key-field="Id"
                                data={mergeObjectList}
                                columns={columns}
                                onrowaction={handleRowAction}
                                hide-checkbox-column
                                >
                            </lightning-datatable>
                            <div class="slds-var-p-bottom_large" style={showErroMsg}>
                                <div class="slds-text-color_error slds-m-bottom_large">
                                    Please add a Contact. This field is required.
                                </div>
                                <div style='display:none'>
                                    <lightning-input-field
                                        id="contactSelect"
                                        class="NSP_WhoAtclientCccessToOnlineResul__c"
                                        field-name="NSP_WhoAtclientCccessToOnlineResul__c"
                                        value={arrayToTextArea}
                                        required
                                        >
                                    </lightning-input-field>
                                </div>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout>
                        <lightning-layout-item size="6">
                            <div class="slds-m-vertical_large">
                                <template if:true={surveyTypeValues.data}>
                                    <div class="slds-var-m-around_medium slds-p-top_large">
                                        <lightning-radio-group
                                            name="NSP_Survey_Type__c"
                                            label="Survey Type"
                                            options={surveyTypeValues.data.values}
                                            value={NSP_Survey_Type__c}
                                            onchange={handleChange}
                                            required type="radio"
                                            >
                                        </lightning-radio-group>
                                        <div style='display:none'>
                                            <lightning-input-field
                                                field-name="NSP_Segment__c"
                                                value={segmentType}
                                                class="slds-hidden"
                                                >
                                            </lightning-input-field>
                                            <lightning-input-field
                                                field-name="NSP_Region__c"
                                                value={region}
                                                class="slds-hidden"
                                                >
                                            </lightning-input-field>
                                            <lightning-input-field
                                                field-name="NSP_HRSpeciallist__c"
                                                value={userID}
                                                class="slds-hidden"
                                                >
                                            </lightning-input-field>
                                            <lightning-input-field
                                                field-name="Performance_Specialist__c"
                                                value={psUserId}
                                                class="slds-hidden"
                                                >
                                            </lightning-input-field>
                                            <lightning-input-field
                                                field-name="NSP_Survey_Type__c"
                                                value={NSP_Survey_Type__c}
                                                required
                                                >
                                            </lightning-input-field>
                                        </div>
                                        <lightning-input-field
                                            name="NSP_Begin_Date__c"
                                            class='slds-m-vertical_large'
                                            field-name="NSP_Begin_Date__c"
                                            required
                                            onchange={handleChange}
                                            >
                                        </lightning-input-field>
                                        <div style={showEndDate}>
                                            <lightning-input-field
                                                name="NSP_End_Date__c"
                                                class="slds-m-vertical_large NSP_End_Date__c"
                                                field-name="NSP_End_Date__c"
                                                required={endDateRequired}
                                                onchange={handleChange}
                                                value={NSP_End_Date__c}
                                                >
                                            </lightning-input-field>
                                        </div>
                                        <div class='slds-m-vertical_large'>
                                            <lightning-radio-group
                                                name="NSP_BargainingUnitEmployeesComplete__c"
                                                label="Does the client plan to have any Bargaining Unit Employees complete the survey?"
                                                options={yesNoValues}
                                                value={NSP_BargainingUnitEmployeesComplete__c}
                                                required
                                                onchange={handleChange}
                                                type="radio"
                                                >
                                            </lightning-radio-group>
                                        </div>
                                        <div style='display:none'>
                                            <lightning-input-field
                                                class="NSP_BargainingUnitEmployeesComplete__c"
                                                field-name="NSP_BargainingUnitEmployeesComplete__c" 
                                                value={NSP_BargainingUnitEmployeesComplete__c}
                                                required
                                                >
                                            </lightning-input-field>
                                        </div>
                                    </div>
                                    <template if:true={showUnion}>
                                        <p>An HR Advisor will be contacting you once the survey closes to discuss the best approach for implementing action plans for union employees</p>
                                    </template>
                                </template>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item></lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
                <lightning-layout-item size="4">
                    <lightning-layout-item></lightning-layout-item>
                </lightning-layout-item>
            </lightning-layout>
            <div class="slds-m-top_medium slds-align_absolute-center slds-p-around_medium">
                <lightning-button
                    class="slds-m-top_small slds-m-left_small"
                    onclick={handleSave}
                    label="Save and Exit"
                    >
                </lightning-button>
                <template lwc:if={isWoMiddleMarketAsset}>
                    <lightning-button
                        class="slds-m-top_small slds-m-left_small"
                        lwc:ref="isSubmit"
                        type="submit"
                        variant="brand"
                        label="Submit"
                        onclick={handleSubmitWoAsset}
                        >
                    </lightning-button>
                </template>
                <template lwc:else>
                    <lightning-button
                        class="slds-m-top_small slds-m-left_small"
                        type="submit"
                        variant="brand"
                        label="Next"
                        onclick={handleNext}
                        >
                    </lightning-button>
                </template>
            </div>
        </lightning-record-edit-form>
    </div>
</template>
