<template>
    <template lwc:if={record}>
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12" medium-device-size="8">
                <c-portal-project record={record}></c-portal-project>
            </lightning-layout-item>
            <lightning-layout-item size="12" medium-device-size="4">
                <lightning-layout multiple-rows>
                    <template lwc:if={showMeetingCalendar}>
                        <lightning-layout-item size="12" padding="around-small">
                            <c-portal-event-calendar record-id={record.fields.Portal_Client__c.value}></c-portal-event-calendar>
                        </lightning-layout-item>
                    </template>
                    <template lwc:if={showMeetingList}>
                        <lightning-layout-item size="12" padding="around-small">
                            <c-portal-event-list record-id={record.fields.Portal_Client__c.value}></c-portal-event-list>
                        </lightning-layout-item>
                    </template>
                    <lightning-layout-item size="12" padding="around-small">
                        <c-portal-client-resources></c-portal-client-resources>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </lightning-layout>
    </template>
</template>
