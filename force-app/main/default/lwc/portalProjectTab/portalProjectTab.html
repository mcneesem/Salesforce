<template>
    <template lwc:if={record}>
        <lightning-layout pull-to-boundary="small" multiple-rows>
            <lightning-layout-item
                size={columnSizeFull}
                small-device-size={columnSizeFull}
                medium-device-size={columnSizeFull}
                large-device-size={columnSizeLeft}
                >
                <c-portal-project record={record}></c-portal-project>
            </lightning-layout-item>
            <lightning-layout-item
                size={columnSizeFull}
                small-device-size={columnSizeFull}
                medium-device-size={columnSizeFull}
                large-device-size={columnSizeRight}
                >
                <lightning-layout multiple-rows>
                    <template lwc:if={showMeetingCalendar}>
                        <lightning-layout-item size={columnSizeFull} padding="around-small">
                            <c-portal-event-calendar record-id={recordId}></c-portal-event-calendar>
                        </lightning-layout-item>
                    </template>
                    <template lwc:if={showMeetingList}>
                        <lightning-layout-item size={columnSizeFull} padding="around-small">
                            <c-portal-event-list record-id={recordId}></c-portal-event-list>
                        </lightning-layout-item>
                    </template>
                    <lightning-layout-item size={columnSizeFull} padding="around-small">
                        <c-portal-resources record-id={recordId}></c-portal-resources>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </lightning-layout>
    </template>
</template>
