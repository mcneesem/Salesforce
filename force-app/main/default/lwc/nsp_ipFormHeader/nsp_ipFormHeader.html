<template>
  <div class="slds-border_bottom slds-p-around_small slds-grid slds-gutters">
    <div class="slds-col slds-size_3-of-4">
      <div class="slds-page-header__title">{mainTitle}</div>
      <div>{subTitle}</div>
    </div>
    <div class="slds-col slds-size_1-of-4">
      <div class="slds-grid slds-grid_align-end">
        <lightning-button
          if:true={readOnly}
          label={label.exit}
          variant="brand"
          onclick={handleButtonClick}
          name="exit"
          class="slds-col"></lightning-button>

        <template if:false={readOnly}>
          <lightning-button
            label={label.copyButton}
            onclick={handleButtonClick}
            name="copy"
            class="slds-col"></lightning-button>

          <lightning-button
            label={label.saveAndExit}
            variant="brand"
            onclick={handleButtonClick}
            name="saveAndExit"
            class="slds-col"></lightning-button>
        </template>
      </div>
    </div>
  </div>
</template>
