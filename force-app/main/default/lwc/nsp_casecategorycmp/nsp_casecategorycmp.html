<!--
@description       : LWC Component to handle the category/sub-category mapping selection edit on case records.
@Created On        : November 8th 2021
-->
<template>
    <div class="container">
        <div class="slds-grid slds-page-header slds-p-around_small">
            <header class="slds-media slds-media--center slds-has-flexi-truncate">
                <div class="slds-media__body" data-aura-rendered-by="1233:0">
                    <h2 class="slds-card__header-title">
                        <lightning-formatted-text class="slds-text-heading_small" value={label.header}>
                        </lightning-formatted-text>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <template if:true={view}>
                        <lightning-button label={label.editCase} onclick={editCase}></lightning-button>
                    </template>
                </div>
            </header>
        </div>
        <div class="slds-p-around_medium slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner></lightning-spinner>
            </template>
            <template if:true={view}>
                <lightning-record-view-form record-id={recordId} object-api-name={objectApiName} density="compact">
                    <lightning-output-field field-name="NSP_Category__c" value={oCase.NSP_Category__c}></lightning-output-field>
                    <lightning-output-field field-name="NSP_SubCategory__c" value={oCase.NSP_SubCategory__c}></lightning-output-field>
                    <template if:true={showCaseDetail}>
                        <lightning-output-field field-name="NSP_Detail__c" value={oCase.NSP_Detail__c}></lightning-output-field>
                    </template>
                    <template if:true={showCaseVersion}>
                        <lightning-output-field field-name="NSP_Version__c" value={oCase.NSP_Version__c}></lightning-output-field>
                    </template>
                </lightning-record-view-form>
            </template>
            <template if:false={view}>
                <c-case-cat-subcat-detail
                    record-id={recordId}
                    rec-type-id={oCase.RecordTypeId}
                    selected-category={oCase.NSP_Category__c}
                    selected-sub-category= {oCase.NSP_SubCategory__c}
                    selected-detail= {oCase.NSP_Detail__c}
                    selected-version= {oCase.NSP_Version__c}
                    onselectionchange={handleSelectionChange}
                    variant="sidebar"
                    >
                </c-case-cat-subcat-detail>
                <div class="slds-align_absolute-center">
                    <lightning-button variant="brand" label={label.save} onclick={updateCase} 
                    class="slds-m-right_small"></lightning-button>
                    <lightning-button label={label.cancel} onclick={cancel}></lightning-button>
                </div>
            </template>
        </div>
    </div>
</template>
