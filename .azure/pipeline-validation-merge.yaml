# pipeline-validation-merge.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  # Preview
  - name: isEnabledPreview
    type: boolean
    default: true

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: $(FromCommit.PullRequests.Merge)
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.Merge)

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "MERGE"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Merge)"

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE-Validate"
      dependsOnStage: "Package"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isTimeoutAnError: true
      isEnabledNotification: false

  #
  # Confirm
  #

  - template: ./stages/confirm.yaml
    parameters:
      orgApiName: "MERGE"
      dependsOnStage: "CheckOnlyStageMERGE"

  #
  # Check Only
  #

  - ${{ if parameters.isEnabledPreview }}:
    - template: ./stages/check-only.yaml
      parameters:
        orgApiName: "TEST"
        environmentName: "Salesforce-TEST-Validate"
        dependsOnStage: "Package"
        reportTimeout: $(reportTimeout)
        fromCommit: "$(fromCommit)"
        isTimeoutAnError: true
        isEnabledNotification: false

  #
  # Confirm
  #

  - ${{ if parameters.isEnabledPreview }}:
    - template: ./stages/confirm.yaml
      parameters:
        orgApiName: "TEST"
        dependsOnStage: "CheckOnlyStageTEST"
