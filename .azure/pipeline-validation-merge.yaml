# pipeline-validation-merge.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: $(FromCommit.PullRequests.Merge)
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.Merge)

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "MERGE"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Merge)"

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE-Validate"
      dependsOnStage: "Package"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isTimeoutAnError: true
      isEnabledNotification: false

  #
  # Verify
  #

  - stage: "VerifyStage"
    displayName: "Verify"
    condition: |
      and(
        succeeded(),
        true
      )
    dependsOn:
      - CheckOnlyStageMERGE
    variables:
      validatedPackageId: $[ stageDependencies.CheckOnlyStageMERGE.CheckOnly.outputs['CheckOnly.projectDeployReport.successfulJobId'] ]
    jobs:
      - job: "VerifyJob"
        displayName: "Verify"
        steps:
          - checkout: none
          - bash: |
              echo " ~ ~ ~ "
              echo "validatedPackageId: $(validatedPackageId)"
              if [[ "$validatedPackageId" == "" ]]
              then
                echo "##vso[task.logissue type=error]Validated Package Id is blank."
                exit 1
              fi
              echo " ~ ~ ~ "
            displayName: "Verify"
