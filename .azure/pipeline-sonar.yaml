# pipeline-sonar.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: '~'

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "MERGE"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Merge)"

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml
