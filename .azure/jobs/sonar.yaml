# sonar.yaml

parameters:
  isEnabledSonar: true

jobs:
  - job: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
    steps:
      - checkout: self
      - template: ./../../steps/sonar.yaml
        parameters:
          isEnabledSonar: ${{ parameters.isEnabledSonar }}
