# sonar.yaml

parameters:
  isEnabled: true

jobs:
  - job: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        eq(${{ parameters.isEnabled }}, true)
      )
    steps:
      - checkout: self
      - template: ./../../steps/sonar.yaml
        parameters:
          isEnabled: ${{ parameters.isEnabled }}
