# coverage.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  identifiedTests: Undefined
  isEnabledCoverage: true

jobs:
  - deployment: Coverage
    displayName: "Coverage: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledCoverage }}
      )
    environment: "${{ parameters.environmentName }}"
    timeoutInMinutes: 0
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
              fetchTags: false
            - template: ./../../steps/dependencies.yaml
              parameters:
                downloadArtifacts: true
                nodeVersion: '22.x'
                useSalesforceCli: true
            - template: ./../../steps/config.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/authenticate.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/coverage.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                accessToken: "$(sfOrgLoginJwt.accessToken)"
                identifiedTests: "${{ parameters.identifiedTests }}"
                isEnabledCoverage: ${{ parameters.isEnabledCoverage }}
