# tag.yaml

parameters:
  tagCommit: ''
  tagLabel: ''
  fetchDepth: 1
  isDryRun: true
  isEnabledTag: false

jobs:
  - job: Tag
    displayName: "Tag"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTag }}
      )
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: ${{ parameters.fetchDepth }}
        fetchTags: false
        persistCredentials: true
      - template: ./../../steps/tag.yaml
        parameters:
          tagCommit: ${{ parameters.tagCommit }}
          tagLabel: ${{ parameters.tagLabel }}
          isDryRun: ${{ parameters.isDryRun }}
          isEnabledTag: ${{ parameters.isEnabledTag }}
