# blackduck.yaml

parameters:
  isEnabledBlackDuck: true

jobs:
  - job: BlackDuck
    displayName: "Black Duck"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledBlackDuck }}
      )
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ./../../steps/blackduck.yaml
        parameters:
          isEnabledBlackDuck: ${{ parameters.isEnabledBlackDuck }}
