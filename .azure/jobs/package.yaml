# package.yaml

parameters:
  fromCommit: Undefined
  isEnabledTag: false

jobs:
  - job: Package
    displayName: "Package"
    workspace:
      clean: all
    steps:
      - checkout: self
        persistCredentials: true
      - template: ./../../steps/package.yaml
        parameters:
          fromCommit: "$(fromCommit)"
      - template: ./../../steps/tag.yaml
        parameters:
          tagLabel: "$(Build.BuildId)"
          isDryRun: false
          isEnabledTag: ${{ parameters.isEnabledTag }}
      - template: ./../../steps/summary.yaml
        parameters:
          fromCommit: "$(fromCommit)"
