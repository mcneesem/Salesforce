# package.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined
  parentBranchName: Undefined
  isEnabledTests: true
  isEnabledTag: false

jobs:
  - job: Package
    displayName: "Package"
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true
      - template: ./../../steps/dependencies.yaml
        parameters:
          usePython: ${{ parameters.isEnabledTests }}
      - template: ./../../steps/commits.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          fromCommit: "$(fromCommit)"
          parentBranchName: "${{ parameters.parentBranchName }}"
      - template: ./../../steps/delta.yaml
      - template: ./../../steps/package.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          fromCommit: "$(fromCommit)"
      - template: ./../../steps/tests.yaml
        parameters:
          isEnabledTests: ${{ parameters.isEnabledTests }}
      - template: ./../../steps/tag.yaml
        parameters:
          tagLabel: "$(Build.BuildId)"
          isDryRun: false
          isEnabledTag: ${{ parameters.isEnabledTag }}
