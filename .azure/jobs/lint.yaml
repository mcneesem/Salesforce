# lint.yaml

parameters:
  isEnabledLint: true

jobs:
  - job: Lint
    displayName: "Lint"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ./../../steps/dependencies.yaml
        parameters:
          useSldsLinter: true
      - template: ./../../steps/lint.yaml
        parameters:
          isEnabledLint: ${{ parameters.isEnabledLint }}
