# testim.yaml

parameters:
  orgApiName: Undefined
  isEnabledTestim: true

jobs:
  - job: Testim
    displayName: "Testim"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ./../../steps/dependencies.yaml
        parameters:
          nodeVersion: '24.x'
          useTestimCli: true
      - template: ./../../steps/testim.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          isEnabledTestim: ${{ parameters.isEnabledTestim }}
