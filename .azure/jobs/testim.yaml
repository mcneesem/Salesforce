# testim.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  isEnabledTestim: true

jobs:
  - deployment: Testim
    displayName: "Testim: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
    environment: "${{ parameters.environmentName }}"
    timeoutInMinutes: 0
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
              fetchTags: false
            - template: ./../../steps/dependencies.yaml
              parameters:
                nodeVersion: '24.x'
                useTestimCli: true
            - template: ./../../steps/testim.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                isEnabledTestim: ${{ parameters.isEnabledTestim }}
