# quick-deploy.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  validatedPackageId: '~'
  reportTimeout: 30
  isDryRun: true
  fromCommit: Undefined
  isEnabledNotification: true
  isEnabledTag: false

jobs:
  - deployment: QuickDeploy
    displayName: "Quick Deploy: ${{ parameters.orgApiName }}"
    condition: succeeded()
    environment: "${{ parameters.environmentName }}"
    timeoutInMinutes: 0
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
              fetchTags: false
              persistCredentials: true
            - template: ./../../steps/dependencies.yaml
              parameters:
                downloadArtifacts: false
                useSfdx: true
                usePython: ${{ parameters.isEnabledNotification }}
            - template: ./../../steps/config.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/authenticate.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/quick.yaml
              parameters:
                accessToken: "$(sfOrgLoginJwt.accessToken)"
                validatedPackageId: "${{ parameters.validatedPackageId }}"
                isDryRun: ${{ parameters.isDryRun }}
            - template: ./../../steps/report.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                accessToken: "$(sfOrgLoginJwt.accessToken)"
                projectDeployJobId: "$(projectDeployQuick.projectDeployJobId)"
                reportTimeout: ${{ parameters.reportTimeout }}
                isDryRun: ${{ parameters.isDryRun }}
            - template: ./../../steps/tag.yaml
              parameters:
                tagLabel: "$(Build.BuildId)-${{ parameters.orgApiName }}-Deploy-$(projectDeployQuick.projectDeployJobId)"
                isDryRun: ${{ parameters.isDryRun }}
                isEnabledTag: ${{ parameters.isEnabledTag }}
            - template: ./../../steps/summary.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                fromCommit: "${{ parameters.fromCommit }}"
                projectDeployJobId: "$(projectDeployQuick.projectDeployJobId)"
                validatedPackageId: "${{ parameters.validatedPackageId }}"
                isDryRun: ${{ parameters.isDryRun }}
                isEnabledNotification: ${{ parameters.isEnabledNotification }}
