# check-only.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  validateTests: '~'
  identifiedTests: Undefined
  reportTimeout: 30
  isDryRun: false
  fromCommit: Undefined
  isTimeoutAnError: false
  isEnabledNotification: true
  isEnabledTag: false

jobs:
  - deployment: CheckOnly
    displayName: "Check Only: ${{ parameters.orgApiName }}"
    environment: "${{ parameters.environmentName }}"
    timeoutInMinutes: 0
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
              fetchTags: false
              persistCredentials: true
            - template: ./../../steps/dependencies.yaml
              parameters:
                downloadArtifacts: true
                useSalesforceCli: true
                usePython: ${{ parameters.isEnabledNotification }}
            - template: ./../../steps/config.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/authenticate.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
            - template: ./../../steps/validate.yaml
              parameters:
                accessToken: "$(sfOrgLoginJwt.accessToken)"
                validateTests: "${{ parameters.validateTests }}"
                identifiedTests: "${{ parameters.identifiedTests }}"
            - template: ./../../steps/report.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                accessToken: "$(sfOrgLoginJwt.accessToken)"
                projectDeployJobId: "$(projectDeployValidate.projectDeployJobId)"
                reportTimeout: ${{ parameters.reportTimeout }}
                isDryRun: ${{ parameters.isDryRun }}
                isTimeoutAnError: ${{ parameters.isTimeoutAnError }}
            - template: ./../../steps/tag.yaml
              parameters:
                tagLabel: "$(Build.BuildId)-${{ parameters.orgApiName }}-Validate-$(projectDeployValidate.projectDeployJobId)"
                isDryRun: ${{ parameters.isDryRun }}
                isEnabledTag: ${{ parameters.isEnabledTag }}
            - template: ./../../steps/summary.yaml
              parameters:
                orgApiName: "${{ parameters.orgApiName }}"
                fromCommit: "${{ parameters.fromCommit }}"
                projectDeployJobId: "$(projectDeployValidate.projectDeployJobId)"
                isDryRun: ${{ parameters.isDryRun }}
                isEnabledNotification: ${{ parameters.isEnabledNotification }}
