# pipeline-build-validation.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: $(FromCommit.PullRequests)
  # Config Set
  - name: orgApiName
    value: 'merge'
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: $(Validate.Tests.PullRequests)
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.PullRequests)
  # # Sonar
  # - name: isEnabledSonar
  #   value: false

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      fromCommit: "$(fromCommit)"

  #
  # Check Only
  #

  # - template: ./stages/check-only.yaml
  #   parameters:
  #     orgApiName: "${{ upper(variables.orgApiName) }}"
  #     dependsOnStage: "Package"
  #     validateTests: "$(validateTests)"
  #     reportTimeout: $(reportTimeout)
  #     fromCommit: "$(fromCommit)"
  #     isTimeoutAnError: true
  #     isEnabledNotification: false

  #
  # Sonar
  #

  # - template: ./stages/sonar.yaml
  #   parameters:
  #     isEnabled: ${{ variables.isEnabledSonar }}
