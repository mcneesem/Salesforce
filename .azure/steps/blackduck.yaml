# blackduck.yaml

parameters:
  isEnabledBlackDuck: true

steps:

  - bash: |
      # phase must be one of ARCHIVED,DEPRECATED,DEVELOPMENT,PLANNING,PRERELEASE,RELEASED
      phase="DEVELOPMENT"
      if [[ "$(Build.SourceBranchName)" == "main" ]]
      then
        phase="PRERELEASE"
      fi
      if [[ "$(Build.SourceBranchName)" == "production" ]]
      then
        phase="RELEASED"
      fi
      echo "##vso[task.setvariable variable=versionPhase;isOuput=true]$phase"
      echo "##vso[task.setvariable variable=solutionName;isOuput=true]Salesforce"
    displayName: "Prepare"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledBlackDuck }}
      )

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.Repository.Name: $(Build.Repository.Name)"
      echo "Build.SourceBranchName: $(Build.SourceBranchName)"
      echo "solutionName: $(solutionName)"
      echo "versionPhase: $(versionPhase)"
      echo "BlackDuck_URL: $(BlackDuck_URL)"
      echo "BlackDuck_API: $(BlackDuck_API)"
      echo " ~ ~ ~ "
    displayName: "Verify"

  - task: blackduck.blackduck-security-scan.BlackDuckSecurityScan.BlackDuckSecurityScan@2
    displayName: "Scan"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledBlackDuck }}
      )
    inputs:
      scanType: blackducksca
      blackduckScaUrl: '$(BlackDuck_URL)'
      blackduckScaToken: '$(BlackDuck_API)'
      blackduckScaWaitForScan: false
      blackduckScaScanFull: true
      detectArgs: |
        --detect.project.name=Repo:$(Build.Repository.Name)/Sln:$(solutionName)
        --detect.project.version.name=$(Build.SourceBranchName)
        --detect.project.version.phase=$(versionPhase)
        --detect.project.version.update=true
