# authenticate.yaml

parameters:
  orgApiName: Undefined

steps:

  #
  # Secure Files
  #

  - task: DownloadSecureFile@1
    name: keyFile
    displayName: "Download Key File"
    inputs:
      ${{ if eq( lower( parameters.orgApiName ) , 'prod' ) }}:
        secureFile: '$(KeyFilename.Prod)'
      ${{ else }}:
        secureFile: '$(KeyFilename.PreProd)'

  #
  # Authenticate
  #

  - bash: |
      alias=${{ lower( parameters.orgApiName ) }}
      suffix=".$alias"
      domain="insperity--$alias.sandbox"
      clientId=""
      case "$alias" in
        "proxy")
          clientId="$(Key.Proxy)"
          ;;
        "merge")
          clientId="$(Key.Merge)"
          ;;
        "test")
          clientId="$(Key.Test)"
          ;;
        "stage")
          clientId="$(Key.Stage)"
          ;;
        "prod")
          clientId="$(Key.Prod)"
          suffix=""
          domain="insperity"
          ;;
        *)
          echo "##vso[task.logissue type=error]Invalid Org."
          exit 1
          ;;
      esac
      username="deployment.manager@insperity.com$suffix"
      configInstanceUrl="https://$domain.my.salesforce.com"
      echo "Alias: $alias"
      echo "Suffix: $suffix"
      echo "Username: $username"
      echo "Instance Url: $configInstanceUrl"
      # after salesforce/cli@2.132.x ~ use generic unix keychain to store access tokens...
      echo "Use Generic Unix Keychain: true"
      export SF_USE_GENERIC_UNIX_KEYCHAIN=true
      echo "~ ~ ~"
      orgLoginJwtJson=$(sf org login jwt --jwt-key-file $(keyFile.secureFilePath) --client-id $clientId --username $username --instance-url $configInstanceUrl --alias $alias --json)
      orgLoginJwtStatus=$(echo $orgLoginJwtJson | jq -r '.status')
      echo "Status (Login): $orgLoginJwtStatus"
      if [[ "$orgLoginJwtStatus" != "0" ]]
      then
        echo $orgLoginJwtJson | jq .
        echo "##vso[task.logissue type=error]Status is non-zero (login)."
        exit 1
      else
        echo $orgLoginJwtJson | jq .
        echo "~ ~ ~"
        # after salesforce/cli@2.132.x ~ 'sf org login jwt' returns [REDACTED] accessTokens... use 'sf org auth show-access-token' to replace previous usage..
        orgAuthJson=$(sf org auth show-access-token --target-org $alias --no-prompt --json)
        orgAuthStatus=$(echo $orgAuthJson | jq -r '.status')
        echo "Status (Auth): $orgAuthStatus"
        if [[ "$orgAuthStatus" != "0" ]]
        then
          echo $orgAuthJson | jq .
          echo "##vso[task.logissue type=error]Status is non-zero (auth)."
          exit 1
        else
          orgAuthResultAccessTokenRaw=$(echo $orgAuthJson | jq -r '.result.accessToken')
          echo "##vso[task.setvariable variable=accessTokenRaw;isOutput=true;isSecret=true]$orgAuthResultAccessTokenRaw"
          orgAuthResultAccessTokenBase64=$(echo $orgAuthJson | jq -r '.result.accessToken' | base64 -w 0)
          echo "##vso[task.setvariable variable=accessToken;isOutput=true;isSecret=true]$orgAuthResultAccessTokenBase64"
          echo $orgAuthJson | jq .
        fi
        echo "~ ~ ~"
        sf org list --all
      fi
    displayName: "SF: Org Login JWT"
    name: sfOrgLoginJwt
    condition: |
      and(
        succeeded(),
        ne('${{ parameters.orgApiName }}', '')
      )
    retryCountOnTaskFailure: 10
