# authenticate.yaml

parameters:
  orgApiName: Undefined

steps:

  #
  # Secure Files
  #

  - task: DownloadSecureFile@1
    name: keyFile
    displayName: "Download Key File"
    inputs:
      ${{ if eq( lower( parameters.orgApiName ) , 'prod' ) }}:
        secureFile: '$(KeyFilename.Prod)'
      ${{ else }}:
        secureFile: '$(KeyFilename.PreProd)'

  #
  # Authenticate
  #

  - bash: |
      alias=${{ lower( parameters.orgApiName ) }}
      suffix=".$alias"
      domain="insperity--$alias.sandbox"
      clientId=""
      case "$alias" in
        "proxy")
          clientId="$(Key.Proxy)"
          ;;
        "merge")
          clientId="$(Key.Merge)"
          ;;
        "test")
          clientId="$(Key.Test)"
          ;;
        "stage")
          clientId="$(Key.Stage)"
          ;;
        "prod")
          clientId="$(Key.Prod)"
          suffix=""
          domain="insperity"
          ;;
        *)
          echo "##vso[task.logissue type=error]Invalid Org."
          exit 1
          ;;
      esac
      username="deployment.manager@insperity.com$suffix"
      configInstanceUrl="https://$domain.my.salesforce.com"
      echo "Alias: $alias"
      echo "Suffix: $suffix"
      echo "Username: $username"
      echo "Instance Url: $configInstanceUrl"
      authGrantJson=$(sf org login jwt --jwt-key-file $(keyFile.secureFilePath) --client-id $clientId --username $username --instance-url $configInstanceUrl --alias $alias --json)
      authGrantStatus=$(echo $authGrantJson | jq -r '.status')
      echo "Status: $authGrantStatus"
      if [[ "$authGrantStatus" != "0" ]]
      then
        echo $authGrantJson | jq .
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        authGrantResultAccessToken=$(echo $authGrantJson | jq -r '.result.accessToken')
        echo "##vso[task.setvariable variable=accessToken;issecret=true;isOutput=true]$authGrantResultAccessToken"
        echo $authGrantJson | jq .
      fi
    displayName: "SF: Org Login JWT"
    name: sfOrgLoginJwt
    condition: |
      and(
        succeeded(),
        ne('${{ parameters.orgApiName }}', '')
      )
    retryCountOnTaskFailure: 10
