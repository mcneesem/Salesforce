# commits.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined
  parentBranchName: Undefined

steps:

  #
  # Branch Created Commit
  #

  - bash: |
      echo " ~ ~ ~ "
      #
      # default to the commit where the merge-* or release-* branch was created...
      #
      # identify the current build branch...
      echo "Build.Reason: $(Build.Reason)"
      branchName=""
      if [[ "$(Build.Reason)" == "PullRequest" ]]
      then
        echo "System.PullRequest.TargetBranchName: $(System.PullRequest.TargetBranchName)"
        branchName="$(System.PullRequest.TargetBranchName)"
      else
        echo "Build.SourceBranchName: $(Build.SourceBranchName)"
        branchName="$(Build.SourceBranchName)"
      fi
      echo "Branch Name: $branchName"
      echo "##vso[task.setvariable variable=branchName]$branchName"
      # verify if parent branch exists...
      parentBranchName="${{ parameters.parentBranchName }}"
      if [[ "$(git ls-remote --heads origin $parentBranchName)" == "" ]]
      then
        echo "##vso[task.logissue type=error]Parent branch not found on remote ($parentBranchName)."
        exit 1
      fi
      echo "Parent Branch Name: $parentBranchName"
      echo "##vso[task.setvariable variable=parentBranchName]$parentBranchName"
      # increase fetch depth for the current branch and the parent branch...
      echo "Fetch Depth: $(FetchDepth)"
      if [[ "$(FetchDepth)" -gt 0 ]]
      then
        git fetch origin $branchName --depth=$(FetchDepth)
        git fetch origin $parentBranchName --depth=$(FetchDepth)
      else
        echo "Fetch Depth: Unshallow"
        git fetch origin $branchName --unshallow
        git fetch origin $parentBranchName --unshallow
      fi
      # determine the branch created commit using the given parent branch...
      branchCreatedCommit=""
      if [[ "$parentBranchName" != "" ]]
      then
        branchCreatedCommit=$(git merge-base origin/$branchName origin/$parentBranchName 2>/dev/null)
      fi
      if [[ "$branchCreatedCommit" == "" ]]
      then
        echo "##vso[task.logissue type=error]Common merge-base not found for branches(origin/$branchName origin/$parentBranchName)."
        exit 1
      fi
      echo "Branch Created Commit: $branchCreatedCommit"
      echo "##vso[task.setvariable variable=branchCreatedCommit]$branchCreatedCommit"
      echo " ~ ~ ~ "
    displayName: "Analyze: Branch Created Commit"

  - bash: |
      du -sh .git/objects/pack/*.pack
    displayName: "Verify Disk Usage"

  #
  # Last Deployed Commit
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Org API Name: ${{ parameters.orgApiName }}"
      alias="${{ upper( parameters.orgApiName ) }}"
      echo "Alias: $alias"
      echo " ~ ~ ~ "
      # default to the from commit requested by the parameters...
      echo "From Commit: ${{ parameters.fromCommit }}"
      lastDeployedCommit="${{ parameters.fromCommit }}"
      echo "Last Deployed Commit: $lastDeployedCommit"
      if [[ "$lastDeployedCommit" == "~" ]]
      then
        # only calculate the last deployed commit when the from commit variable is a '~'...
        # allow manual overrides via pipeline parameters...
        echo " ~ ~ ~ "
        # find the tag of the last successful deployment to the current org...
        lastDeployedTag=$(git tag -l --sort=-creatordate | grep "$alias" | grep "Deploy" | head -n 1)
        echo "Last Deployed Tag: $lastDeployedTag"
        if [[ "$lastDeployedTag" == "" ]]
        then
          # use brach created commit when no previous deployment tag found...
          echo "##vso[task.logissue type=warning]No tag found for '$alias-Deploy'."
          echo "##vso[task.logissue type=warning]Using branch created commit as last deployed commit ($(branchCreatedCommit))."
          lastDeployedCommit=$(branchCreatedCommit)
        else
          # translate the tag to the ref the commit...
          lastDeployedRef=$(git show-ref $lastDeployedTag)
          echo "Last Deployed Ref: $lastDeployedRef"
          lastDeployedCommit="${lastDeployedRef%% *}"
        fi
        echo "Last Deployed Commit: $lastDeployedCommit"
        echo " ~ ~ ~ "
        # prevent last deployed commit from being older than branch created commit...
        if ! git merge-base --is-ancestor $(branchCreatedCommit) $lastDeployedCommit >/dev/null 2>&1
        then
          # use brach created commit when last deploy commit crosses a branch creation boundary...
          echo "##vso[task.logissue type=warning]Last deployed tag ($lastDeployedTag) is older than branch creation."
          echo "##vso[task.logissue type=warning]Using branch created commit as last deployed commit ($(branchCreatedCommit))."
          lastDeployedCommit=$(branchCreatedCommit)
        fi
        echo "Last Deployed Commit: $lastDeployedCommit"
        echo " ~ ~ ~ "
        # validate the last deployed commit variable is a valid commit in the current build branch...
        if ! git merge-base --is-ancestor $lastDeployedCommit origin/$(branchName) >/dev/null 2>&1
        then
          echo "##vso[task.logissue type=error]LastDeployedCommit ($lastDeployedCommit) not found in branch (origin/$(branchName))."
          exit 1
        fi
      fi
      # final validation...
      if [[ "$lastDeployedCommit" == "" || "$lastDeployedCommit" == "~" ]]
      then
        echo "##vso[task.logissue type=error]Invalid build commit ($lastDeployedCommit)."
        exit 1
      fi
      # validated last deployed commit variable...
      echo "##vso[task.setvariable variable=lastDeployedCommit;isOutput=true]$lastDeployedCommit"
      echo " ~ ~ ~ "
    displayName: "Analyze: Last Deployed Commit"
    name: lastDeployedCommit

  #
  # Verify Commit Variables
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Parent Branch Name: $(parentBranchName)"
      echo "Branch Name: $(branchName)"
      echo "Branch Created Commit: $(branchCreatedCommit)"
      echo "Last Deployed Commit: $(lastDeployedCommit.lastDeployedCommit)"
      echo " ~ ~ ~ "
    displayName: "Analyze: Verify Commit Variables"
