# sonar.yaml

parameters:
  isEnabledSonar: true

steps:

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  - task: sonarsource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@7
    displayName: 'Prepare Analysis On SonarQube'
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
    inputs:
      SonarQube: 'Insperity Enterprise'
      scannerMode: CLI
      configMode: manual
      cliProjectKey: '$(Build.Repository.Name)'
      cliProjectName: '$(Build.Repository.Name)'
      extraProperties: |
        # Additional properties that will be passed to the scanner, 
        # Put one key=value per line, example:
        # sonar.exclusions=**/*.bin
        sonar.language=apex
        sonar.exclusions=**/*Test.cls,**/*Tests.cls,**/Tests*.cls,**/NSP_Test*.cls,**/*Mock.cls,**/*HttpMock*.cls,**/*.test.js,**/documents/**,**/staticresources/**,**/lwc/**/portalPayPeriodCarousel.html
        sonar.coverage.exclusions=**/aura/**,**/lwc/**
        sonar.cpd.exclusions=**/lwc/**/constants.js,**/lwc/**/dynamicFieldsConfig.js,**/lwc/**/fields.js,**/lwc/**/nsp_generalFso.html,**/lwc/**/**Membership.js
        sonar.apex.coverage.reportPath=./sonar/test-result-codecoverage.json
        sonar.javascript.lcov.reportPaths=./coverage/lcov.info
        sonar.log.level=DEBUG

  - task: sonarsource.sonarqube.6D01813A-9589-4B15-8491-8164AEB38055.SonarQubeAnalyze@7
    displayName: 'Run Code Analysis'
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )

  - task: sonarsource.sonarqube.291ed61f-1ee4-45d3-b1b0-bf822d9095ef.SonarQubePublish@7
    displayName: 'Publish Quality Gate Result'
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
