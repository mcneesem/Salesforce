# testim.yaml

parameters:
  orgApiName: Undefined
  isEnabledTestim: false

steps:

  - bash: |
      # verify required testim inputs...
      if [[ "$(Testim.Token)" == "" ]]
      then
        echo "##vso[task.logissue type=error]Testim.Token is blank."
        exit 1
      fi
      if [[ "$(Testim.Project)" == "" ]]
      then
        echo "##vso[task.logissue type=error]Testim.Project is blank."
        exit 1
      fi
      # determine testim branch/suite/domain/parallel...
      branch=""
      suite=""
      alias=${{ lower( parameters.orgApiName ) }}
      domain="insperity--$alias.sandbox"
      parallel="$(Testim.Parallel.PreProd)"
      case "$alias" in
        "merge")
          branch="Merge"
          suite="$(Testim.Suite.Merge)"
          ;;
        "test")
          branch="Test"
          suite="$(Testim.Suite.Test)"
          ;;
        "stage")
          branch="stage"
          suite="$(Testim.Suite.Stage)"
          ;;
        "prod")
          branch="prod"
          suite="$(Testim.Suite.Prod)"
          domain="insperity"
          parallel="$(Testim.Parallel.Prod)"
          ;;
        *)
          echo "##vso[task.logissue type=error]Invalid Org."
          exit 1
          ;;
      esac
      baseUrl="https://$domain.my.salesforce.com"
      if [[ "$suite" == "" ]]
      then
        echo "##vso[task.logissue type=error]Suite is blank."
        exit 1
      fi
      if [[ "$parallel" == "" ]]
      then
        echo "##vso[task.logissue type=error]Parallel is blank."
        exit 1
      fi
      # determine testim timeout...
      timeout="90000"
      if [[ "$(Testim.Timeout)" != "" ]]
      then
        timeout="$(Testim.Timeout)"
      fi
      # execute testim command...
      echo "Token: $(Testim.Token)"
      echo "Project: $(Testim.Project)"
      echo "Branch: $branch"
      echo "Suite: $suite"
      echo "Base URL: $baseUrl"
      echo "Parallel: $parallel"
      echo "Timeout: $timeout"
      testim --token "$(Testim.Token)" --project "$(Testim.Project)" --branch "$branch" --suite "$suite" --base-url "$baseUrl" --parallel $parallel --timeout $timeout --disable-timeout-retry --grid "Testim-Grid" --report-file testim-tests-report.xml
    displayName: "Run Testim Tests"
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/testim-tests-report.xml'
    displayName: "Publish Testim Results"
    condition: ${{ parameters.isEnabledTestim }}
