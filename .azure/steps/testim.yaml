# testim.yaml

parameters:
  isEnabledTestim: false

steps:

  - bash: |
      testim --token "$(Testim.Token)" --project "yTBI2f1PyZXNnHh9C0WH" --branch "Merge" --label "Finance" --grid "Testim-Grid" --report-file testim-tests-report.xml
    displayName: "Run Testim Tests"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/testim-tests-report.xml'
    displayName: "Publish Testim Results"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
