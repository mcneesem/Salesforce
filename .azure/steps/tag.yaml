# tag.yaml

parameters:
  tagCommit: ''
  tagLabel: ''
  isDryRun: true
  isEnabledTag: false

steps:

  #
  # Tag
  # ~ requires `persistCredentials: true` at the job template level to defeat the following error for `git push origin --tags`
  # ~ fatal: could not read Username for 'https://azd.insperity.com': terminal prompts disabled
  #

  # need a simple pipeline to apply tags when quick-deploy fails in ADO but succeeds in SF...
  - bash: |
      echo "Tag Commit: ${{ parameters.tagCommit }}"
      echo "Tag Label: ${{ parameters.tagLabel }}"
      if [[ "${{ parameters.tagLabel }}" != "" && "${{ parameters.tagLabel }}" != "~" ]]
      then
        if [[ "${{ parameters.tagCommit }}" != "" && "${{ parameters.tagCommit }}" != "~" ]]
        then
          git tag ${{ parameters.tagLabel }} ${{ parameters.tagCommit }}
        else
          git tag ${{ parameters.tagLabel }}
        fi
        gitTagResult=$?
        if [ $gitTagResult -ne 0 ]
        then
          echo $gitTagResult
          echo "##vso[task.logissue type=error]Git tag result is non-zero."
          exit 1
        fi
        git push origin --tags
      fi
    displayName: "Git Tag"
    condition: |
      and(
        succeeded(),
        not(${{ parameters.isDryRun }}),
        ${{ parameters.isEnabledTag }}
      )
