# tests.yaml

parameters:
  isEnabledTests: false

steps:

  #
  # Scan Apex Tests
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
      argVerbose=""
      if [[ "$(IdentifyTests.Verbose)" == "true" ]]
      then
        argVerbose="--verbose"
      fi
      identifiedTests=$(uv run python ./.azure/scripts/get-specified-tests.py --artifacts "$(Build.ArtifactStagingDirectory)" $argVerbose)
      echo "Identified Tests: $identifiedTests"
      echo "##vso[task.setvariable variable=identifiedTests;isOutput=true]$identifiedTests"
      echo " ~ ~ ~ "
      echo "IdentifyTests.Verbose: $(IdentifyTests.Verbose)"
      echo " ~ ~ ~ "
    displayName: "Scan Apex Tests"
    name: scanApexTests
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTests }}
      )
