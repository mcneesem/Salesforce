# tests.yaml

parameters:
  isEnabledTests: false

steps:

  #
  # Scan Apex Tests
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      find $(Build.ArtifactStagingDirectory)/force-app -type f | wc -l
      echo " ~ ~ ~ "
      argVerbose=""
      if [[ "$(IdentifyTests.Verbose)" == "true" ]]
      then
        # enable verbose mode...
        argVerbose="--verbose"
      fi
      identifiedTests=$(uv run python ./.azure/scripts/identify-tests.py --artifacts "$(Build.ArtifactStagingDirectory)" $argVerbose)
      echo "$identifiedTests"
      if [[ "$(IdentifyTests.Verbose)" == "true" ]]
      then
        # clear the response from python while in verbose mode...
        identifiedTests=""
      fi
      echo " ~ ~ ~ "
      echo "IdentifyTests.Verbose: $(IdentifyTests.Verbose)"
      echo "Identified Tests: $identifiedTests"
      echo "##vso[task.setvariable variable=identifiedTests;isOutput=true]$identifiedTests"
      echo " ~ ~ ~ "
    displayName: "Scan Apex Tests"
    name: scanApexTests
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTests }}
      )

  - bash: |
      echo " ~ ~ ~ "
      du -sh .git/objects/pack/*.pack
      echo " ~ ~ ~ "
      find . -type f -printf "%s\t%p\n" | sort -n -r | head -n 20
      echo " ~ ~ ~ "
    displayName: "Prepare: Verify Disk Usage"
