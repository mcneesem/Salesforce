# delta.yaml

parameters:
  fromCommit: 'HEAD'
  toCommit: 'HEAD'

steps:

  #
  # Delta
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
      argVerbose=""
      if [[ "$(GitDelta.Verbose)" == "true" ]]
      then
        # enable verbose mode...
        argVerbose="--verbose"
      fi
      gitDelta=$(uv run python ./.azure/scripts/git-delta.py \
        --start $(lastDeployedCommit.lastDeployedCommit) \
        --end HEAD \
        --output "$(Build.BinariesDirectory)" \
        $argVerbose)
      echo "$gitDelta"
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree $(Build.BinariesDirectory)
      find $(Build.BinariesDirectory)/force-app -type f | wc -l
      echo " ~ ~ ~ "
    displayName: "Analyze: Delta (Beta)"
    condition: |
      and(
        succeeded(),
        eq(variables['GitDelta.IsEnabled'], 'true')
      )
