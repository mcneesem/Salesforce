# delta.yaml

parameters:
  fromCommit: 'HEAD'
  toCommit: 'HEAD'

steps:

  #
  # Delta
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
      git --no-pager diff --name-status --no-renames $(lastDeployedCommit.lastDeployedCommit) HEAD $(System.DefaultWorkingDirectory) >> git-diff.txt
      git ls-files >> git-ls-files.txt
      echo " ~ ~ ~ "
      argVerbose=""
      if [[ "$(GitDelta.Verbose)" == "true" ]]
      then
        # enable verbose mode...
        argVerbose="--verbose"
      fi
      gitDelta=$(uv run python ./.azure/scripts/git-delta.py --diff "git-diff.txt" --files "git-ls-files.txt" --output "$(Build.BinariesDirectory)" $argVerbose)
      echo "$gitDelta"
      echo " ~ ~ ~ "
      rm git-diff.txt
      rm git-ls-files.txt
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
    displayName: "Analyze: Delta"
    condition: |
      and(
        succeeded(),
        eq(variables['GitDelta.IsEnabled'], 'true')
      )
