# delta.yaml

parameters:
  fromCommit: 'HEAD'
  toCommit: 'HEAD'

steps:

  #
  # Initialize
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree -a $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  #
  # Ouput Paths
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "GitDelta.Solution: $(GitDelta.Solution)"
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      echo " ~ ~ ~ "
      outputDirectoryPMCC="$(Build.BinariesDirectory)"
      outputDirectoryDevOps="$(Build.ArtifactStagingDirectory)"
      if [[ "$(GitDelta.Solution)" == "PMCC" ]]
      then
        outputDirectoryPMCC="$(Build.ArtifactStagingDirectory)"
        outputDirectoryDevOps="$(Build.BinariesDirectory)"
      fi
      echo " ~ ~ ~ "
      echo "outputDirectoryPMCC: $outputDirectoryPMCC"
      echo "outputDirectoryDevOps: $outputDirectoryDevOps"
      echo "##vso[task.setvariable variable=outputDirectoryPMCC]$outputDirectoryPMCC"
      echo "##vso[task.setvariable variable=outputDirectoryDevOps]$outputDirectoryDevOps"
      echo " ~ ~ ~ "
    displayName: "Prepare: Output Paths"

  #
  # Delta (PMCC)
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      echo " ~ ~ ~ "
      outputDirectory="$(outputDirectoryPMCC)"
      echo "outputDirectory: $outputDirectory"
      tree $outputDirectory
      echo " ~ ~ ~ "
      argVerbose=""
      if [[ "$(GitDelta.Verbose)" == "true" ]]
      then
        # enable verbose mode...
        argVerbose="--verbose"
      fi
      gitDelta=$(uv run python ./.azure/scripts/git-delta.py \
        --start $(lastDeployedCommit.lastDeployedCommit) \
        --end HEAD \
        --output "$outputDirectory" \
        $argVerbose)
      echo "$gitDelta"
      echo " ~ ~ ~ "
      echo "outputDirectory: $outputDirectory"
      tree $outputDirectory
      find $outputDirectory/force-app -type f | wc -l
      echo " ~ ~ ~ "
    displayName: "Build: Delta (PMCC)"
    condition: |
      and(
        succeeded(),
        eq(variables['GitDelta.IsEnabled'], 'true')
      )

  - bash: |
      echo "##vso[task.logissue type=warning]$(gitDeltaPythonErrors)"
      if [[ "$(gitDeltaPythonErrors)" != "" ]]
      then
        echo "See 'Build: Delta (PMCC)' step for more information."
      fi
    displayName: "Build: Delta (Verify)"
    condition: ne(variables['gitDeltaPythonErrors'], '')

  #
  # Delta (DevOps)
  #

  - task: Insperity.insperity-salesforce-tasks.f4e8a63c-b19b-48f6-991f-722ac81e0455.InsperitySalesForceGitDelta@2
    displayName: "Build: Delta (DevOps)"
    condition: succeeded()
    inputs:
      fromCommit: "$(lastDeployedCommit.lastDeployedCommit)"
      toCommit: "HEAD"
      outputDir: "$(outputDirectoryDevOps)"
      include: "$(System.DefaultWorkingDirectory)/sfdx-project.json"
      apiVersion: 63
