# summary.yaml

parameters:
  fromCommit: Undefined
  orgApiName: Undefined
  projectDeployJobId: Undefined
  validatedPackageId: '~'
  isDryRun: true
  isEnabledNotification: false

steps:

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.SourceBranchName: $(Build.SourceBranchName)"
      echo "parameters.fromCommit: ${{ parameters.fromCommit }}"
      echo "Build.SourceVersion: $(Build.SourceVersion)"
      echo "Build.BuildId: $(Build.BuildId)"
      echo "Org API Name: ${{ parameters.orgApiName }}"
      alias="${{ upper( parameters.orgApiName ) }}"
      echo "Alias: $alias"
      operation="Deployment"
      echo "Is Check Only: $(isCheckOnly)"
      if [[ "$(isCheckOnly)" == "true" ]]
      then
        operation="Validation"
      fi
      echo "Operation: $operation"
      echo "Job Id: ${{ parameters.projectDeployJobId }}"
      echo "Artifacts: $(numberArtifacts)"
      echo "Validated Package Id: ${{ parameters.validatedPackageId }}"
      echo " ~ ~ ~ "
      # for any Org, releaseVersion.jsp returns the current Salesforce ReleaseName...
      # i.e. "ReleaseName=260.10.11" translates to "Spring '26 Patch 10.11"
      domain="insperity--$alias.sandbox"
      if [[ "$alias" == "PROD" ]]
      then
        domain="insperity"
      fi
      releaseVersion=$(curl --silent https://$domain.my.salesforce.com/releaseVersion.jsp)
      # extract the XXX.YY.ZZ version from the curl output...
      releaseName=""
      if [[ "$releaseVersion" != "" ]]
      then
        # convert multiline output to array...
        readarray -t releaseVersionArray <<< "$releaseVersion"
        for element in "${releaseVersionArray[@]}"; do
          if [[ "$element" == "ReleaseName"* ]]
          then
            # throw away ReleaseName= portion...
            # keep XXX.YY.ZZ portion...
            releaseName="${element#*=}"
          fi
        done
      fi
      echo "Release Name: $releaseName"
      # split XXX.YY.ZZ version into XXX major version and YY.ZZ minor version...
      releaseNameMajor=""
      releaseNameMinor=""
      if [[ "$releaseVersion" != "" && "$releaseVersion" == *"."* ]]
      then
        releaseNameMajor=${releaseName%%.*}
        releaseNameMinor=${releaseName#*.}
      fi
      echo "Release Name Major: $releaseNameMajor"
      echo "Release Name Minor: $releaseNameMinor"
      # convert XXX major version into season and year format...
      # i.e. "260" translates to "Spring '26"
      releaseNameSeason=""
      releaseNameYear=""
      if [[ "$releaseNameMajor" != "" ]]
      then
        # $(( 260 / 2 )) % 3 = 1
        # ~ Spring
        case "$(( $(( releaseNameMajor / 2 )) % 3 ))" in
          "0")
            releaseNameSeason="Winter"
            ;;
          "1")
            releaseNameSeason="Spring"
            ;;
          "2")
            releaseNameSeason="Summer"
            ;;
        esac
        # $(( 260 / 2 / 3 )) - 17 = 26
        # ~ '26
        releaseNameYear=$(( $(( releaseNameMajor / 2 / 3 )) - 17 ))
      fi
      echo "Release Name Season: $releaseNameSeason"
      echo "Release Name Year: $releaseNameYear"
      # use YY.ZZ minor version as the patch...
      echo "Release Name Patch: $releaseNameMinor"
      echo " ~ ~ ~ "
      prefixToCommit=$(Build.SourceVersion)
      prefixToCommit=${prefixToCommit:0:8}
      prefixFromCommit=${{ parameters.fromCommit }}
      prefixFromCommit=${prefixFromCommit:0:8}
      summaryBranch="GIT Branch: Salesforce/$(Build.SourceBranchName)"
      echo "~ $summaryBranch"
      summaryCommits="GIT Commits: $prefixFromCommit...$prefixToCommit"
      echo "~ $summaryCommits"
      summaryBuild="ADO Build: $(Build.BuildId)"
      echo "~ $summaryBuild"
      summaryValidation=""
      summaryOperation=""
      summaryJob="Package"
      if [[ "$alias" != "Undefined" ]]
      then
        summaryJob="$alias Check Only"
        if [[ "$operation" == "Deployment" ]]
        then
          summaryJob="$alias Quick Deployment"
          if [[ "${{ parameters.validatedPackageId }}" != "~" ]]
          then
            summaryValidation="$alias Validation: ${{ parameters.validatedPackageId }} ($(numberArtifacts) artifacts)"
            echo "~ $summaryValidation"
          fi
        fi
        summaryOperation="$alias $operation: ${{ parameters.projectDeployJobId }} ($(numberArtifacts) artifacts)"
        echo "~ $summaryOperation"
      fi
      instanceName=""
      case "$alias" in
        "MERGE")
          instanceName="$(Instance.Merge)"
          ;;
        "TEST")
          instanceName="$(Instance.Test)"
          ;;
        "STAGE")
          instanceName="$(Instance.Stage)"
          ;;
        "PROD")
          instanceName="$(Instance.Prod)"
          ;;
      esac
      if [[ "$instanceName" == "" ]]
      then
        instanceName="USAXXX"
      fi
      if [[ "$releaseNameSeason" == "" ]]
      then
        releaseNameSeason="XXX"
      fi
      if [[ "$releaseNameYear" == "" ]]
      then
        releaseNameYear="XX"
      fi
      if [[ "$releaseNameMinor" == "" ]]
      then
        releaseNameMinor="XX.XX"
      fi
      summaryInstance="SF Instance: $instanceName: $releaseNameSeason '$releaseNameYear Patch $releaseNameMinor"
      echo "~ $summaryInstance"
      if [[ "$summaryJob" != "Package" ]]
      then
        echo "$summaryJob Successful 🎉"
      fi
      echo " ~ ~ ~ "
      echo "https://status.salesforce.com/instances/$instanceName"
      echo "https://$domain.my.salesforce.com/releaseVersion.jsp"
      echo " ~ ~ ~ "
      if [[ "${{ parameters.isEnabledNotification }}" == "true" ]]
      then
        argVerbose=""
        if [[ "$(SendSummary.Verbose)" == "true" ]]
        then
          # enable verbose mode...
          argVerbose="--verbose"
        fi
        sendSummaryOutput=$(uv run python ./.azure/scripts/send-summary.py \
          --login "$(SparkPost.User)" \
          --password "$(SparkPost.Key)" \
          --sender "$(SparkPost.FromAddress)" \
          --recipient "$(SparkPost.ToAddress)" \
          --job "$summaryJob" \
          --branch "$summaryBranch" \
          --commits "$summaryCommits" \
          --build "$summaryBuild" \
          --validation "$summaryValidation" \
          --operation "$summaryOperation" \
          $argVerbose)
        echo "$sendSummaryOutput"
      fi
    displayName: "Summary"
    condition: |
      and(
        succeeded(),
        not(${{ parameters.isDryRun }}),
        ne('${{ parameters.orgApiName }}', '')
      )
