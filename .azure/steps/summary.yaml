# summary.yaml

parameters:
  fromCommit: Undefined
  orgApiName: Undefined
  projectDeployJobId: Undefined
  validatedPackageId: '~'
  isDryRun: true
  isEnabledNotification: false

steps:

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.SourceBranchName: $(Build.SourceBranchName)"
      echo "parameters.fromCommit: ${{ parameters.fromCommit }}"
      echo "Build.SourceVersion: $(Build.SourceVersion)"
      echo "Build.BuildId: $(Build.BuildId)"
      echo "Org API Name: ${{ parameters.orgApiName }}"
      operation="Deployment"
      echo "Is Check Only: $(isCheckOnly)"
      if [[ "$(isCheckOnly)" == "true" ]]
      then
        operation="Validation"
      fi
      echo "Operation: $operation"
      echo "Job Id: ${{ parameters.projectDeployJobId }}"
      echo "Artifacts: $(numberArtifacts)"
      echo "Validated Package Id: ${{ parameters.validatedPackageId }}"
      echo " ~ ~ ~ "
      prefixToCommit=$(Build.SourceVersion)
      prefixToCommit=${prefixToCommit:0:8}
      prefixFromCommit=${{ parameters.fromCommit }}
      prefixFromCommit=${prefixFromCommit:0:8}
      summaryBranch="GIT Branch: $(Build.SourceBranchName)"
      echo "$summaryBranch"
      summaryCommits="GIT Commits: $prefixFromCommit...$prefixToCommit"
      echo "$summaryCommits"
      summaryBuild="ADO Build: $(Build.BuildId)"
      echo "$summaryBuild"
      summaryValidation=""
      summaryOperation=""
      summaryJob="Package"
      if [[ "${{ parameters.orgApiName }}" != "Undefined" ]]
      then
        summaryJob="${{ parameters.orgApiName }} Check Only"
        if [[ "$operation" == "Deployment" ]]
        then
          summaryJob="${{ parameters.orgApiName }} Quick Deployment"
          if [[ "${{ parameters.validatedPackageId }}" != "~" ]]
          then
            summaryValidation="${{ parameters.orgApiName }} Validation: ${{ parameters.validatedPackageId }} ($(numberArtifacts) artifacts)"
            echo "$summaryValidation"
          fi
        fi
        summaryOperation="${{ parameters.orgApiName }} $operation: ${{ parameters.projectDeployJobId }} ($(numberArtifacts) artifacts)"
        echo "$summaryOperation"
      fi
      echo " ~ ~ ~ "
      if [[ "${{ parameters.isEnabledNotification }}" == "true" ]]
      then
        argVerbose=""
        if [[ "$(SendSummary.Verbose)" == "true" ]]
        then
          # enable verbose mode...
          argVerbose="--verbose"
        fi
        uv run python ./.azure/scripts/send-summary.py \
          "$(SparkPost.User)" \
          "$(SparkPost.Key)" \
          "$(SparkPost.FromAddress)" \
          "$(SparkPost.ToAddress)" \
          "$summaryJob" \
          "$summaryBranch" \
          "$summaryCommits" \
          "$summaryBuild" \
          "$summaryValidation" \
          "$summaryOperation"
      fi
    displayName: "Summary"
    condition: |
      and(
        succeeded(),
        not(${{ parameters.isDryRun }})
      )
