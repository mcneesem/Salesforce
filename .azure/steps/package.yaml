# package.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined

steps:

  #
  # Initialize
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  #
  # Last Deployed Commit
  #

  - bash: |
      printenv
    displayName: "Verify Environment Variables"
  - bash: |
      echo " ~ ~ ~ "
      # default to the commit where the merge-* or release-* branch was created...
      echo "Org API Name: ${{ parameters.orgApiName }}"
      echo "Branch Commit Merge: $(BranchCommit.Merge)"
      echo "Branch Commit Test: $(BranchCommit.Test)"
      alias=${{ lower(parameters.orgApiName) }}
      branchCommit=""
      case "$alias" in
        "merge")
          branchCommit="$(BranchCommit.Merge)"
          ;;
        "test")
          branchCommit="$(BranchCommit.Test)"
          ;;
        *)
          echo "##vso[task.logissue type=warning]Invalid Org."
          exit 1
          ;;
      esac
      echo "Branch Commit: $branchCommit"
      git branch -r --contains $branchCommit | grep "origin/merge-xavier" | xargs
      echo "System.PullRequest.TargetBranchName: $(System.PullRequest.TargetBranchName)"
      echo " ~ ~ ~ "
    displayName: "Branch Created Commit"
  - bash: |
      lastDeployedTag=$(git tag -l --sort=-creatordate | grep "${{ parameters.orgApiName }}" | grep "Deploy" | head -n 1)
      echo "Last Deployed Tag: $lastDeployedTag"
      lastDeployedRef=$(git show-ref $lastDeployedTag)
      echo "Last Deployed Ref: $lastDeployedRef"
      lastDeployedCommit="${lastDeployedRef%% *}"
      echo "Last Deployed Commit: $lastDeployedCommit"
      echo "##vso[task.setvariable variable=lastDeployedCommit]$lastDeployedCommit"
      echo " ~ ~ ~ "
    displayName: "Last Deployed Commit"
  - bash: |
      echo " ~ ~ ~ "
      echo "Last Deployed Commit: $(lastDeployedCommit)"
      echo " ~ ~ ~ "
    displayName: "Last Deployed Commit"

  #
  # Package
  #

  - task: Insperity.insperity-salesforce-tasks.f4e8a63c-b19b-48f6-991f-722ac81e0455.InsperitySalesForceGitDelta@2
    displayName: "Build: Delta Package"
    condition: succeeded()
    inputs:
      fromCommit: "${{ parameters.fromCommit }}"
      toCommit: "HEAD"
      outputDir: "$(Build.ArtifactStagingDirectory)"
      include: "$(System.DefaultWorkingDirectory)/sfdx-project.json"
      apiVersion: 63
  - task: DeleteFiles@1
    displayName: "Build: Delete Excluded Files"
    condition: succeeded()
    inputs:
      SourceFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        .sfdx
        config
        manifest
  - task: CopyFiles@2
    displayName: "Build: Copy Required Files"
    condition: succeeded()
    inputs:
      TargetFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        sfdx-project.json
        .forceignore
  # ##[error]Pipeline Artifact Task is not supported in on-premises. Please use Build Artifact Task instead.
  # - publish: "$(Build.ArtifactStagingDirectory)"
  #   displayName: "Publish Artifacts"
  #   artifact: drop
  #   condition: succeeded()
  - task: PublishBuildArtifacts@1
    displayName: "Build: Publish Artifacts"
    condition: succeeded()
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "Package.$(Build.BuildId)"

  #
  # Verify
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "$(Build.ArtifactStagingDirectory)/package/package.xml"
      cat $(Build.ArtifactStagingDirectory)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"
