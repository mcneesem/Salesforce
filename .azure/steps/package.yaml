# package.yaml

parameters:
  fromCommit: Undefined
  isEnabledGetSpecifiedTests: false

steps:

  #
  # Initialize
  #

  - bash: |
      printenv
    displayName: "Verify Environment Variables"
  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  #
  # Package
  #

  - task: Insperity.insperity-salesforce-tasks.f4e8a63c-b19b-48f6-991f-722ac81e0455.InsperitySalesForceGitDelta@2
    displayName: "Build: Delta Package"
    condition: succeeded()
    inputs:
      fromCommit: '${{ parameters.fromCommit }}'
      toCommit: 'HEAD'
      outputDir: '$(Build.ArtifactStagingDirectory)'
      include: '$(System.DefaultWorkingDirectory)/sfdx-project.json'
      apiVersion: 63
  - task: DeleteFiles@1
    displayName: "Build: Delete Excluded Files"
    condition: succeeded()
    inputs:
      SourceFolder: '$(Build.ArtifactStagingDirectory)'
      Contents: |
        .sfdx
        config
        manifest
  - task: CopyFiles@2
    displayName: "Build: Copy Required Files"
    condition: succeeded()
    inputs:
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      Contents: |
        sfdx-project.json
        .forceignore

  # ##[error]Pipeline Artifact Task is not supported in on-premises. Please use Build Artifact Task instead.
  # - publish: '$(Build.ArtifactStagingDirectory)'
  #   displayName: 'Publish Artifacts'
  #   artifact: drop
  #   condition: succeeded()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Build Artifacts'
    condition: succeeded()
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'Package.$(Build.BuildId)'

  #
  # Verify
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "$(Build.ArtifactStagingDirectory)/package/package.xml"
      cat $(Build.ArtifactStagingDirectory)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  #
  # Calculate Apex Tests
  #

  - bash: |
      if [ -d "$(Build.ArtifactStagingDirectory)/force-app/main/default/classes" ]
      then
        echo " ~ Classes"
        find $(Build.ArtifactStagingDirectory)/force-app/main/default/classes/*.cls -type f -exec sh -c 'head -n 50 "{}"' \; | grep '// test w/ ' | sed 's|^.*/||'
        echo " ~ Test Classes"
        find $(Build.ArtifactStagingDirectory)/force-app/main/default/classes/*Test*.cls -type f -exec sh -c 'echo "{}"' \; | sed 's|^.*/||' | sed 's/\..*//'
      fi
      if [ -d "$(Build.ArtifactStagingDirectory)/force-app/main/default/triggers" ]
      then
        echo " ~ Triggers"
        find $(Build.ArtifactStagingDirectory)/force-app/main/default/triggers/*.trigger -type f -exec sh -c 'head -n 50 "{}"' \; | grep '// test w/ ' | sed 's|^.*/||'
      fi
    displayName: "Calculate Apex Tests"

  # - task: UsePythonVersion@0
  #   displayName: "Prepare: Use Python"
  #   inputs:
  #     versionSpec: 3.11
  #     disableDownloadFromRegistry: true
  #   condition: |
  #     and(
  #       succeeded(),
  #       eq(${{ parameters.isEnabledGetSpecifiedTests }}, true)
  #     )
  # - script: |
  #     python -m pip install --upgrade pip
  #     python -m pip install uv
  #   displayName: "Prepare: Install Python UV"
  #   condition: |
  #     and(
  #       succeeded(),
  #       eq(${{ parameters.isEnabledGetSpecifiedTests }}, true)
  #     )
  # - script: |
  #     uv sync
  #   displayName: "Prepare: Python Project"
  #   condition: |
  #     and(
  #       succeeded(),
  #       eq(${{ parameters.isEnabledGetSpecifiedTests }}, true)
  #     )

  - bash: |
      # echo " ~ ~ ~ "
      # uv run python ./.azure/scripts/get-specified-tests.py "$(Build.ArtifactStagingDirectory)"
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
      specifiedTests=$(uv run python ./.azure/scripts/get-specified-tests.py true "$(Build.ArtifactStagingDirectory)" 2>/dev/null)
      echo "Specified Tests: $specifiedTests"
      echo " ~ ~ ~ "
    displayName: "Get Specified Tests"
    condition: |
      and(
        succeeded(),
        eq(${{ parameters.isEnabledGetSpecifiedTests }}, true)
      )
