# package.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined

steps:

  #
  # Package
  #

  - task: DeleteFiles@1
    displayName: "Build: Delete Excluded Files"
    condition: |
      and(
        succeeded(),
        eq(variables['GitDelta.Solution'], 'DevOps')
      )
    inputs:
      SourceFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        .sfdx
        config
        manifest
  - task: CopyFiles@2
    displayName: "Build: Copy Required Files"
    condition: succeeded()
    inputs:
      TargetFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        sfdx-project.json
        .forceignore
  - task: PublishBuildArtifacts@1
    displayName: "Build: Publish Artifacts"
    condition: succeeded()
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "Package.$(Build.BuildId)"

  #
  # Verify
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "GitDelta.Solution: $(GitDelta.Solution)"
      echo "GitDelta.IsEnabled: $(GitDelta.IsEnabled)"
      echo "GitDelta.Verbose: $(GitDelta.Verbose)"
      echo " ~ ~ ~ "
      echo "System.BinariesDirectory: $(System.BinariesDirectory)"
      tree -a $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
      echo "$(Build.ArtifactStagingDirectory)/package/package.xml"
      cat $(Build.ArtifactStagingDirectory)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      diff -r $(Build.BinariesDirectory)/force-app/main/default $(Build.ArtifactStagingDirectory)/force-app/main/default
      echo " ~ ~ ~ "
      diff -qr $(Build.BinariesDirectory)/force-app/main/default $(Build.ArtifactStagingDirectory)/force-app/main/default
      echo " ~ ~ ~ "
    displayName: "Analyze: Package Artifacts"
