# package.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined

steps:

  #
  # Package
  #

  - task: DeleteFiles@1
    displayName: "Build: Delete Excluded Files"
    condition: |
      and(
        succeeded(),
        eq(variables['GitDelta.Solution'], 'DevOps')
      )
    inputs:
      SourceFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        .sfdx
        config
        manifest
  - task: CopyFiles@2
    displayName: "Build: Copy Required Files"
    condition: succeeded()
    inputs:
      TargetFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        sfdx-project.json
        .forceignore
  - task: PublishBuildArtifacts@1
    displayName: "Build: Publish Artifacts"
    condition: succeeded()
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "Package.$(Build.BuildId)"

  #
  # Verify
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "GitDelta.Solution: $(GitDelta.Solution)"
      echo "GitDelta.IsEnabled: $(GitDelta.IsEnabled)"
      echo "GitDelta.Verbose: $(GitDelta.Verbose)"
      echo " ~ ~ ~ "
      echo "Build.BinariesDirectory: $(Build.BinariesDirectory)"
      tree -a $(Build.BinariesDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
      diff -r $(Build.BinariesDirectory)/force-app/main/default $(Build.ArtifactStagingDirectory)/force-app/main/default
      echo " ~ ~ ~ "
      diffBrief=$(diff -qr $(Build.BinariesDirectory)/force-app/main/default $(Build.ArtifactStagingDirectory)/force-app/main/default)
      echo "$diffBrief"
      if [[ "$diffBrief" != "" ]]
      then
        lastError=""
        # convert multiline output to array...
        readarray -t diffBriefArray <<< "$diffBrief"
        for element in "${diffBriefArray[@]}"; do
          # throw errors instead of warning for CustomLabel differences...
          if [[ "$element" == *"CustomLabels"* ]]; then
            lastError="$element"
            echo "##vso[task.logissue type=error]$element"
          else
            echo "##vso[task.logissue type=warning]$element"
          fi
        done
        if [[ "$lastError" != "" ]]
        then
          # exit after all differences are logged if there are any errors...
          exit 1
        fi
      fi
      echo " ~ ~ ~ "
    displayName: "Analyze: Package Output"
