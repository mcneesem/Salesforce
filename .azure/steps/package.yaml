# package.yaml

parameters:
  orgApiName: Undefined
  fromCommit: Undefined

steps:

  #
  # Initialize
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"

  #
  # Last Deployed Commit
  #

  - bash: |
      printenv
    displayName: "Verify Environment Variables"
  - bash: |
      echo " ~ ~ ~ "
      # default to the commit where the merge-* or release-* branch was created...
      echo "Org API Name: ${{ parameters.orgApiName }}"
      echo "Branch Commit Merge: $(BranchCommit.Merge)"
      echo "Branch Commit Test: $(BranchCommit.Test)"
      alias=${{ lower(parameters.orgApiName) }}
      branchCommit=""
      case "$alias" in
        "merge")
          branchCommit="$(BranchCommit.Merge)"
          ;;
        "test")
          branchCommit="$(BranchCommit.Test)"
          ;;
        *)
          echo "##vso[task.logissue type=warning]Invalid Org."
          branchCommit="" # ...reset for now...
          # exit 1 # ...warning for now...
          ;;
      esac
      echo "Branch Commit: $branchCommit"
      echo " ~ ~ ~ "
      # identify the current build branch...
      echo "Build.Reason: $(Build.Reason)"
      branchName=""
      if [[ "$(Build.Reason)" == "PullRequest" ]]
      then
        echo "System.PullRequest.TargetBranchName: $(System.PullRequest.TargetBranchName)"
        branchName="$(System.PullRequest.TargetBranchName)"
      else
        echo "Build.SourceBranchName: $(Build.SourceBranchName)"
        branchName="$(Build.SourceBranchName)"
      fi
      echo "branchName: $branchName"
      echo "##vso[task.setvariable variable=branchName]$branchName"
      # validate the branch commit variable is a valid commit in the current build branch...
      gitBranchContains=$(git branch -r --contains $branchCommit | grep "origin/$branchName" | xargs)
      echo "gitBranchContains: $gitBranchContains"
      if [[ "$gitBranchContains" != "origin/$branchName" ]]
      then
        echo "##vso[task.logissue type=warning]BranchCommit ($branchCommit) not found in branch ($branchName)."
        branchCommit="" # ...reset for now...
        # exit 1 # ...warning for now...
      fi
      # validated branch commit variable...
      echo "##vso[task.setvariable variable=branchCommit]$branchCommit"
      echo " ~ ~ ~ "
    displayName: "Branch Created Commit"
  - bash: |
      echo " ~ ~ ~ "
      # default to the from commit requested by the parameters...
      echo "From Commit: ${{ parameters.fromCommit }}"
      lastDeployedCommit="${{ parameters.fromCommit }}"
      echo "Last Deployed Commit: $lastDeployedCommit"
      if [[ "$lastDeployedCommit" == "~" ]]
      then
        # only calculate the last deployed commit when the from commit variable is a '~'...
        # allow manual overrides via variable group...
        echo " ~ ~ ~ "
        # find the tag of the last successful deployment to the current org...
        echo "Org API Name: ${{ parameters.orgApiName }}"
        lastDeployedTag=$(git tag -l --sort=-creatordate | grep "${{ parameters.orgApiName }}" | grep "Deploy" | head -n 1)
        echo "Last Deployed Tag: $lastDeployedTag"
        if [[ "$lastDeployedTag" == "" ]]
        then
          echo "##vso[task.logissue type=warning]No tag found for '${{ parameters.orgApiName }}-Deploy'."
          lastDeployedCommit="" # ...reset for now...
          # exit 1 # ...warning for now...
        else
          # translate the tag to the ref the commit...
          lastDeployedRef=$(git show-ref $lastDeployedTag)
          echo "Last Deployed Ref: $lastDeployedRef"
          lastDeployedCommit="${lastDeployedRef%% *}"
        fi
        echo "Last Deployed Commit: $lastDeployedCommit"
        echo " ~ ~ ~ "
        # validate the last deployed commit variable is a valid commit in the current build branch...
        gitBranchContains=$(git branch -r --contains $lastDeployedCommit | grep "origin/$(branchName)" | xargs)
        echo "gitBranchContains: $gitBranchContains"
        if [[ "$gitBranchContains" != "origin/$(branchName)" ]]
        then
          echo "##vso[task.logissue type=warning]LastDeployedCommit ($lastDeployedCommit) not found in branch ($(branchName))."
          lastDeployedCommit="" # ...reset for now...
          # exit 1 # ...warning for now...
        fi
      fi
      # validated last deployed commit variable...
      echo "##vso[task.setvariable variable=lastDeployedCommit]$lastDeployedCommit"
      echo " ~ ~ ~ "
    displayName: "Last Deployed Commit"
  - bash: |
      echo " ~ ~ ~ "
      echo "Branch Name: $(branchName)"
      echo "Branch Commit: $(branchCommit)"
      echo "Last Deployed Commit: $(lastDeployedCommit)"
      echo " ~ ~ ~ "
    displayName: "Verify Commit Variables"

  #
  # Package
  #

  - task: Insperity.insperity-salesforce-tasks.f4e8a63c-b19b-48f6-991f-722ac81e0455.InsperitySalesForceGitDelta@2
    displayName: "Build: Delta Package"
    condition: succeeded()
    inputs:
      fromCommit: "$(lastDeployedCommit)"
      toCommit: "HEAD"
      outputDir: "$(Build.ArtifactStagingDirectory)"
      include: "$(System.DefaultWorkingDirectory)/sfdx-project.json"
      apiVersion: 63
  - task: DeleteFiles@1
    displayName: "Build: Delete Excluded Files"
    condition: succeeded()
    inputs:
      SourceFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        .sfdx
        config
        manifest
  - task: CopyFiles@2
    displayName: "Build: Copy Required Files"
    condition: succeeded()
    inputs:
      TargetFolder: "$(Build.ArtifactStagingDirectory)"
      Contents: |
        sfdx-project.json
        .forceignore
  # ##[error]Pipeline Artifact Task is not supported in on-premises. Please use Build Artifact Task instead.
  # - publish: "$(Build.ArtifactStagingDirectory)"
  #   displayName: "Publish Artifacts"
  #   artifact: drop
  #   condition: succeeded()
  - task: PublishBuildArtifacts@1
    displayName: "Build: Publish Artifacts"
    condition: succeeded()
    inputs:
      pathToPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "Package.$(Build.BuildId)"

  #
  # Verify
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "$(Build.ArtifactStagingDirectory)/package/package.xml"
      cat $(Build.ArtifactStagingDirectory)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"
