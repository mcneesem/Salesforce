# quick.yaml

parameters:
  accessToken: Undefined
  validatedPackageId: '~'
  isDryRun: true

steps:

  #
  # Quick-Deploy
  #

  # ~ node:events:495
  # ~       throw er; // Unhandled 'error' event
  # ~       ^
  # ~ Error: write EPIPE

  - bash: |
      echo "isDryRun: $(isDryRun)"
      echo "variables.isDryRun: ${{ variables.isDryRun }}"
      echo "parameters.isDryRun: ${{ parameters.isDryRun }}"
      echo " ~ ~ ~ "
      printenv
    displayName: "Verify Environment Variables"
  - bash: |
      echo "Access Token: ${{ parameters.accessToken }}"
      echo "Validated Package Id: ${{ parameters.validatedPackageId }}"
      projectDeployQuickJson=""
      { # try
        projectDeployQuickJson=$(sf project deploy quick --job-id ${{ parameters.validatedPackageId }} --target-org ${{ parameters.accessToken }} --async --verbose --json)
      } || { # catch
        echo $?
        # save log for exception 
        echo " ~ ~ ~ "
        echo "...an unknown exception occurred..."
        echo $projectDeployQuickJson
        echo " ~ ~ ~ "
      }
      echo $projectDeployQuickJson | jq .
      projectDeployQuickStatus=$(echo $projectDeployQuickJson | jq -r '.status')
      echo "Status: $projectDeployQuickStatus"
      if [[ "$projectDeployQuickStatus" != "0" ]]
      then
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        projectDeployQuickResultId=$(echo $projectDeployQuickJson | jq -r '.result.id')
        echo "Result.Id: $projectDeployQuickResultId"
        echo "##vso[task.setvariable variable=projectDeployJobId;isOutput=true]$projectDeployQuickResultId"
      fi
    displayName: "SF: Project Deploy Quick"
    name: projectDeployQuick
    condition: |
      and(
        succeeded(),
        ne(variables.validatedPackageId, '~'),
        eq(${{ parameters.isDryRun }}, false)
      )
