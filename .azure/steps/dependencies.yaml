# dependencies.yaml

parameters:
  nodeVersion: $(NodeVersion)
  useSalesforceCli: false
  useSldsLinter: false
  usePython: false
  useTestimCli: false
  downloadArtifacts: false

steps:

  - bash: |
      du -sh .git/objects/pack/*.pack
    displayName: "Verify Disk Usage"

  #
  # Salesforce
  # ~ required for authenticate, validate, quick, and report steps...
  #

  - task: UseNode@1
    displayName: "Prepare: Use Node"
    inputs:
      version: ${{ parameters.nodeVersion }}
    condition: |
      and(
        succeeded(),
        or(
          ${{ parameters.useSalesforceCli }},
          ${{ parameters.useSldsLinter }} ,
          ${{ parameters.useTestimCli }}
        )
      )
  - bash: |
      npm install @salesforce/cli@2.132.x --global
    displayName: "Prepare: Install Salesforce CLI"
    condition: |
      and(
        succeeded(),
        ${{ parameters.useSalesforceCli }}
      )
  - bash: |
      npm install @salesforce-ux/eslint-plugin-slds --save-dev
    displayName: "Prepare: Install SLDS Linter"
    condition: |
      and(
        succeeded(),
        ${{ parameters.useSldsLinter }}
      )

  #
  # Python
  # ~ required for package, and summary steps...
  #

  - task: UsePythonVersion@0
    displayName: "Prepare: Use Python"
    inputs:
      versionSpec: 3.11
      disableDownloadFromRegistry: true
    condition: |
      and(
        succeeded(),
        ${{ parameters.usePython }}
      )
  - script: |
      python -m pip install --upgrade pip
      python -m pip install uv
    displayName: "Prepare: Install Python UV"
    condition: |
      and(
        succeeded(),
        ${{ parameters.usePython }}
      )
  - script: |
      uv sync
    displayName: "Prepare: Python Project"
    condition: |
      and(
        succeeded(),
        ${{ parameters.usePython }}
      )

  #
  # Testim
  # ~ required for testim steps...
  #

  - bash: |
      npm install @testim/testim-cli --global
    displayName: "Prepare: Install Testim CLI"
    condition: |
      and(
        succeeded(),
        ${{ parameters.useTestimCli }}
      )

  #
  # Artifacts
  # ~ required for validate steps...
  #

  # ##[error]Pipeline Artifact Task is not supported in on-premises. Please use Build Artifact Task instead.
  # - download: current
  #   artifact: drop

  - task: DownloadBuildArtifacts@1
    displayName: "Prepare: Download Build Artifacts"
    condition: |
      and(
        succeeded(),
        ${{ parameters.downloadArtifacts }}
      )
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'Package.$(Build.BuildId)'
      downloadPath: '$(Build.ArtifactStagingDirectory)'
  - bash: |
      rootDir="$(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default"
      if [ ! -d "$rootDir" ]
      then
        mkdir -p $rootDir
      fi
    displayName: "Prepare: Create Required Directories"
    condition: |
      and(
        succeeded(),
        ${{ parameters.downloadArtifacts }}
      )

  #
  # Verify Dependencies
  #

  - bash: |
      if [[ "${{ parameters.useSalesforceCli }}" == "true" ]]
      then
        echo " ~ ~ ~ "
        echo "Verify Node..."
        node --version
        npm ping
        echo "Verify Salesforce CLI..."
        sfdx version --json
        sf version --json
        which jq
        sfdxProjectFile="$(System.DefaultWorkingDirectory)/sfdx-project.json"
        if [ ! -f "$sfdxProjectFile" ]
        then
          sfdxProjectFileLines=( '{}' '' );
          printf '%s\n' "${sfdxProjectFileLines[@]}" >> $sfdxProjectFile
        fi
        tail -n +1 $sfdxProjectFile
      fi
      if [[ "${{ parameters.useSldsLinter }}" == "true" ]]
      then
        echo " ~ ~ ~ "
        echo "Verify Node..."
        node --version
        npm ping
        echo "Verify SLDS Linter..."
        npx @salesforce-ux/slds-linter@latest --version
        eslintConfigMjsFile="$(System.DefaultWorkingDirectory)/eslint.config.mjs"
        if [ -f "$eslintConfigMjsFile" ]
        then
          cat $eslintConfigMjsFile
        fi
      fi
      if [[ "${{ parameters.usePython }}" == "true" ]]
      then
        echo " ~ ~ ~ "
        echo "Verify Python..."
        pyProjectFile="$(System.DefaultWorkingDirectory)/pyproject.toml"
        if [ ! -f "$pyProjectFile" ]
        then
          pyProjectFileLines=( '[project]' 'name = "salesforce"' 'version = "0.1.0"' 'requires-python = ">=3.11,<3.12"' '' );
          printf '%s\n' "${pyProjectFileLines[@]}" >> $pyProjectFile
        fi
        tail -n +1 $pyProjectFile
      fi
      if [[ "${{ parameters.useTestimCli }}" == "true" ]]
      then
        echo " ~ ~ ~ "
        echo "Verify Node..."
        node --version
        npm ping
        echo "Verify Testim CLI..."
        testim --version
      fi
      if [[ "${{ parameters.downloadArtifacts }}" == "true" ]]
      then
        echo " ~ ~ ~ "
        echo "Verify Artifacts..."
        echo " ~ ~ ~ "
        echo "$(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/package/package.xml"
        cat $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/package/package.xml
        echo "" # missing new line at the end of package.xml
        echo " ~ ~ ~ "
        echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
        tree -a $(Build.ArtifactStagingDirectory)
      fi
      echo " ~ ~ ~ "
    displayName: "Prepare: Verify Dependencies"
