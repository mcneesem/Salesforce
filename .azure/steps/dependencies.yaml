# dependencies.yaml

parameters:
  downloadArtifacts: false

steps:
  - task: UseNode@1
    displayName: "Prepare: Use Node"
    inputs:
      version: $(NodeVersion)
  - bash: |
      npm install @salesforce/cli --global
    displayName: "Prepare: Install Salesforce CLI"
    # condition: eq(true, false) # disabled step... npm error 502 Bad Gateway
  - bash: |
      node --version
      npm ping
      sfdx version --json
      sf version --json
      which jq
      pwd
      sfdxProjectFile="$(System.DefaultWorkingDirectory)/sfdx-project.json"
      if [ ! -f "$sfdxProjectFile" ]
      then
        sfdxProjectFileLines=( '{}' '' );
        printf '%s\n' "${sfdxProjectFileLines[@]}" >> $sfdxProjectFile
      fi
      tail -n +1 $sfdxProjectFile
      pyProjectFile="$(System.DefaultWorkingDirectory)/pyproject.toml"
      if [ ! -f "$pyProjectFile" ]
      then
        pyProjectFileLines=( '[project]' 'name = "salesforce"' 'version = "0.1.0"' 'requires-python = ">=3.11,<3.12"' '' );
        printf '%s\n' "${pyProjectFileLines[@]}" >> $pyProjectFile
      fi
      tail -n +1 $pyProjectFile
    displayName: "Verify Dependencies"

  # ##[error]Pipeline Artifact Task is not supported in on-premises. Please use Build Artifact Task instead.
  # - download: current
  #   artifact: drop

  - task: DownloadBuildArtifacts@1
    displayName: "Download Build Artifacts"
    condition: |
      and(
        succeeded(),
        ${{ parameters.downloadArtifacts }}
      )
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'Package.$(Build.BuildId)'
      downloadPath: '$(Build.ArtifactStagingDirectory)'

  - bash: |
      rootDir="$(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default"
      if [ ! -d "$rootDir" ]
      then
        mkdir -p $rootDir
      fi
    displayName: "Create Required Directories"
    condition: |
      and(
        succeeded(),
        ${{ parameters.downloadArtifacts }}
      )

  - bash: |
      echo " ~ ~ ~ "
      echo "System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)"
      tree -a -L $(TreeLevel) $(System.DefaultWorkingDirectory)
      echo " ~ ~ ~ "
      echo "$(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/package/package.xml"
      cat $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "Verify Workspace"
