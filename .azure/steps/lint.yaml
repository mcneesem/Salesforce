# lint.yaml

parameters:
  isEnabledLint: false

steps:

  # Salesforce Developers: SLDS Linter: Commands
  # https://developer.salesforce.com/docs/platform/slds-linter/guide/reference-commands.html

  - bash: |
      eslintConfigMjsFile="$(System.DefaultWorkingDirectory)/eslint.config.mjs"
      if [ -f "$eslintConfigMjsFile" ]
      then
        ls $eslintConfigMjsFile
        cat $eslintConfigMjsFile
        npx @salesforce-ux/slds-linter@latest lint --config-eslint $eslintConfigMjsFile
      else
        echo "Using default eslint config."
        npx @salesforce-ux/slds-linter@latest lint
      fi
    displayName: "SLDS Lint"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )

  - bash: |
      npx @salesforce-ux/slds-linter@latest report --format sarif
      cat ./slds-linter-report.sarif
    displayName: "SLDS Report Sarif"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )

  - bash: |
      npx @salesforce-ux/slds-linter@latest report --format csv
      cat ./slds-linter-report.csv
    displayName: "SLDS Report CSV"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )

  - bash: |
      npx @salesforce-ux/slds-linter@latest emit
      cat ./eslint.config.mjs
    displayName: "SLDS Emit"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )
