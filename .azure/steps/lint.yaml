# lint.yaml

parameters:
  isEnabledLint: false

steps:

  - bash: |
      eslintConfigMjsFile="$(System.DefaultWorkingDirectory)/eslint.config.mjs"
      if [ -f "$eslintConfigMjsFile" ]
      then
        ls $eslintConfigMjsFile
        cat $eslintConfigMjsFile
        npx @salesforce-ux/slds-linter@latest lint --config-eslint $eslintConfigMjsFile
      else
        echo "Using default eslint config."
        npx @salesforce-ux/slds-linter@latest lint
      fi
    displayName: "SLDS Lint"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )
