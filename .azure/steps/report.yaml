# report.yaml

parameters:
  orgApiName: Undefined
  accessToken: Undefined
  projectDeployJobId: Undefined
  reportTimeout: 30
  isDryRun: true
  isTimeoutAnError: false

steps:

  #
  # Report
  #

  # ~ https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html
  # ~ node:events:495
  # ~       throw er; // Unhandled 'error' event
  # ~       ^
  # ~ Error: write EPIPE

  - bash: |
      reportingTime=0
      echo "Start: Timeout (seconds): ${{ parameters.reportTimeout }}"
      echo "Start: Interval (seconds): $(Report.Interval)"
      echo "Start: Reporting Time (seconds): $reportingTime"
      echo "Start: Job Id: ${{ parameters.projectDeployJobId }}"
      projectDeployReportResultCheckOnly=false
      projectDeployReportResultNumberComponentsTotal=0
      projectDeployReportJson=""
      while [ $reportingTime -lt ${{ parameters.reportTimeout }} ]
      do
        echo " ~ ~ ~ "
        { # try
          projectDeployReportJson=$(sf project deploy report --job-id ${{ parameters.projectDeployJobId }} --target-org ${{ parameters.accessToken }} --json 2>&1)
        } || { # catch
          echo $?
          # save log for exception
          echo " ~ ~ ~ "
          echo "...an unknown exception occurred..."
          echo "##vso[task.logissue type=warning]...an unknown exception occurred..."
          echo $projectDeployReportJson
          echo "##vso[task.logissue type=warning]$projectDeployReportJson"
          echo " ~ ~ ~ "
        }
        if echo $projectDeployReportJson | jq -e . >/dev/null 2>&1
        then
          # only proceed to analyze the report when the response was valid JSON (jq -e)...
          # echo $projectDeployReportJson | jq . # too noisy...
          projectDeployReportStatus=$(echo $projectDeployReportJson | jq -r '.status')
          echo "Status: $projectDeployReportStatus"
          if [[ "$projectDeployReportStatus" != "0" ]]
          then
            echo $projectDeployReportJson | jq . # output json on failure...
            projectDeployReportCode=$(echo $projectDeployReportJson | jq -r '.code')
            echo "Code: $projectDeployReportCode"
            # ignore the following status codes...
            # ~ DomainNotFoundError
            # ~ ECONNRESET
            # ~ ECONNREFUSED
            if [[ "$projectDeployReportCode" == "DomainNotFoundError" || "$projectDeployReportCode" == "ECONNRESET" || "$projectDeployReportCode" == "ECONNREFUSED" ]]
            then
              echo "##vso[task.logissue type=warning]Status is non-zero. Code is a warning: $projectDeployReportCode"
            else
              echo "##vso[task.logissue type=error]Status is non-zero."
              exit 1
            fi
          fi
          projectDeployReportResultDone=$(echo $projectDeployReportJson | jq -r '.result.done')
          echo "Result.Done: $projectDeployReportResultDone"
          if [[ "$projectDeployReportResultDone" == "true" ]]
          then
            echo "Result.Done is true."
            echo " ~ ~ ~ "
            projectDeployReportResultSuccess=$(echo $projectDeployReportJson | jq -r '.result.success')
            echo "Result.Success: $projectDeployReportResultSuccess"
            if [[ "$projectDeployReportResultSuccess" == "true" ]]
            then
              echo "Result.Success is true."
              echo "##vso[task.setvariable variable=successfulJobId;isOutput=true]${{ parameters.projectDeployJobId }}"
              break
            else
              echo $projectDeployReportJson | jq . # output json on failure...
              echo " ~ ~ ~ "
              projectDeployReportResultStatus=$(echo $projectDeployReportJson | jq -r '.result.status')
              echo "Result.Status: $projectDeployReportResultStatus"
              echo "##vso[task.logissue type=warning]Result.Status: $projectDeployReportResultStatus"
              echo " ~ ~ ~ "
              projectDeployReportResultNumberComponentErrors=$(echo $projectDeployReportJson | jq -r '.result.numberComponentErrors')
              echo "Result.NumberComponentErrors: $projectDeployReportResultNumberComponentErrors"
              projectDeployReportResultNumberTestErrors=$(echo $projectDeployReportJson | jq -r '.result.numberTestErrors')
              echo "Result.NumberTestErrors: $projectDeployReportResultNumberTestErrors"
              echo " ~ ~ ~ "
              projectDeployReportResultDetailsComponentFailures=$(echo $projectDeployReportJson | jq -r '.result.details.componentFailures')
              echo "Result.Details.ComponentFailures: $projectDeployReportResultDetailsComponentFailures"
              echo " ~ ~ ~ "
              projectDeployReportResultDetailsRunTestResultNumFailures=$(echo $projectDeployReportJson | jq -r '.result.details.runTestResult.numFailures')
              echo "Result.Details.RunTestResult.NumFailures: $projectDeployReportResultDetailsRunTestResultNumFailures"
              projectDeployReportResultDetailsRunTestResultNumTestsRun=$(echo $projectDeployReportJson | jq -r '.result.details.runTestResult.numTestsRun')
              echo "Result.Details.RunTestResult.NumTestsRun: $projectDeployReportResultDetailsRunTestResultNumTestsRun"
              projectDeployReportResultDetailsRunTestResultFailures=$(echo $projectDeployReportJson | jq -r '.result.details.runTestResult.failures')
              echo "Result.Details.RunTestResult.Failures: $projectDeployReportResultDetailsRunTestResultFailures"
              echo " ~ ~ ~ "
              projectDeployReportResultDetailsRunTestResultCodeCoverageWarnings=$(echo $projectDeployReportJson | jq -r '.result.details.runTestResult.codeCoverageWarnings')
              echo "Result.Details.RunTestResult.CodeCoverageWarnings: $projectDeployReportResultDetailsRunTestResultCodeCoverageWarnings"
              echo " ~ ~ ~ "
              echo "##vso[task.logissue type=error]Result.Success is false."
              exit 1
            fi
          fi
        fi
        reportingTime=$((reportingTime + $(Report.Interval)))
        echo "Iteration: Reporting Time / Timeout (seconds): $reportingTime / ${{ parameters.reportTimeout }}"
        sleep $(Report.Interval)
      done
      if (( $reportingTime >= ${{ parameters.reportTimeout }} ))
      then
        echo " ~ ~ ~ "
        if [[ "${{ parameters.isTimeoutAnError }}" == "true" ]]
        then
          echo "##vso[task.logissue type=error]Report timeout."
          exit 1
        else
          echo "##vso[task.logissue type=warning]Report timeout."
        fi
      fi
      echo " ~ ~ ~ "
      projectDeployReportResultCheckOnly=$(echo $projectDeployReportJson | jq -r '.result.checkOnly')
      echo "Result.CheckOnly: $projectDeployReportResultCheckOnly"
      echo "##vso[task.setvariable variable=isCheckOnly]$projectDeployReportResultCheckOnly"
      projectDeployReportResultNumberComponentErrors=$(echo $projectDeployReportJson | jq -r '.result.numberComponentErrors')
      echo "Result.NumberComponentErrors: $projectDeployReportResultNumberComponentErrors"
      projectDeployReportResultNumberComponentsDeployed=$(echo $projectDeployReportJson | jq -r '.result.numberComponentsDeployed')
      echo "Result.NumberComponentsDeployed: $projectDeployReportResultNumberComponentsDeployed"
      projectDeployReportResultNumberComponentsTotal=$(echo $projectDeployReportJson | jq -r '.result.numberComponentsTotal')
      echo "Result.NumberComponentsTotal: $projectDeployReportResultNumberComponentsTotal"
      echo "##vso[task.setvariable variable=numberArtifacts]$projectDeployReportResultNumberComponentsTotal"
      projectDeployReportResultNumberTestErrors=$(echo $projectDeployReportJson | jq -r '.result.numberTestErrors')
      echo "Result.NumberTestErrors: $projectDeployReportResultNumberTestErrors"
      projectDeployReportResultNumberTestsCompleted=$(echo $projectDeployReportJson | jq -r '.result.numberTestsCompleted')
      echo "Result.NumberTestsCompleted: $projectDeployReportResultNumberTestsCompleted"
      projectDeployReportResultNumberTestsTotal=$(echo $projectDeployReportJson | jq -r '.result.numberTestsTotal')
      echo "Result.NumberTestsTotal: $projectDeployReportResultNumberTestsTotal"
      echo "##vso[task.setvariable variable=numberTests]$projectDeployReportResultNumberTestsTotal"
      echo " ~ ~ ~ "
      echo "End: Reporting Time (seconds): $reportingTime"
      echo "End: Job Id: ${{ parameters.projectDeployJobId }}"
    displayName: "SF: Project Deploy Report"
    name: projectDeployReport
    condition: |
      and(
        succeeded(),
        gt(variables.reportTimeout, 0),
        gt(variables['Report.Interval'], 0),
        not(${{ parameters.isDryRun }})
      )
