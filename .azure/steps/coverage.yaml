# coverage.yaml

parameters:
  orgApiName: Undefined
  accessToken: Undefined
  identifiedTests: Undefined
  isEnabledCoverage: false

steps:

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      echo "Build.BuildId: $(Build.BuildId)"
      tree -a $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default/classes/
      echo " ~ ~ ~ "
      cd $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default/classes/
      # ls .cls -1 # display exactly one class file name per line...
      # paste -sd, - # concatenate all lines of file names and separate each by a comma...
      apexClasses=$(ls *.cls -1 | paste -sd, -)
      # strip file extensions...
      apexClasses="${apexClasses//.cls/}"
      echo "Apex Classes: $apexClasses"
      echo "##vso[task.setvariable variable=apexClasses]$apexClasses"
      echo " ~ ~ ~ "
    displayName: "Identify Apex Classes"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo " ~ ~ ~ "
      echo "Identified Tests: ${{ parameters.identifiedTests }}"
      paramIdentifiedTests="${{ parameters.identifiedTests }}"
      # replace space-delimited with comma-delimited...
      specifiedTests="${paramIdentifiedTests// /,}"
      echo "Specified Tests: $specifiedTests"
      echo "##vso[task.setvariable variable=specifiedTests]$specifiedTests"
      echo " ~ ~ ~ "
    displayName: "Specify Apex Tests"
    condition: |
      and(
        succeeded(),
        ne(variables['apexClasses'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo "Access Token: ${{ parameters.accessToken }}"
      decodedAccessToken=$(echo '${{ parameters.accessToken }}' | base64 -d)
      echo "Specified Tests: $(specifiedTests)"
      echo "Org Api Version: $(OrgApiVersion)"
      if [[ "$(specifiedTests)" == "" ]]
      then
        echo "##vso[task.logissue type=error]Specified Tests is empty."
        exit 1
      else
        # execute apex tests in target org...
        apexRunTestJson=$(sf apex run test --target-org $decodedAccessToken --test-level RunSpecifiedTests --tests $(specifiedTests) --output-dir ./sonar --code-coverage --result-format json --api-version $(OrgApiVersion) --wait 1 --json)
        apexRunTestStatus=$(echo $apexRunTestJson | jq -r '.status')
        if [[ "$apexRunTestStatus" != "0" ]]
        then
          echo $apexRunTestJson | jq .
          echo "##vso[task.logissue type=error]Status is non-zero."
          exit 1
        else
          testRunId=$(echo $apexRunTestJson | jq -r '.result.testRunId')
          echo "Test Run Id: $testRunId"
          echo "##vso[task.setvariable variable=testRunId]$testRunId"
        fi
      fi
    displayName: "SF: Apex Run Test"
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ne(variables['specifiedTests'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo "Access Token: ${{ parameters.accessToken }}"
      decodedAccessToken=$(echo '${{ parameters.accessToken }}' | base64 -d)
      echo "Org Api Version: $(OrgApiVersion)"
      echo "Test Run Id: $(testRunId)"
      # retrieve apex test results from target org...
      apexGetTestJson=$(sf apex get test --test-run-id $(testRunId) --target-org $decodedAccessToken --output-dir ./sonar --code-coverage --result-format json --api-version $(OrgApiVersion) --json)
      apexGetTestStatus=$(echo $apexGetTestJson | jq -r '.status')
      if [[ "$apexGetTestStatus" != "0" ]]
      then
        echo $apexGetTestJson | jq .
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        echo "##vso[task.setvariable variable=hasTestResults]true"
        echo $apexGetTestJson | jq .
      fi
    displayName: "SF: Apex Get Test"
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ne(variables['testRunId'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
      tree -a $(Build.SourcesDirectory)/sonar/
      echo " ~ ~ ~ "
      echo "Apex Classes: $(apexClasses)"
      apexClassesJson=$(echo "$(apexClasses)" | jq -R 'split(",")')
      echo "$apexClassesJson"
      echo " ~ ~ ~ "
      specifiedCoverage=$(jq --argjson list "$apexClassesJson" 'map(select(.name as $n | $list | any(. == $n)))' $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json)
      echo $specifiedCoverage | jq .
      echo " ~ ~ ~ "
      echo $specifiedCoverage | jq . > $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      cat $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
    displayName: "Prepare Coverage Artifact"
    condition: |
      and(
        succeeded(),
        ne(variables['hasTestResults'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - task: PublishBuildArtifacts@1
    displayName: "Coverage: Publish Artifacts"
    condition: |
      and(
        succeeded(),
        ne(variables['apexClasses'], ''),
        ne(variables['hasTestResults'], ''),
        ${{ parameters.isEnabledCoverage }}
      )
    inputs:
      pathToPublish: "$(Build.SourcesDirectory)/sonar/test-result-codecoverage.json"
      artifactName: "Coverage.$(Build.BuildId).${{ upper( parameters.orgApiName ) }}"
