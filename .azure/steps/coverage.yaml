# coverage.yaml

parameters:
  orgApiName: Undefined
  accessToken: Undefined
  identifiedTests: Undefined
  isEnabledCoverage: false

steps:

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      echo "Build.BuildId: $(Build.BuildId)"
      tree -a $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default/classes/
      echo " ~ ~ ~ "
      cd $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default/classes/
      # ls .cls -1 # display exactly one class file name per line...
      # paste -sd, - # concatenate all lines of file names and separate each by a comma...
      apexClasses=$(ls *.cls -1 | paste -sd, -)
      # strip file extensions...
      apexClasses="${apexClasses//.cls/}"
      echo "Apex Classes: $apexClasses"
      echo "##vso[task.setvariable variable=apexClasses]$apexClasses"
      echo " ~ ~ ~ "
    displayName: "Identify Apex Classes"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo " ~ ~ ~ "
      echo "Identified Tests: ${{ parameters.identifiedTests }}"
      paramIdentifiedTests="${{ parameters.identifiedTests }}"
      # replace space-delimited with comma-delimited...
      specifiedTests="${paramIdentifiedTests// /,}"
      echo "Specified Tests: $specifiedTests"
      echo "##vso[task.setvariable variable=specifiedTests]$specifiedTests"
      echo " ~ ~ ~ "
    displayName: "Specify Apex Tests"
    condition: |
      and(
        succeeded(),
        ne(variables['apexClasses'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      alias="${{ upper( parameters.orgApiName ) }}"
      echo "Alias: $alias"
      domain="insperity--$alias.sandbox"
      if [[ "$alias" == "PROD" ]]
      then
        domain="insperity"
      fi
      echo "Domain: $domain"
      # for any Org, ApexTestQueue shows the current "Application Test Executions"...
      echo "Application Test Executions: https://$domain.my.salesforce-setup.com/lightning/setup/ApexTestQueue/home"
      #
      echo "Access Token: ${{ parameters.accessToken }}"
      decodedAccessToken=$(echo '${{ parameters.accessToken }}' | base64 -d)
      echo "Specified Tests: $(specifiedTests)"
      echo "Org Api Version: $(OrgApiVersion)"
      if [[ "$(specifiedTests)" == "" ]]
      then
        echo "##vso[task.logissue type=error]Specified Tests is empty."
        exit 1
      else
        # execute apex tests in target org...
        apexRunTestJson=$(sf apex run test --target-org $decodedAccessToken --test-level RunSpecifiedTests --tests $(specifiedTests) --output-dir ./sonar --code-coverage --result-format json --api-version $(OrgApiVersion) --wait 1 --json)
        apexRunTestStatus=$(echo $apexRunTestJson | jq -r '.status')
        if [[ "$apexRunTestStatus" != "0" ]]
        then
          echo $apexRunTestJson | jq .
          echo "##vso[task.logissue type=error]Status is non-zero."
          exit 1
        else
          testRunId=$(echo $apexRunTestJson | jq -r '.result.testRunId')
          echo "Test Run Id: $testRunId"
          echo "##vso[task.setvariable variable=testRunId]$testRunId"
          if [[ "$testRunId" == "null" ]]
          then
            testRunId=$(echo $apexRunTestJson | jq -r '.result.summary.testRunId')
            echo "Test Run Id: $testRunId"
            echo "##vso[task.setvariable variable=testRunId]$testRunId"
          fi
        fi
      fi
    displayName: "SF: Apex Run Test"
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ne(variables['specifiedTests'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo "Access Token: ${{ parameters.accessToken }}"
      decodedAccessToken=$(echo '${{ parameters.accessToken }}' | base64 -d)
      echo "Org Api Version: $(OrgApiVersion)"
      echo "Test Run Id: $(testRunId)"
      # retrieve apex test results from target org...
      apexGetTestJson=$(sf apex get test --test-run-id $(testRunId) --target-org $decodedAccessToken --output-dir ./sonar --code-coverage --result-format json --api-version $(OrgApiVersion) --json)
      apexGetTestStatus=$(echo $apexGetTestJson | jq -r '.status')
      if [[ "$apexGetTestStatus" != "0" ]]
      then
        echo $apexGetTestJson | jq .
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        echo "##vso[task.setvariable variable=hasTestResults]true"
        echo $apexGetTestJson | jq .
      fi
    displayName: "SF: Apex Get Test"
    continueOnError: true
    condition: |
      and(
        succeeded(),
        ne(variables['testRunId'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - bash: |
      echo " ~ ~ ~ "
      # task starts with current working directory as the build sources directory...
      echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
      tree -a $(Build.SourcesDirectory)/sonar/
      echo " ~ ~ ~ "
      # convert comma-separated apex class names into json array...
      echo "Apex Classes: $(apexClasses)"
      apexClassesJson=$(echo "$(apexClasses)" | jq -R 'split(",")')
      echo "$apexClassesJson"
      # extract specified coverage from the test results for the given apex classes...
      specifiedCoverage=$(jq --argjson list "$apexClassesJson" 'map(select(.name as $n | $list | any(. == $n)))' $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json)
      # prepare specified coverage artifact file...
      echo $specifiedCoverage | jq . > $(Build.SourcesDirectory)/sonar/test-result-codecoverage.specified.json
      # checkout original coverage file from branch...
      git checkout $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
      # replace specified coverage for the given apex classes in the original coverage file from branch...
      echo "Replace: JQ Slurp: $(Build.SourcesDirectory)/sonar/test-result-codecoverage.specified.json"
      replacedCoverage=$(jq --slurpfile updates $(Build.SourcesDirectory)/sonar/test-result-codecoverage.specified.json '( $updates[] | INDEX(.name) ) as $dict | map( if $dict[.name] then $dict[.name] else . end )' $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json)
      # prepare coverage artifact file...
      echo $replacedCoverage | jq . > $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
      echo "GIT Diff: $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json"
      git diff $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
      # add specified coverage for the given apex classes missing from the original coverage file from branch...
      echo "Add: JQ Slurp: $(Build.SourcesDirectory)/sonar/test-result-codecoverage.specified.json"
      addedCoverage=$(jq -s '.[0] as $existing | .[1] as $specified | ($existing | map(.name)) as $existing_names | $existing + ($specified | map(select(.name as $n | $existing_names | index($n) | not)))' $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json $(Build.SourcesDirectory)/sonar/test-result-codecoverage.specified.json)
      # prepare coverage artifact file...
      echo $addedCoverage | jq . > $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
      echo "GIT Diff: $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json"
      git diff $(Build.SourcesDirectory)/sonar/test-result-codecoverage.json
      echo " ~ ~ ~ "
      # remove unwanted artifact files...
      echo "GIT Clean: $(Build.SourcesDirectory)/sonar/test-result-$(testRunId)*"
      git clean -f $(Build.SourcesDirectory)/sonar/test-result-$(testRunId)*
      echo "GIT Clean: $(Build.SourcesDirectory)/sonar/test-run-id.txt"
      git clean -f $(Build.SourcesDirectory)/sonar/test-run-id.txt
      echo " ~ ~ ~ "
    displayName: "Prepare Coverage Artifacts"
    condition: |
      and(
        succeeded(),
        ne(variables['testRunId'], ''),
        ne(variables['hasTestResults'], ''),
        ${{ parameters.isEnabledCoverage }}
      )

  - task: PublishBuildArtifacts@1
    displayName: "Coverage: Publish Artifacts"
    condition: |
      and(
        succeeded(),
        ne(variables['apexClasses'], ''),
        ne(variables['hasTestResults'], ''),
        ${{ parameters.isEnabledCoverage }}
      )
    inputs:
      pathToPublish: "$(Build.SourcesDirectory)/sonar/"
      artifactName: "Coverage.$(Build.BuildId).${{ upper( parameters.orgApiName ) }}"
