# confirm.yaml

parameters:
  validatedPackageId: '~'

steps:
  - checkout: none
  - bash: |
      echo " ~ ~ ~ "
      echo "Validated Package Id: ${{ parameters.validatedPackageId }}"
      if [[ "${{ parameters.validatedPackageId }}" == "" ]]
      then
        echo "##vso[task.logissue type=error]Validated Package Id is blank."
        exit 1
      fi
      echo " ~ ~ ~ "
    displayName: "Confirm"
    condition: |
      and(
        succeeded(),
        ne(variables.validatedPackageId, '~')
      )
