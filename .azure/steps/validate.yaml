# validate.yaml

parameters:
  accessToken: Undefined
  validateTests: '~'
  identifiedTests: Undefined

steps:

  #
  # Convert
  #

  - bash: |
      echo " ~ ~ ~ "
      echo "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
      echo " ~ ~ ~ "
      cat $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/package/package.xml
      echo "" # missing new line at the end of package.xml
      echo " ~ ~ ~ "
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
      projectConvertSourceJson=$(sf project convert source --root-dir $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/force-app/main/default --output-dir $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/metadataFormatted --json)
      echo $projectConvertSourceJson | jq .
      projectConvertSourceStatus=$(echo $projectConvertSourceJson | jq -r '.status')
      echo "Status: $projectConvertSourceStatus"
      if [[ "$projectConvertSourceStatus" != "0" ]]
      then
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        projectConvertSourceResultLocation=$(echo $projectConvertSourceJson | jq -r '.result.location')
        echo "Result.Location: $projectConvertSourceResultLocation"
        echo "##vso[task.setvariable variable=projectConvertSourceLocation]$projectConvertSourceResultLocation"
      fi
      echo " ~ ~ ~ "
      tree -a $(Build.ArtifactStagingDirectory)
      echo " ~ ~ ~ "
    displayName: "SF: Convert Source To Metadata"
    condition: succeeded()

  #
  # Check-Only
  #

  - bash: |
      echo "Access Token: ${{ parameters.accessToken }}"
      validateTestLevel="RunSpecifiedTests"
      echo "Test Level: $validateTestLevel"
      echo "Validate Tests: ${{ parameters.validateTests }}"
      echo "Identified Tests: ${{ parameters.identifiedTests }}"
      echo "IdentifyTests.Verbose: $(IdentifyTests.Verbose)"
      runTests="${{ parameters.validateTests }}"
      if [[ "$(IdentifyTests.Verbose)" == "false" && "${{ parameters.validateTests }}" == "~" ]]
      then
        runTests="${{ parameters.identifiedTests }}"
      fi
      if [[ "$runTests" == "" || "$runTests" == "~" || "$runTests" == "Undefined" ]]
      then
        runTests="NSP_ServiceConstantsTest"
      fi
      echo "Run Tests: $runTests"
      projectDeployValidateJson=$(sf project deploy validate --metadata-dir $(Build.ArtifactStagingDirectory)/Package.$(Build.BuildId)/metadataFormatted --target-org ${{ parameters.accessToken }} --test-level $validateTestLevel --tests $runTests --async --verbose --json)
      echo $projectDeployValidateJson | jq .
      projectDeployValidateStatus=$(echo $projectDeployValidateJson | jq -r '.status')
      echo "Status: $projectDeployValidateStatus"
      if [[ "$projectDeployValidateStatus" != "0" ]]
      then
        echo "##vso[task.logissue type=error]Status is non-zero."
        exit 1
      else
        projectDeployValidateResultId=$(echo $projectDeployValidateJson | jq -r '.result.id')
        echo "Result.Id: $projectDeployValidateResultId"
        echo "##vso[task.setvariable variable=projectDeployJobId;isOutput=true]$projectDeployValidateResultId"
      fi
    displayName: "SF: Project Deploy Validate"
    name: projectDeployValidate
    condition: succeeded()
    retryCountOnTaskFailure: 10
