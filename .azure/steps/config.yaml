# config.yaml

parameters:
  orgApiName: Undefined

steps:
  - bash: |
      alias=${{ lower( parameters.orgApiName ) }}
      domain="insperity--$alias.sandbox"
      if [[ "$alias" == "prod" ]]
      then
        domain="insperity"
      fi
      sf config set org-instance-url="https://$domain.my.salesforce.com"
      sf config set org-api-version="$(OrgApiVersion)"
    displayName: "SF: Config Set"
