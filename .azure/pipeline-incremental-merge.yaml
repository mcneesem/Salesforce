# pipeline-incremental-merge.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: f8913db1ff552d0648082d9742c4b0aeb6218433
  - name: paramValidateTests
    displayName: Validate Tests (space-delimited)
    type: string
    default: NSP_ServiceConstantsTest NSP_SalesConstantsTest
  - name: paramReportTimeout
    displayName: Report Timeout (seconds)
    type: number
    default: 600
  - name: paramIsDryRun
    displayName: Dry Run
    type: boolean
    default: true

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: ${{ parameters.paramValidateTests }}
  # Report
  - name: reportTimeout
    value: ${{ parameters.paramReportTimeout }}

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      fromCommit: "$(fromCommit)"
      isEnabledTag: true

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "MERGE"
      dependsOnStage: "Package"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true

  #
  # Quick Deploy
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "MERGE"
      dependsOnStage: "CheckOnlyStageMERGE"
      reportTimeout: $(reportTimeout)
      isDryRun: ${{ parameters.paramIsDryRun }}
      fromCommit: "$(fromCommit)"

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml
