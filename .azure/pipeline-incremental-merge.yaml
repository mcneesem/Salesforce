# pipeline-incremental-merge.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: '~'

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: $(Validate.Tests.Merge)
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.Merge)

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "MERGE"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Merge)"
      isEnabledTag: true

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE"
      dependsOnStage: "Package"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isTimeoutAnError: true

  #
  # Quick Deploy
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE"
      dependsOnStage: "CheckOnlyStageMERGE"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isDryRun: false

  #
  # Testim
  #

  - template: ./stages/testim.yaml
    parameters:
      dependsOnStage: "QuickDeployStageMERGE"
      orgApiName: "MERGE"
      environmentName: "Salesforce-Testim"

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml

  #
  # Lint
  #

  - template: ./stages/lint.yaml
