# pipeline-release-candidate.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: '~'
  - name: paramIsEnabledBlackDuck
    displayName: Is Enabled Black Duck
    type: boolean
    default: false

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: $(Validate.Tests.Release)
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.Release)

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "PROD"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Release)"
      isEnabledTag: true

  #
  # Check Only: PROXY
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "PROXY"
      environmentName: "Salesforce-PROXY"
      dependsOnStage: "Package"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true

  #
  # Check Only: TEST
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "TEST"
      environmentName: "Salesforce-TEST"
      dependsOnStage: "CheckOnlyStagePROXY"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true

  #
  # Check Only: STAGE
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "STAGE"
      environmentName: "Salesforce-STAGE-Validate"
      dependsOnStage: "CheckOnlyStageTEST"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isTimeoutAnError: true

  #
  # Quick Deploy: STAGE
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "STAGE"
      environmentName: "Salesforce-STAGE"
      dependsOnStage: "CheckOnlyStageSTAGE"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isDryRun: false

  #
  # Check Only: PROD
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "PROD"
      environmentName: "Salesforce-PROD-Validate"
      dependsOnStage: "QuickDeployStageSTAGE"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isTimeoutAnError: true

  #
  # Quick Deploy: PROD
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "PROD"
      environmentName: "Salesforce-PROD"
      dependsOnStage: "CheckOnlyStagePROD"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isDryRun: false

  #
  # Testim: STAGE
  #

  - template: ./stages/testim.yaml
    parameters:
      dependsOnStage: "QuickDeployStageSTAGE"
      orgApiName: "STAGE"
      environmentName: "Salesforce-Testim"

  #
  # Testim: PROD
  #

  - template: ./stages/testim.yaml
    parameters:
      dependsOnStage: "QuickDeployStagePROD"
      orgApiName: "PROD"
      environmentName: "Salesforce-Testim"

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml

  #
  # Lint
  #

  - template: ./stages/lint.yaml

  #
  # Black Duck
  #

  - template: ./stages/blackduck.yaml
    parameters:
      isEnabledBlackDuck: ${{ parameters.paramIsEnabledBlackDuck }}
