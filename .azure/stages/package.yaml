# package.yaml

parameters:
  fromCommit: Undefined
  conditionStage: true
  dependsOnStage: ''
  isEnabledTag: false
  isEnabledGetSpecifiedTests: false

stages:
  - stage: Package
    displayName: "Package"
    condition: |
      and(
        succeeded(),
        ${{ parameters.conditionStage }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    jobs:
      - template: ./../../jobs/package.yaml
        parameters:
          fromCommit: "$(fromCommit)"
          isEnabledTag: ${{ parameters.isEnabledTag }}
          isEnabledGetSpecifiedTests: ${{ parameters.isEnabledGetSpecifiedTests }}
