# sonar.yaml

parameters:
  isEnabledSonar: true
  dependsOnStage: 'Package'

stages:
  - stage: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    jobs:
      - template: ./../../jobs/sonar.yaml
        parameters:
          isEnabledSonar: ${{ parameters.isEnabledSonar }}
