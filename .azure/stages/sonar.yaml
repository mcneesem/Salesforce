# sonar.yaml

parameters:
  isEnabledSonar: true
  isStandAlone: false

stages:
  - stage: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
    ${{ if not( parameters.isStandAlone ) }}:
      dependsOn:
        - Package
    jobs:
      - template: ./../../jobs/sonar.yaml
        parameters:
          isEnabledSonar: ${{ parameters.isEnabledSonar }}
