# sonar.yaml

parameters:
  isEnabled: true

stages:
  - stage: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        eq(${{ parameters.isEnabled }}, true)
      )
    dependsOn:
      - Package
    jobs:
      - template: ./../../jobs/sonar.yaml
        parameters:
          isEnabled: ${{ parameters.isEnabled }}
