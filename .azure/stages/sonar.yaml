# sonar.yaml

parameters:
  isEnabledSonar: true

stages:
  - stage: Sonar
    displayName: "Sonar"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledSonar }}
      )
    dependsOn:
      - Package
    jobs:
      - template: ./../../jobs/sonar.yaml
        parameters:
          isEnabledSonar: ${{ parameters.isEnabledSonar }}
