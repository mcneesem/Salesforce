# check-only.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  dependsOnStage: Undefined
  validateTests: '~'
  reportTimeout: 30
  fromCommit: Undefined
  isTimeoutAnError: false
  isEnabledCheckOnly: true
  isEnabledNotification: true
  isEnabledTag: false

stages:
  - stage: "CheckOnlyStage${{ parameters.orgApiName }}"
    displayName: "Check Only: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledCheckOnly }}
      )
    ${{ if eq( parameters.dependsOnStage , 'Package' ) }}:
      dependsOn:
        - Package
    ${{ else }}:
      dependsOn:
        - Package
        - ${{ parameters.dependsOnStage }}
    variables:
      identifiedTests: $[ stageDependencies.Package.Package.outputs['scanApexTests.identifiedTests'] ]
      lastDeployedCommit: $[ stageDependencies.Package.Package.outputs['lastDeployedCommit.lastDeployedCommit'] ]
    jobs:
      - template: ./../../jobs/check-only.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          environmentName: "${{ parameters.environmentName }}"
          validateTests: "${{ parameters.validateTests }}"
          identifiedTests: "$(identifiedTests)"
          reportTimeout: ${{ parameters.reportTimeout }}
          fromCommit: "$(lastDeployedCommit)"
          isTimeoutAnError: ${{ parameters.isTimeoutAnError }}
          isEnabledNotification: ${{ parameters.isEnabledNotification }}
          isEnabledTag: ${{ parameters.isEnabledTag }}
