# coverage.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  dependsOnStage: Undefined
  validateTests: '~'
  isEnabledCoverage: true

stages:
  - stage: "CoverageStage${{ parameters.orgApiName }}"
    displayName: "Coverage: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledCoverage }}
      )
    ${{ if eq( parameters.dependsOnStage , 'Package' ) }}:
      dependsOn:
        - Package
    ${{ else }}:
      dependsOn:
        - Package
        - ${{ parameters.dependsOnStage }}
    variables:
      identifiedTests: $[ stageDependencies.Package.Package.outputs['scanApexTests.identifiedTests'] ]
    jobs:
      - template: ./../../jobs/coverage.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          environmentName: "${{ parameters.environmentName }}"
          identifiedTests: "$(identifiedTests)"
          isEnabledCoverage: ${{ parameters.isEnabledCoverage }}
