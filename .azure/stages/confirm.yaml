# confirm.yaml

parameters:
  isEnabledConfirm: true
  orgApiName: Undefined
  dependsOnStage: Undefined

stages:
  - stage: "ConfirmStage${{ parameters.orgApiName }}"
    displayName: "Confirm: ${{ parameters.orgApiName }}"
    condition: |
      and(
        ${{ parameters.isEnabledConfirm }},
        not(failed()),
        not(canceled())
      )
    ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
      variables:
        validatedPackageId: $[ stageDependencies.${{ parameters.dependsOnStage }}.CheckOnly.outputs['CheckOnly.projectDeployReport.successfulJobId'] ]
    jobs:
      - template: ./../../jobs/confirm.yaml
        parameters:
          validatedPackageId: "$(validatedPackageId)"
