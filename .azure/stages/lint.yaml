# lint.yaml

parameters:
  isEnabledLint: true
  dependsOnStage: 'Package'

stages:
  - stage: Lint
    displayName: "Lint"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledLint }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    jobs:
      - template: ./../../jobs/lint.yaml
        parameters:
          isEnabledLint: ${{ parameters.isEnabledLint }}
