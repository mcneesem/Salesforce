# blackduck.yaml

parameters:
  isEnabledBlackDuck: true
  dependsOnStage: 'Package'


stages:
  - stage: BlackDuck
    displayName: "Black Duck"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledBlackDuck }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    variables:
      - group: "BlackDuck Bridge"
    jobs:
      - template: ./../../jobs/blackduck.yaml
        parameters:
          isEnabledBlackDuck: ${{ parameters.isEnabledBlackDuck }}
