# quick-deploy.yaml

parameters:
  orgApiName: Undefined
  environmentName: Undefined
  conditionStage: true
  dependsOnStage: Undefined
  validatedPackageId: '~'
  reportTimeout: 30
  isDryRun: true
  fromCommit: Undefined
  isEnabledNotification: true
  isEnabledTag: false

stages:
  - stage: "QuickDeployStage${{ parameters.orgApiName }}"
    displayName: "Quick Deploy: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.conditionStage }}
      )
    ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
      dependsOn:
        - Package
        - ${{ parameters.dependsOnStage }}
    ${{ else }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
      variables:
        validatedPackageId: $[ stageDependencies.${{ parameters.dependsOnStage }}.CheckOnly.outputs['CheckOnly.projectDeployReport.successfulJobId'] ]
        lastDeployedCommit: $[ stageDependencies.Package.Package.outputs['lastDeployedCommit.lastDeployedCommit'] ]
    jobs:
      - template: ./../../jobs/quick-deploy.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          environmentName: "${{ parameters.environmentName }}"
          ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
            validatedPackageId: "$(validatedPackageId)"
          ${{ else }}:
            validatedPackageId: "${{ parameters.validatedPackageId }}"
          reportTimeout: ${{ parameters.reportTimeout }}
          isDryRun: ${{ parameters.isDryRun }}
          ${{ if startsWith( parameters.dependsOnStage , 'CheckOnlyStage' ) }}:
            fromCommit: "$(lastDeployedCommit)"
          ${{ else }}:
            fromCommit: "${{ parameters.fromCommit }}"
          isEnabledNotification: ${{ parameters.isEnabledNotification }}
          isEnabledTag: ${{ parameters.isEnabledTag }}
