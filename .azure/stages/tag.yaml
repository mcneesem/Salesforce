# tag.yaml

parameters:
  tagCommit: ''
  tagLabel: ''
  fetchDepth: 1
  isDryRun: true
  isEnabledTag: false
  dependsOnStage: 'Package'

stages:
  - stage: Tag
    displayName: "Tag"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTag }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    jobs:
      - template: ./../../jobs/tag.yaml
        parameters:
          tagCommit: ${{ parameters.tagCommit }}
          tagLabel: ${{ parameters.tagLabel }}
          fetchDepth: ${{ parameters.fetchDepth }}
          isDryRun: ${{ parameters.isDryRun }}
          isEnabledTag: ${{ parameters.isEnabledTag }}
