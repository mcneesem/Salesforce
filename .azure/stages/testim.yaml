# testim.yaml

parameters:
  dependsOnStage: 'Initialize'
  orgApiName: Undefined
  environmentName: Undefined
  isEnabledTestim: true

stages:
  - stage: "TestimStage${{ parameters.orgApiName }}"
    displayName: "Testim: ${{ parameters.orgApiName }}"
    condition: |
      and(
        succeeded(),
        ${{ parameters.isEnabledTestim }}
      )
    ${{ if ne( parameters.dependsOnStage , '' ) }}:
      dependsOn:
        - ${{ parameters.dependsOnStage }}
    jobs:
      - template: ./../../jobs/testim.yaml
        parameters:
          orgApiName: "${{ parameters.orgApiName }}"
          environmentName: "${{ parameters.environmentName }}"
          isEnabledTestim: ${{ parameters.isEnabledTestim }}
