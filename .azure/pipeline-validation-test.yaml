# pipeline-validation-test.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: $(FromCommit.PullRequests.Test)
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Report
  - name: reportTimeout
    value: $(Report.Timeout.Test)

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "TEST"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Test)"

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "TEST"
      environmentName: "Salesforce-TEST-Validate"
      dependsOnStage: "Package"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isTimeoutAnError: true
      isEnabledNotification: false

  #
  # Confirm
  #

  - template: ./stages/confirm.yaml
    parameters:
      orgApiName: "TEST"
      dependsOnStage: "CheckOnlyStageTEST"
