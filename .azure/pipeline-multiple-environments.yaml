# pipeline-multiple-environments.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)
# name: "$(Date:yyyyMMdd).$(Rev:r)" # default value...

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: '~'
  - name: paramValidateTests
    displayName: Validate Tests (space-delimited)
    type: string
    default: '~'
  - name: paramReportTimeout
    displayName: Report Timeout (seconds)
    type: number
    default: 600
  - name: paramIsDryRun
    displayName: Dry Run
    type: boolean
    default: true
  - name: paramIsEnabledSonar
    displayName: Is Enabled Sonar
    type: boolean
    default: false

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: ${{ parameters.paramValidateTests }}
  # Quick Deploy
  - name: isDryRun
    value: ${{ parameters.paramIsDryRun }}
  # Report
  - name: reportTimeout
    value: ${{ parameters.paramReportTimeout }}
  # Sonar
  - name: isEnabledSonar
    value: ${{ parameters.paramIsEnabledSonar }}

lockBehavior: sequential

stages:

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "PROXY"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(ParentBranch.Release)"

  #
  # Check Only: PROXY
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "PROXY"
      environmentName: "Salesforce-PROXY"
      dependsOnStage: "Package"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false

  #
  # Quick Deploy: PROXY
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "PROXY"
      environmentName: "Salesforce-PROXY"
      dependsOnStage: "CheckOnlyStagePROXY"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false
      isDryRun: ${{ parameters.paramIsDryRun }}

  #
  # Check Only: MERGE
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE"
      dependsOnStage: "QuickDeployStagePROXY"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false

  #
  # Quick Deploy: MERGE
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "MERGE"
      environmentName: "Salesforce-MERGE"
      dependsOnStage: "CheckOnlyStageMERGE"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false
      isDryRun: ${{ parameters.paramIsDryRun }}

  #
  # Check Only: TEST
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "TEST"
      environmentName: "Salesforce-TEST"
      dependsOnStage: "QuickDeployStageMERGE"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false

  #
  # Quick Deploy: TEST
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "TEST"
      environmentName: "Salesforce-TEST"
      dependsOnStage: "CheckOnlyStageTEST"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false
      isDryRun: ${{ parameters.paramIsDryRun }}

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml
    parameters:
      isEnabledSonar: ${{ parameters.paramIsEnabledSonar }}
