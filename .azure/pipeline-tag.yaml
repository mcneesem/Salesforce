# pipeline-tag.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)

parameters:
  - name: paramTagCommit
    displayName: Tag Commit
    type: string
    default: '~'
  - name: paramTagLabel
    displayName: Tag Label
    type: string
    default: '~'
  - name: paramFetchDepth
    displayName: Fetch Depth
    type: number
    default: 25
  - name: paramIsDryRun
    displayName: Dry Run
    type: boolean
    default: true

variables:
  - group: Salesforce
  # Authenticate
  - name: agent_skipCertValidation
    value: true

stages:

  #
  # Tag
  #

  - template: ./stages/tag.yaml
    parameters:
      dependsOnStage: ''
      tagCommit: "${{ parameters.paramTagCommit }}"
      tagLabel: "${{ parameters.paramTagLabel }}"
      fetchDepth: ${{ parameters.paramFetchDepth }}
      isDryRun: ${{ parameters.paramIsDryRun }}
      isEnabledTag: true
