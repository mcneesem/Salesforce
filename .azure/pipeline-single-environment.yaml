# pipeline-single-environment.yaml

pool: Linux

trigger: none

name: $(Build.BuildId)
# name: "$(Date:yyyyMMdd).$(Rev:r)" # default value...

parameters:
  - name: paramFromCommit
    displayName: From Commit
    type: string
    default: '~'
  - name: paramParentBranchName
    displayName: Parent Branch Name
    type: string
    default: production
  - name: paramOrgApiName
    displayName: Org API Name
    type: string
    default: merge
    values:
    - proxy
    - merge
    - test
    # - stage
    # - prod
  - name: paramValidateTests
    displayName: Validate Tests (space-delimited)
    type: string
    default: '~'
  - name: paramValidatedPackageId
    displayName: Validated Package Id (18-character)
    type: string
    default: '~'
  - name: paramReportTimeout
    displayName: Report Timeout (seconds)
    type: number
    default: 30
  - name: paramIsDryRun
    displayName: Dry Run
    type: boolean
    default: true
  - name: paramIsEnabledSonar
    displayName: Is Enabled Sonar
    type: boolean
    default: false
  - name: paramIsEnabledLint
    displayName: Is Enabled Lint
    type: boolean
    default: false
  - name: paramIsEnabledTestim
    displayName: Is Enabled Testim
    type: boolean
    default: false
  - name: paramIsEnabledBlackDuck
    displayName: Is Enabled Black Duck
    type: boolean
    default: false

variables:
  - group: Salesforce
  # Package
  - name: fromCommit
    value: ${{ parameters.paramFromCommit }}
  # Package
  - name: parentBranchName
    value: ${{ parameters.paramParentBranchName }}
  # Config Set
  - name: orgApiName
    value: ${{ parameters.paramOrgApiName }}
  # Authenticate
  - name: agent_skipCertValidation
    value: true
  # Check Only
  - name: validateTests
    value: ${{ parameters.paramValidateTests }}
  # Quick Deploy
  - name: isDryRun
    value: ${{ parameters.paramIsDryRun }}
  # Report
  - name: reportTimeout
    value: ${{ parameters.paramReportTimeout }}

lockBehavior: sequential

stages:

  #
  # Initialize
  #

  - stage: Initialize
    displayName: "Initialize"
    jobs:
      - job: Bash
        displayName: "Bash"
        workspace:
          clean: all
        steps:
          - checkout: none
          - bash: |
              printenv
            displayName: "Verify Environment Variables"

  #
  # Package
  #

  - template: ./stages/package.yaml
    parameters:
      orgApiName: "${{ upper(variables.orgApiName) }}"
      fromCommit: "$(fromCommit)"
      parentBranchName: "$(parentBranchName)"
      conditionStage: ${{ eq( parameters.paramValidatedPackageId , '~' ) }}
      dependsOnStage: "Initialize"
      isEnabledTag: true

  #
  # Check Only
  #

  - template: ./stages/check-only.yaml
    parameters:
      orgApiName: "${{ upper(variables.orgApiName) }}"
      environmentName: "Salesforce-${{ upper(variables.orgApiName) }}"
      dependsOnStage: "Package"
      validateTests: "$(validateTests)"
      reportTimeout: $(reportTimeout)
      fromCommit: "$(fromCommit)"
      isEnabledTag: true
      isEnabledNotification: false

  #
  # Quick Deploy
  #

  - template: ./stages/quick-deploy.yaml
    parameters:
      orgApiName: "${{ upper(variables.orgApiName) }}"
      environmentName: "Salesforce-${{ upper(variables.orgApiName) }}"
      conditionStage: ${{ ne( parameters.paramValidatedPackageId , '~' ) }}
      dependsOnStage: "Initialize"
      validatedPackageId: "${{ parameters.paramValidatedPackageId }}"
      reportTimeout: $(reportTimeout)
      isDryRun: ${{ parameters.paramIsDryRun }}
      fromCommit: "$(fromCommit)"
      isEnabledNotification: false

  #
  # Sonar
  #

  - template: ./stages/sonar.yaml
    parameters:
      isEnabledSonar: ${{ parameters.paramIsEnabledSonar }}

  #
  # Lint
  #

  - template: ./stages/lint.yaml
    parameters:
      isEnabledLint: ${{ parameters.paramIsEnabledLint }}

  #
  # Testim
  #

  - template: ./stages/testim.yaml
    parameters:
      dependsOnStage: "Initialize"
      orgApiName: "${{ upper(variables.orgApiName) }}"
      isEnabledTestim: ${{ parameters.paramIsEnabledTestim }}

  #
  # Black Duck
  #

  - template: ./stages/blackduck.yaml
    parameters:
      isEnabledBlackDuck: ${{ parameters.paramIsEnabledBlackDuck }}
